<!DOCTYPE html>
<html lang="es">
<head>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
(async()=>{
  try{
    const cfg = await (await fetch('https://gjyzdwsfdmdfhcspvxbz.supabase.co/functions/v1/niva-config')).json();
    const sb = createClient(cfg.url, cfg.anon);
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.replace('./index.html'); return; }
    window.__nivaSession = session;
    window.__nivaSb = sb;
    window.__nivaCfg = cfg;
    sb.auth.onAuthStateChange((_e, s)=>{ if(!s) window.location.replace('./index.html'); });
  }catch(e){ console.error('niva-auth-guard', e); window.location.replace('./index.html'); }
})();
</script>

<script type="module">
async function esperarAuthListo(){
  let tries=0;
  while(!window.__nivaSb && tries<100){ await new Promise(r=>setTimeout(r,50)); tries++; }
}
await esperarAuthListo();
const sb = window.__nivaSb;
const session = window.__nivaSession;
const $=s=>document.querySelector(s);
const esc=(v)=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const fmt=(n)=>n==null?'':'$'+Number(n).toLocaleString('es-MX');
const fFecha=(d)=>d?new Date(d).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'2-digit'}):'';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function vacioHTML(txt,icon){return '<div class="vacio"><span class="vi">'+(icon||'📭')+'</span>'+txt+'</div>'}

let PROPS=[], CONTACTS=[], ASESORES=[], CIERRES=[], ESADMIN=false, USUARIO='';
let COMPARTIDA=false, TRAIGO='propiedad', TIPO='confirmado';
let MI_ASESOR=null;

async function cargar(){
  const uname=(session.user?.email||'').split('@')[0];
  USUARIO=uname; ESADMIN=(uname==='admin');
  const [p,c,a,ci] = await Promise.all([
    sb.from('my_properties').select('*'),
    sb.from('contacts').select('id,full_name,phone_normalized').order('full_name'),
    sb.from('advisors').select('id,first_name,last_name,niva_code,status,porcentaje_niva'),
    sb.from('cierres').select('*').order('created_at',{ascending:false})
  ]);
  PROPS = p.error?[]:(p.data||[]);
  CONTACTS = c.error?[]:(c.data||[]);
  if(p.error) toast('No se pudieron cargar las propiedades: '+(p.error.message||''));
  if(c.error) toast('No se pudieron cargar los clientes: '+(c.error.message||''));
  ASESORES = (a.data||[]).filter(x=>x.status!=='inactive')
    .map(x=>({id:x.id,n:(((x.first_name||'')+' '+(x.last_name||'')).trim())||x.niva_code||'Asesor',pn:Number(x.porcentaje_niva??20),fn:(x.first_name||'').trim().toLowerCase()}))
    .sort((x,y)=>x.n.localeCompare(y.n));
  MI_ASESOR = ASESORES.find(a=>a.fn===uname.toLowerCase())||null;
  CIERRES = ci.error?[]:(ci.data||[]);
  CIERRES.sort((a,b)=>new Date(a.fecha_cierre||a.created_at)-new Date(b.fecha_cierre||b.created_at));
  poblarSelects();
  renderLista();
  if(ESADMIN) renderAdminZona();
}

function poblarSelects(){
  const nombre = MI_ASESOR ? MI_ASESOR.n : (USUARIO.charAt(0).toUpperCase()+USUARIO.slice(1));
  $('#ci-quien').innerHTML='👤 Registrando como <strong>'+esc(nombre)+'</strong>';
  const fEl=$('#ci-fecha');
  if(fEl && !fEl.value) fEl.value=new Date().toISOString().slice(0,10);
}
$('#ci-tipo-tog').addEventListener('click',e=>{
  const b=e.target.closest('button[data-v]');
  if(!b)return;
  document.querySelectorAll('#ci-tipo-tog button').forEach(x=>x.classList.toggle('on',x===b));
  TIPO=b.dataset.v;

async function guardarCierre(){
  const propEl=$('#ci-prop'), cliEl=$('#ci-cliente');
  const advisorId=MI_ASESOR ? MI_ASESOR.id : null;
  const advisorNombre=MI_ASESOR ? null : (USUARIO.charAt(0).toUpperCase()+USUARIO.slice(1));
  const op=$('#ci-op').value;
  const monto=Number($('#ci-monto').value);
  const notas=$('#ci-notas').value.trim();
  const err=$('#ci-err'), btn=$('#ci-save');

  const propExterna=propEl.value.trim();
  if(propExterna.length<3){err.textContent='Escribe la propiedad que se cerró.';return}
  const propId=null;

  const clienteNombre=cliEl.value.trim();
  if(clienteNombre.length<3){err.textContent='Escribe el nombre del cliente.';return}
  const contactId=null;

  if(!monto||monto<=0){err.textContent='Escribe la comisión total recibida.';return}
  const valorProp=Number($('#ci-valor').value)||null;
  const ubicacion=$('#ci-ubicacion').value.trim()||null;
  const fecha=$('#ci-fecha').value || new Date().toISOString().slice(0,10);
  const estatusInicial = TIPO==='apartado' ? 'apartado' : 'pendiente';
  err.textContent='';btn.disabled=true;btn.textContent='Guardando...';
  let error=null;
  try{
    const r=await sb.from('cierres').insert({
      property_id:propId, property_externa:propExterna,
      contact_id:contactId, cliente_nombre:clienteNombre,
      advisor_id:advisorId, advisor_nombre:advisorNombre, operation_type:op,
      compartida:COMPARTIDA, trae:COMPARTIDA?TRAIGO:null,
      monto_comision:monto, porcentaje_niva:MI_ASESOR?MI_ASESOR.pn:20,
      valor_propiedad:valorProp, ubicacion:ubicacion, fecha_cierre:fecha,
      estatus:estatusInicial,
      notas:notas||null, registrado_por:USUARIO
    });
    error=r.error;
  }catch(ex){
    error=ex;
  }
  btn.disabled=false;btn.textContent = TIPO==='apartado' ? 'Registrar apartado (en verde)' : 'Registrar cierre';
  if(error){err.textContent=error.message||'No se pudo registrar el cierre. Verifica tu conexión e intenta de nuevo.';return}
  toast(TIPO==='apartado' ? 'Apartado registrado 🟢' : 'Cierre registrado — pendiente de aprobación ✅');
  $('#ci-monto').value='';$('#ci-notas').value='';$('#ci-valor').value='';$('#ci-ubicacion').value='';
  $('#ci-prop').value='';$('#ci-cliente').value='';
  $('#ci-fecha').value=new Date().toISOString().slice(0,10);
  await cargar();
}
$('#ci-save').onclick=guardarCierre;

function nomAsesorCierre(c){ if(c.advisor_id) return nomAsesor(c.advisor_id); return c.advisor_nombre||'Asesor' }
function nomProp(c){ if(c.property_externa) return c.property_externa; const p=PROPS.find(x=>x.id===c.property_id); return p?(p.title||p.eb_public_id||'Propiedad'):'Propiedad' }
function filaCierreHTML(c){

function esMiCierre(c){

}

function tablaHTML(titulo,heads,filas,nota,hoja){
  return '<div class="repsec"><div class="reph">'+titulo+'</div><table class="reptable'+(hoja?' hoja':'')+'"><thead><tr>'
    +heads.map(h=>'<th'+(h[0]==='#'?' class="num"':'')+'>'+esc(h.replace(/^#/,''))+'</th>').join('')
    +'</tr></thead><tbody>'
    +filas.map(f=>'<tr>'+f.map((v,i)=>'<td'+(heads[i]&&heads[i][0]==='#'?' class="num"':'')+'>'+v+'</td>').join('')+'</tr>').join('')
    +'</tbody></table>'+(nota?'<div class="repnote">'+nota+'</div>':'')+'</div>';
}
function descargarCSV(nombre,cols,filas){
  const escv=(v)=>{v=(v==null)?'':String(v).replace(/\r?\n/g,' ');return /[",]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const txt='﻿'+cols.join(',')+'\n'+filas.map(f=>f.map(escv).join(',')).join('\n');
  const b=new Blob([txt],{type:'text/csv;charset=utf-8'});
  const el=document.createElement('a');el.href=URL.createObjectURL(b);
  el.download='NIVA_'+nombre+'_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(el);el.click();el.remove();
  toast('Descargado: '+el.download);
}

function mesEtiqueta(d){return d?new Date(d).toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'}):''}
function esDeAsesor(c,a){ return c.advisor_id===a.id || (!c.advisor_id && (c.advisor_nombre||'').trim().toLowerCase()===a.n.trim().toLowerCase()); }
function renderHojaPorAsesor(aprobados){
  let out='<div class="section-title"><span>📋 Hoja por asesor (pagado vs. en verde)</span></div>';
  const nombresVistos=new Set();
  const grupos=ASESORES.map(a=>({key:a.id,n:a.n,esMio:c=>esDeAsesor(c,a)}));
  CIERRES.forEach(c=>{
    if(c.advisor_id || !c.advisor_nombre) return;
    const k=c.advisor_nombre.trim().toLowerCase();
    if(ASESORES.some(a=>a.n.trim().toLowerCase()===k)) return;
    if(nombresVistos.has(k)) return;
    nombresVistos.add(k);
    grupos.push({key:'nombre:'+k, n:c.advisor_nombre, esMio:cc=>!cc.advisor_id && (cc.advisor_nombre||'').trim().toLowerCase()===k});
  });
  grupos.forEach(g=>{
    const pagados=aprobados.filter(g.esMio);
    const verdes=CIERRES.filter(c=>c.estatus==='apartado' && g.esMio(c));
    if(!pagados.length && !verdes.length) return;
    const filasPag=pagados.map(c=>[mesEtiqueta(c.fecha_cierre||c.created_at),fmt(c.monto_comision),c.porcentaje_niva+'%',fmt(c.monto_comision*c.porcentaje_niva/100),c.valor_propiedad?fmt(c.valor_propiedad):'',esc(c.ubicacion||nomProp(c))]);
    const totPagFact=pagados.reduce((s,c)=>s+Number(c.monto_comision),0);
    const totPagNiva=pagados.reduce((s,c)=>s+Number(c.monto_comision)*Number(c.porcentaje_niva)/100,0);
    filasPag.push(['<strong>TOTAL</strong>','<strong>'+fmt(totPagFact)+'</strong>','','<strong>'+fmt(totPagNiva)+'</strong>','','']);
    const tablaPag=tablaHTML('✅ Pagado — '+esc(g.n),['Mes','#Facturación','%','#Pagado (a NIVA)','#Portafolio','Ubicación'],filasPag,null,true);
    const filasVerde=verdes.map(c=>[fmt(c.monto_comision),c.porcentaje_niva+'%',fmt(c.monto_comision*c.porcentaje_niva/100)]);
    const totVerFact=verdes.reduce((s,c)=>s+Number(c.monto_comision),0);
    const totVerNiva=verdes.reduce((s,c)=>s+Number(c.monto_comision)*Number(c.porcentaje_niva)/100,0);
    filasVerde.push(['<strong>'+fmt(totVerFact)+'</strong>','','<strong>'+fmt(totVerNiva)+'</strong>']);
    const tablaVerde=tablaHTML('🟢 En verde (posibles) — '+esc(g.n),['#Facturación','%','#X pagar'],filasVerde,null,true);
    out+='<div class="hojasec">'+tablaPag+tablaVerde+'</div>';
  });
  return out;
}
function descargarTablaActual(){
  const tablas=document.querySelectorAll('#az-rep table.reptable');
  if(!tablas.length){toast('No hay datos para descargar');return}
  let heads=null, filas=[];
  tablas.forEach((t,ti)=>{
    const h=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    if(ti>0) filas.push(h.map(()=>''));
    if(!heads) heads=h; else if(h.length>heads.length) heads=h;
    t.querySelectorAll('tbody tr').forEach(tr=>{
      filas.push([...tr.querySelectorAll('td')].map(td=>td.textContent.trim()));
    });
  });
  descargarCSV('cierres',heads,filas);
}

cargar();
