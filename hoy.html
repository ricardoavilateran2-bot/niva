<!DOCTYPE html>
<html lang="es" class="oscuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIVA — Arranca tu día</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./niva-ui.css">
<style>
/* ===== REDISEÑO 2026-10 · Arranca tu día =====
   Tema claro de trabajo con encabezado azul NIVA. Mismas clases que usa el JS. */
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1B2A4A;--navy2:#0f1e36;--gold:#C9A84C;--gold2:#e8c96a;--line:var(--ui-line);--muted:var(--ui-text-3);--wa:#128C4A;--red:#b42318;--amber:#9a6410;--green:#1a7a45}
body{font-family:Inter,-apple-system,sans-serif;background:var(--ui-bg);color:var(--ui-text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
header{display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--n-900);color:#fff;position:sticky;top:0;z-index:5}
header a{color:rgba(255,255,255,.75);text-decoration:none;font-weight:500;font-size:13px;padding:7px 12px;border:1px solid rgba(255,255,255,.16);border-radius:8px}
header a:hover{color:#fff;background:rgba(255,255,255,.08)}
header h1{font-size:15px;font-weight:600;flex:1;letter-spacing:-.005em}
header .hfecha{font-size:13px;color:rgba(255,255,255,.6)}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 90px}
/* encabezado del día */
.hero{background:var(--n-900);color:#fff;margin:0 calc(50% - 50vw);padding:28px 24px 30px;border-bottom:1px solid rgba(255,255,255,.06)}
.hero-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 360px;gap:32px;align-items:end}
.hola{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.hero .sub{color:rgba(255,255,255,.68);font-size:14.5px;line-height:1.5;margin:0;max-width:560px}
.hoyres{display:flex;gap:28px;margin-top:20px;flex-wrap:wrap}
.hoyres div{font-size:12.5px;color:rgba(255,255,255,.6)}
.hoyres b{display:block;font-size:22px;font-weight:650;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hoyres .alerta b{color:var(--g-400)}
.meta{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px;margin:0}
.meta .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.meta b{font-size:13.5px;font-weight:600}.meta .pct{font-size:22px;font-weight:650;color:var(--g-400);font-variant-numeric:tabular-nums}
.bar{height:6px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g-500);border-radius:6px;transition:width .5s var(--ease)}
.meta small{display:block;color:rgba(255,255,255,.7);font-size:13px;margin-top:12px}
.meta .sigbtn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--g-500);color:var(--n-900);border:0;border-radius:9px;padding:10px 14px;font:600 13.5px Inter,sans-serif;cursor:pointer}
.meta .sigbtn:hover{background:var(--g-400)}
/* cuerpo: plan a la izquierda, agenda y atajos a la derecha */
.grid{display:grid;grid-template-columns:1fr 340px;gap:28px;margin-top:28px;align-items:start}
.grid>*,.hero-in>*{min-width:0}
.colh{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-text-3);margin:0 0 12px}
.side{display:flex;flex-direction:column;gap:20px;position:sticky;top:76px}
.panel{background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:14px;padding:16px;box-shadow:var(--sh-1)}
.panel h3{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.panel h3 a{font-size:12.5px;font-weight:500;color:var(--ui-brand);text-decoration:none}
.panel h3 a:hover{text-decoration:underline}
.cita{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--ui-line)}
.cita:first-of-type{border-top:0;padding-top:0}
.cita .hr{flex:0 0 54px;font-size:13px;font-weight:650;color:var(--ui-brand);font-variant-numeric:tabular-nums;line-height:1.3}
.cita .hr small{display:block;font-size:11.5px;font-weight:500;color:var(--ui-text-3)}
.cita .cc{min-width:0}
.cita .cc b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cita .cc span{display:block;font-size:12.5px;color:var(--ui-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cita.manana .hr{color:var(--ui-text-2)}
.sincitas{font-size:13px;color:var(--ui-text-2);line-height:1.5}
.atajos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.atajos a{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--ui-line);border-radius:10px;text-decoration:none;color:var(--ui-text);font-size:13px;font-weight:600;line-height:1.25;transition:border-color .15s,background .15s}
.atajos a:hover{border-color:var(--g-500);background:var(--ui-surface-2)}
.atajos .ui-ico{width:18px;height:18px;color:var(--ui-brand)}
.semana{background:var(--ui-accent-soft);border:1px solid rgba(201,168,76,.45);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:13.5px;line-height:1.55;color:var(--s-700)}
.semana b{display:block;font-size:14px;margin-bottom:4px;color:var(--ui-text)}
/* «Yo te guío» */
.pasos{list-style:none;display:flex;gap:6px;margin:0 0 16px}
.pasos li{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11.5px;color:var(--ui-text-3);font-weight:500}
.pasos li::before{content:'';position:absolute;top:14px;left:calc(-50% + 16px);right:calc(50% + 16px);height:2px;background:var(--ui-line)}
.pasos li:first-child::before{display:none}
.pasos li.ok::before,.pasos li.ahora::before{background:var(--st-active)}
.pasos span{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:650;background:var(--ui-surface);border:1.5px solid var(--ui-line-strong);color:var(--ui-text-2);position:relative}
.pasos li.ok span{background:var(--st-active);border-color:var(--st-active);color:#fff}
.pasos li.ahora span{background:var(--g-500);border-color:var(--g-500);color:var(--n-900);box-shadow:0 0 0 5px rgba(201,168,76,.22)}
.pasos li.ahora em{color:var(--ui-text);font-weight:650}
.pasos em{font-style:normal}
.guia{background:var(--ui-surface);border:1.5px solid var(--g-500);border-radius:18px;padding:22px;margin-bottom:28px;box-shadow:0 10px 30px rgba(201,168,76,.16),var(--sh-2);scroll-margin-top:80px}
.guia.lista{border-color:var(--st-active);box-shadow:var(--sh-2)}
.guia-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.guia-tag{display:inline-flex;align-items:center;gap:6px;background:var(--n-900);color:var(--g-400);font-size:11.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.guia-tag::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--g-500);animation:guiaLatido 1.6s infinite}
@keyframes guiaLatido{0%,100%{opacity:1}50%{opacity:.3}}
.guia-paso{font-size:12.5px;color:var(--ui-text-2);font-weight:500}
.guia h2{font-size:22px;font-weight:650;letter-spacing:-.015em;line-height:1.25;color:var(--ui-text-2)}
.guia h2 b{color:var(--ui-text);font-weight:700}
.guia-tip{font-size:14px;color:var(--ui-text-2);margin:6px 0 16px;line-height:1.5}
.guia-item .it{border:0;padding:0;margin:0;background:none}
.guia-item .it .row b,.guia-item .it .row small{white-space:normal}
.guia-item .it .row b{display:none}
.guia-item .acts{margin-top:12px}
.guia-item .btn{min-height:52px;font-size:15px;border-radius:12px}
.guia-item .btn.sm{min-height:52px;min-width:56px}
.guia-item .chk{font-size:15px;padding:16px}
.guia-pie{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--ui-line);font-size:13px;color:var(--ui-text-3)}
.guia-pie b{color:var(--ui-text-2)}
.guia-saltar{background:none;border:0;font:500 13px Inter,sans-serif;color:var(--ui-text-2);cursor:pointer;padding:8px 0;min-height:40px}
.guia-saltar:hover{color:var(--ui-text);text-decoration:underline}
@media (max-width:600px){.guia{padding:18px;border-radius:16px}.guia h2{font-size:19px}.pasos em{font-size:10.5px}}
/* mejoras de claridad */
.lbl{display:none}
.guia-item .lbl{display:inline}
.guia-item .btn.sm{min-width:auto;padding:8px 16px}
.guia-msg{background:var(--ui-surface-2);border:1px solid var(--ui-line);border-radius:12px 12px 12px 4px;padding:10px 14px;font-size:13.5px;line-height:1.5;color:var(--ui-text-2);margin:0 0 4px;max-width:560px}
.guia-msg span{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--wa);margin-bottom:3px}
.hero .sub b{color:#fff}
.verplan{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ui-surface);border:1px dashed var(--ui-line-strong);border-radius:12px;padding:14px 18px;font:600 14px Inter,sans-serif;color:var(--ui-brand);cursor:pointer;margin-bottom:12px;min-height:52px}
.verplan:hover{border-style:solid;background:var(--ui-surface-2)}
.verplan em{font-style:normal;font-weight:500;font-size:12.5px;color:var(--ui-text-3)}
.verplan span::after{content:' ↓';}
.verplan[aria-expanded="true"] span::after{content:' ↑'}
.plan.plegado{display:none}
.proxcita{display:none;align-items:baseline;gap:8px;flex-wrap:wrap;background:var(--ui-surface);border:1px solid var(--ui-line);border-left:3px solid var(--g-500);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13.5px;color:var(--ui-text-2);text-decoration:none}
.proxcita span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ui-text-3)}
.proxcita b{color:var(--ui-brand)}
.cita.pasada .hr,.cita.pasada .cc b{color:var(--ui-text-3)}
.cita.pasada .cc b{text-decoration:line-through;text-decoration-color:var(--ui-line-strong)}
.cita.pasada a{color:var(--ui-brand);font-weight:600}
.cita.sig{background:var(--ui-accent-soft);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:10px;border-top-color:transparent}
.cita.sig + .cita{border-top-color:transparent}
.tagsig{display:inline-block;font-style:normal;font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--g-600);margin-bottom:1px}
@media (min-width:961px){.meta .sigbtn{display:none}}
@media (max-width:600px){.guia-item .acts .btn.wa{flex:1 1 100%}.guia-item .acts .btn.sm{flex:1 1 0}}
@media (max-width:960px){.proxcita{display:flex}}
/* los 5 pasos */
.mis{background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:var(--sh-1);transition:box-shadow .18s var(--ease)}
.mis.open{box-shadow:var(--sh-2);border-color:var(--ui-line-strong)}
.mis.done{border-color:var(--ui-line)}
.mh{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;min-height:64px}
.mh:hover{background:var(--ui-surface-2)}
.num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:650;font-size:14px;background:var(--ui-surface);border:1.5px solid var(--ui-line-strong);color:var(--ui-text-2);flex-shrink:0}
.mis.open .num{border-color:var(--ui-brand);background:var(--ui-brand);color:#fff}
.mis.done .num{background:var(--st-active);border-color:var(--st-active);color:#fff}
.mh .t{flex:1;min-width:0}.mh .t b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}.mh .t small{color:var(--ui-text-3);font-size:12.5px}
.mis.done .mh .t b{color:var(--ui-text-2)}
.prog{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--ui-sunken);color:var(--ui-text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.mis.done .prog{background:var(--st-active-bg);color:var(--st-active)}
.mis#m1:not(.done) .prog{background:var(--st-new-bg);color:var(--st-new)}
.mb{display:none;padding:0 18px 18px}
.mis.open .mb{display:block}
.por{font-size:13px;color:var(--ui-text-2);background:var(--ui-surface-2);border-left:3px solid var(--g-500);border-radius:6px;padding:10px 12px;margin-bottom:12px;line-height:1.5}
.por b{color:var(--ui-text)}
.it{background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.it.hecho{opacity:.5}
.row{display:flex;gap:12px;align-items:center}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--ui-text-2);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row img{width:56px;height:42px;object-fit:cover;border-radius:8px;background:var(--ui-sunken);flex-shrink:0}
.age{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.age.r{background:var(--danger-bg);color:var(--danger)}.age.a{background:var(--st-warm-bg);color:var(--st-warm)}.age.g{background:var(--st-active-bg);color:var(--st-active)}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1;min-width:90px;border-radius:9px;padding:10px;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;text-align:center;color:var(--ui-text);background:var(--ui-surface);border:1px solid var(--ui-line);font-family:inherit;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--ui-sunken)}
.btn.wa{background:var(--wa);color:#fff;border-color:var(--wa)}
.btn.wa:hover{background:#0f7a40}
.btn.gold{background:var(--g-500);color:var(--n-900);border-color:var(--g-500)}
.btn.sm{flex:0 0 auto;min-width:44px;font-size:12.5px;padding:8px 12px}
.vacio{color:var(--ui-text-2);font-size:13.5px;text-align:center;padding:16px;border:1px dashed var(--ui-line-strong);border-radius:12px;background:var(--ui-surface-2)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--ui-line);border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:14px;line-height:1.45;background:var(--ui-surface)}
.chk:hover{border-color:var(--ui-line-strong)}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--st-active);flex-shrink:0}
.mas{display:inline-block;color:var(--ui-brand);font-size:13px;font-weight:600;margin:8px 16px 0 0;text-decoration:none}
.mas:hover{text-decoration:underline}
.muted{color:var(--ui-text-3);font-size:13px;text-align:center;padding:40px 0}
.fin{text-align:center;padding:18px;border-radius:14px;background:var(--st-active-bg);border:1px solid rgba(26,122,69,.3);margin-top:14px;font-size:14px;line-height:1.5;color:var(--s-700)}
.pie{margin-top:14px;font-size:12px;color:var(--ui-text-3)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--n-900);color:#fff;padding:11px 18px;border-radius:10px;font-weight:500;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;box-shadow:var(--sh-3)}
#toast.show{opacity:1}
@media (max-width:960px){
  .hero-in{grid-template-columns:1fr;gap:20px}
  .grid{grid-template-columns:1fr}
  .side{position:static}
}
@media (max-width:600px){
  header{padding:10px 16px}header .hfecha{display:none}
  .wrap{padding:0 16px 80px}
  .hero{padding:22px 16px 24px}
  .hola{font-size:23px}
  .hoyres{gap:20px}.hoyres b{font-size:19px}
  .mh{padding:14px}.mb{padding:0 14px 14px}
  .grid{margin-top:20px;gap:20px}
}
</style>

header{background:rgba(8,17,32,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}

<body>
<header><a href="./index.html">← NIVA OS</a><h1>Arranca tu día</h1><span class="hfecha" id="hfecha"></span></header>
<div class="wrap" id="app"><p class="muted">Armando tu plan del día…</p></div>
<div id="toast"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const $=s=>document.querySelector(s);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cfg=await (await fetch('https://gjyzdwsfdmdfhcspvxbz.supabase.co/functions/v1/niva-config')).json();
const sb=createClient(cfg.url,cfg.anon);
let {data:{session}}=await sb.auth.getSession();
if(!session){ location.replace('./index.html'); }
try{ sb.rpc('marcar_acceso').then(()=>{},()=>{}); }catch(_e){}
let MY=null, NOMBRE='';
try{ const {data}=await sb.rpc('my_advisor_id'); MY=data||null; if(MY){ const {data:a}=await sb.from('advisors').select('first_name').eq('id',MY).maybeSingle(); NOMBRE=(a&&a.first_name)||''; } }catch(_e){}

const H=3600e3, D=24*H;
const HOY=new Date(); HOY.setHours(0,0,0,0); const HOY_MS=HOY.getTime();
const KEY='niva_arranca_'+HOY.toISOString().slice(0,10);
let ST={seg:[],cap:[],ofr:[],est:{}}; try{ ST=Object.assign(ST,JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(_e){}
const guardar=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(_e){} };
let GUIA_PREV=null, VER_PLAN=false; try{ VER_PLAN=sessionStorage.getItem('niva_ver_plan')==='1'; }catch(_e){}
let SALTOS=[]; try{ SALTOS=JSON.parse(sessionStorage.getItem('niva_guia_saltos')||'[]'); }catch(_e){}
let ABIERTA=null; try{ ABIERTA=sessionStorage.getItem('niva_arranca_open'); }catch(_e){}

const hace=ms=>{const h=Math.floor(ms/H); if(h<1) return 'hace '+Math.max(1,Math.round(ms/60000))+' min'; if(h<24) return 'hace '+h+' h'; const d=Math.floor(ms/D); return 'hace '+d+(d===1?' día':' días');};
const cap1=s=>{s=String(s||'').trim().split(' ')[0];return s?s.charAt(0).toUpperCase()+s.slice(1).toLowerCase():'';};
const tel=s=>{let t=String(s||'').replace(/\D/g,''); if(t.length===10) t='52'+t; if(t.length===13&&t.startsWith('521')) t='52'+t.slice(3); return t;};
const bonito=s=>String(s||'').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const yo=()=>NOMBRE||'tu asesor';

/* ===== Mensajes listos ===== */
const msgNuevo=l=>'¡Hola'+(cap1(l.full_name)?' '+cap1(l.full_name):'')+'! Soy '+yo()+' de NIVA Inmobiliaria 🙂 Vi que preguntaste por '+(l.property_title?bonito(l.property_title).slice(0,60):'una de nuestras propiedades')+'. ¿Te gustaría verla esta semana o prefieres que te cuente más por aquí?';

/* ===== Texto Ofrezco (mismo formato que Ofrezco WhatsApp) ===== */
const T={Casa:'CASA',Departamento:'DEPA','Local comercial':'LOCAL',Terreno:'TERRENO',Oficina:'OFICINA',Quinta:'QUINTA','Bodega comercial':'BODEGA','Terreno comercial':'TERRENO COMERCIAL',Edificio:'EDIFICIO'};
let EMO=true; try{ EMO=localStorage.getItem('niva_ofz_emo')!=='no'; }catch(_e){}
function genOf(x){
  const op=x.operation_type==='rental'?'RENTA':'VENTA';
  let n=(x.title||'').toUpperCase();
  n=n.replace(/\b(DEPARTAMENTOS?|DEPAS?|CASAS?|LOCAL(ES)? COMERCIAL(ES)?|LOCAL|TERRENOS?( COMERCIAL)?|OFICINAS?|QUINTAS?|BODEGAS?( COMERCIAL)?|EDIFICIO|AMUEBLAD[OA]S?|EQUIPAD[OA]S?|NUEV[OA]S?|EN|DE|LA|EL|RENTA|VENTA|PRE ?VENTA|CON|Y)\b/g,' ').replace(/[,|·\-–]+/g,' ').replace(/\s+/g,' ').trim();
  const ps=n.split(' ');if(ps.length>5)n=ps.slice(0,5).join(' ');
  const L=(x.location_name||'').split(',').map(s=>s.trim());const col=L[0]||'';
  const mun=(L[1]||'').replace('San Pedro Garza García','San Pedro').replace('San Nicolás de los Garza','San Nicolás');
  const zona=col&&mun&&!col.includes(mun)?col+', '+mun:(col||mun);
  const txt=((x.title||'')+' '+(x.description||'')).toLowerCase();
  const e=(em,lb)=>EMO?em+' ':(lb||'- ');
  const o=[(EMO?'🔵🔵 ':'')+'*OFREZCO '+(T[x.property_type]||String(x.property_type||'').toUpperCase())+' '+op+(n?' '+n:'')+'*'];
  if(zona)o.push(e('📍','Zona: ')+zona);
  if(x.bedrooms)o.push(e('🛏')+x.bedrooms+(x.bedrooms>1?' Recámaras':' Recámara'));
  if(x.bathrooms){const b=+x.bathrooms+(x.half_bathrooms?0.5*x.half_bathrooms:0);o.push(e('🛁')+String(b).replace('.5',' ½')+(b>1?' Baños':' Baño'));}
  if(x.construction_size)o.push(e('📐')+Math.round(x.construction_size)+' m² construcción');
  if(x.lot_size&&['Terreno','Terreno comercial','Quinta','Casa','Bodega comercial'].includes(x.property_type))o.push(e('🌳')+Math.round(x.lot_size)+' m² terreno');
  if(/amueblad/.test(txt))o.push(e('🛋')+'Amueblado');
  if(x.parking_spaces)o.push(e('🚗')+x.parking_spaces+(x.parking_spaces>1?' cajones':' cajón'));
  const am=[];if(/alberca/.test(txt))am.push('alberca');if(/gimnasio|\bgym\b/.test(txt))am.push('gym');if(/roof|terraza/.test(txt))am.push('roof/terraza');if(/seguridad|vigilancia|caseta/.test(txt))am.push('seguridad 24/7');
  if(am.length)o.push(e('✨','Amenidades: ')+am.slice(0,3).join(', ').replace(/^./,c=>c.toUpperCase()));
  const p=Number(x.price_amount);if(p)o.push(e('💵','Precio: ')+'$'+p.toLocaleString('en-US')+(x.price_currency&&x.price_currency!=='MXN'?' '+x.price_currency:'')+(x.operation_type==='rental'?' /mes':''));
  return o.slice(0,12).join('\n');
}
let CUST={};
const msgOf=x=>CUST[x.id+'|'+(EMO?'emo':'sin')]||genOf(x);

let LEADS=[], ULT={}, PROPS=[], SCOUT=[], OFR_HOY=0, CITAS=[];

const HOY_YMD=ymd(HOY), MANANA_YMD=ymd(new Date(HOY_MS+D));
async function cargar(){
  if(!MY){ $('#app').innerHTML='<p class="muted">Tu usuario no está ligado a un asesor. Pídele a Ricardo que lo revise.</p>'; return false; }
  const {data,error}=await sb.from('my_leads').select('id,status,full_name,phone_normalized,contact_type,property_title,happened_at,created_at,archived_at,advisor_id').eq('advisor_id',MY).is('archived_at',null).range(0,1999);
  if(error){ $('#app').innerHTML='<p class="muted">No se pudo cargar tu información. Recarga la página.</p>'; throw error; }
  LEADS=(data||[]).filter(l=>l.contact_type!=='agent'&&l.status!=='cancelled');
  ULT={};
  const ids=LEADS.map(l=>l.id);
  for(let i=0;i<ids.length;i+=150){
    try{ const {data:it}=await sb.from('lead_interactions').select('lead_id,created_at').in('lead_id',ids.slice(i,i+150)).in('type',['whatsapp_click','call_click','status_change']).order('created_at',{ascending:false}).range(0,4999);
      (it||[]).forEach(r=>{const t=new Date(r.created_at).getTime(); if(!ULT[r.lead_id]||t>ULT[r.lead_id])ULT[r.lead_id]=t;}); }catch(_e){}
  }
  try{ const {data:pr}=await sb.from('my_properties').select('id,title,title_image_url,price_amount,price_currency,property_type,operation_type,location_name,bedrooms,bathrooms,half_bathrooms,parking_spaces,construction_size,lot_size,description,eb_status,advisor_id').eq('advisor_id',MY).eq('eb_status','published').limit(300); PROPS=pr||[];
    if(PROPS.length){ const pids=PROPS.map(p=>p.id);
      const {data:lg}=await sb.from('ofrezcos_log').select('property_id,created_at,user_email').in('property_id',pids).order('created_at',{ascending:false}).limit(3000); const u={}; OFR_HOY=0; const vistos={};
      (lg||[]).forEach(r=>{const t=new Date(r.created_at).getTime(); if(!u[r.property_id])u[r.property_id]=t; if(t>=HOY_MS&&r.user_email===session.user.email&&!vistos[r.property_id]){vistos[r.property_id]=1;OFR_HOY++;}});
      PROPS.forEach(p=>p._ult=u[p.id]||0); PROPS.sort((a,b)=>a._ult-b._ult);
      try{ const {data:ct}=await sb.from('ofrezco_textos').select('property_id,modo,texto').in('property_id',pids); (ct||[]).forEach(r=>CUST[r.property_id+'|'+r.modo]=r.texto); }catch(_e){}
    } }catch(_e){ PROPS=[]; }
  try{ const {data:sc}=await sb.from('scouting_leads').select('id,titulo,precio,operacion,tipo_propiedad,colonia,zona,telefono,telefono_normalizado,nombre_contacto,portal,url,detectado_at').eq('lead_status','DISPONIBLE').eq('visible_para_asesores',true).not('telefono_normalizado','is',null).order('detectado_at',{ascending:false}).limit(40); SCOUT=(sc||[]).filter(s=>tel(s.telefono_normalizado||s.telefono).length>=12); if(SCOUT.length){ let hsh=0; for(const ch of String(MY)) hsh=(hsh*31+ch.charCodeAt(0))%9973; const k=hsh%SCOUT.length; SCOUT=SCOUT.slice(k).concat(SCOUT.slice(0,k)); } }catch(_e){ SCOUT=[]; }
  try{ const {data:ci}=await sb.from('citas').select('*').eq('advisor_id',MY).gte('fecha',HOY_YMD).lte('fecha',MANANA_YMD).order('fecha').order('hora',{nullsFirst:true}).limit(50); CITAS=(ci||[]).filter(c=>c.estado!=='cancelada'&&c.estado!=='hecha'); }catch(_e){ CITAS=[]; }
  return true;
}

     +'<div><b>'+citasHoy.length+'</b>'+(citasHoy.length===1?'cita hoy':'citas hoy')+'</div>'
   +'</div></div>'
   +'<div class="meta"><div class="top"><b>Tu avance de hoy</b><span class="pct">'+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>'
   +'<small>'+tHechas+' de '+tTotal+' tareas'+(sig?'':' · 🏆 ¡Plan terminado!')+'</small>'+(GUIA?'<button class="sigbtn" data-guia="1">Guíame →</button>':'')+'</div>'
   +'</div></section>';
  h+='<div class="grid"><div class="main">';
  if(proxima){ const tp=h12(proxima.hora); h+='<a class="proxcita" href="./agenda.html"><span>Próxima cita</span><b>'+(proxima.fecha!==HOY_YMD?'Mañana ':'')+tp[0]+' '+tp[1]+'</b> · '+esc(proxima.cliente_nombre||proxima.titulo||'Cita')+'</a>'; }
  h+='<ol class="pasos" aria-label="Tus 5 pasos de hoy">'+M.map(m=>'<li class="'+(m.hecho?'ok':(GUIA&&GUIA.m.id===m.id?'ahora':''))+'"><span>'+(m.hecho?'✓':m.n)+'</span><em>'+['Contestar','Seguimiento','Ofrecer','Captar','Visible'][m.n-1]+'</em></li>').join('')+'</ol>';
  if(GUIA){
    const sigM=M.find(m=>!m.hecho&&m.n>GUIA.m.n);
    h+='<section class="guia" id="guia"><div class="guia-top"><span class="guia-tag">Yo te guío</span><span class="guia-paso">Paso '+GUIA.m.n+' de 5 · '+GUIA.m.t+(GUIA.cuenta>1?' · te faltan '+GUIA.cuenta:'')+'</span></div>'
      +'<h2>'+GUIA.que+(GUIA.quien?' <b>'+esc(GUIA.quien)+'</b>':'')+'</h2>'
      +'<p class="guia-tip">'+GUIA.tip+'</p>'
      +(GUIA.prev?'<div class="guia-msg"><span>Mensaje listo</span>'+esc(GUIA.prev.length>140?GUIA.prev.slice(0,140)+'…':GUIA.prev)+'</div>':'')
      +'<div class="guia-item">'+GUIA.html+'</div>'
      +'<div class="guia-pie"><button class="guia-saltar" data-saltar="'+esc(GUIA.k)+'">Saltar por ahora →</button>'
      +(sigM?'<span>Después: <b>'+sigM.t+'</b></span>':'<span>Es lo último de tu plan</span>')+'</div></section>';
  } else if(!sig){
    h+='<section class="guia lista"><span class="guia-tag">Yo te guío</span><h2>¡Terminaste tu plan de hoy'+(NOMBRE?', '+esc(NOMBRE):'')+'!</h2><p class="guia-tip">Si te sobra tiempo, escríbele a más dueños en Scouting.</p></section>';
  } else {
    h+='<section class="guia lista"><span class="guia-tag">Yo te guío</span><h2>Saltaste todo lo pendiente</h2><p class="guia-tip">Revisa los pasos abajo cuando tengas un momento.</p><div class="guia-pie"><button class="guia-saltar" data-reiniciar="1">Volver a empezar la guía</button></div></section>';
  }
  const plegado=!!GUIA&&!VER_PLAN;
  h+='<button class="verplan" data-verplan="1" aria-expanded="'+(!plegado)+'"><span>'+(plegado?'Ver todo tu plan':'Ocultar el plan completo')+'</span><em>'+hechas+' de 5 pasos</em></button>';
  h+='<div class="plan'+(plegado?' plegado':'')+'">';
  if(dia===1) h+='<div class="semana"><b>Arranque de semana (lunes)</b>1) Escribe a los dueños de tus propiedades: ¿siguen disponibles?, ¿mismo precio?<br>2) Pide fotos o datos que falten en tus captaciones.<br>3) Agenda tus visitas de la semana con los clientes ACTIVOS.</div>';
  else if(dia===5) h+='<div class="semana"><b>Cierre de semana (viernes)</b>Confirma las visitas del fin de semana y manda un último seguimiento a los clientes que vieron propiedades esta semana.</div>';
  h+=M.map(m=>'<div class="mis'+(m.hecho?' done':'')+(ABIERTA===m.id?' open':'')+'" id="'+m.id+'"><div class="mh" data-tog="'+m.id+'" role="button" tabindex="0" aria-expanded="'+(ABIERTA===m.id)+'"><div class="num">'+(m.hecho?'✓':m.n)+'</div><div class="t"><b>'+m.t+'</b><small>'+m.d+'</small></div><span class="prog">'+m.prog+'</span></div><div class="mb"><div class="por">'+m.por+'</div>'+m.body+'</div></div>').join('');
  h+='</div>';
  if(!sig) h+='<div class="fin">🏆 <b>¡Excelente trabajo'+(NOMBRE?', '+esc(NOMBRE):'')+'!</b><br>Completaste tu plan de hoy. Si te sobra tiempo, vuelve al paso 4 y escríbele a más dueños.</div>';
  h+='</div>';
  h+='<aside class="side">'
   +'<div class="panel"><h3>Próximas citas <a href="./agenda.html">Ver agenda</a></h3>'
   +(CITAS.length?CITAS.slice(0,4).map(c=>{const t=h12(c.hora); const man=c.fecha!==HOY_YMD; const pas=pasada(c), sigC=c===proxima; return '<div class="cita'+(man?' manana':'')+(pas?' pasada':'')+(sigC?' sig':'')+'"><div class="hr">'+t[0]+'<small>'+(man?'mañana':t[1])+'</small></div><div class="cc">'+(sigC?'<i class="tagsig">Siguiente</i>':'')+'<b>'+esc(c.cliente_nombre||c.titulo||'Cita')+'</b><span>'+(pas?'Ya pasó · <a href="./agenda.html">¿Cómo te fue?</a>':esc([c.titulo&&c.cliente_nombre?c.titulo:'',c.lugar||''].filter(Boolean).join(' · ')||(c.tipo||'')))+'</span></div></div>';}).join('')
     +(CITAS.length>4?'<div class="sincitas" style="margin-top:8px">Y '+(CITAS.length-4)+' más en tu agenda.</div>':'')
     :'<div class="sincitas">No tienes citas hoy ni mañana. Cuando un cliente responda, agéndale una visita.</div>')
   +'</div>'
   +'<div class="panel"><h3>Accesos rápidos</h3><div class="atajos">'
     +'<a href="./crm.html">'+ICO('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>')+'Mis clientes</a>'
     +'<a href="./agenda.html">'+ICO('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>')+'Agendar cita</a>'
     +'<a href="./ofrezco.html">'+ICO('<path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1Z"/><path d="M16 9a4 4 0 0 1 0 6"/>')+'Ofrecer propiedades</a>'
     +'<a href="./studio.html">'+ICO('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>')+'Content Studio</a>'
   +'</div></div></aside></div>';
  $('#app').innerHTML=h;
}

if(await cargar()) pintar();

const abrir=id=>{ABIERTA=id; try{sessionStorage.setItem('niva_arranca_open',id);}catch(_e){}};
$('#app').onclick=async e=>{
  const sl=e.target.closest('[data-saltar]'); if(sl){ SALTOS.push(sl.dataset.saltar); try{sessionStorage.setItem('niva_guia_saltos',JSON.stringify(SALTOS));}catch(_e){} pintar(); return; }
  if(e.target.closest('[data-verplan]')){ VER_PLAN=!VER_PLAN; try{sessionStorage.setItem('niva_ver_plan',VER_PLAN?'1':'0');}catch(_e){} pintar(); return; }
  if(e.target.closest('[data-reiniciar]')){ SALTOS=[]; try{sessionStorage.removeItem('niva_guia_saltos');}catch(_e){} pintar(); return; }
  if(e.target.closest('[data-guia]')){ const g=document.getElementById('guia'); if(g) g.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const tg=e.target.closest('[data-tog]'); if(tg){ const id=tg.dataset.tog; abrir(tg.dataset.abrir?id:(ABIERTA===id?'':id)); pintar(); if(tg.dataset.abrir){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); } return; }
  const a=e.target.closest('[data-a]'); if(!a) return; const it=a.closest('.it'); if(!it) return; const id=it.dataset.id; const k=it.dataset.k;
  if(k==='nuevo'||k==='seg'){
    const l=LEADS.find(x=>x.id===id); if(!l) return;
    if(a.dataset.a==='wa'||a.dataset.a==='call'){ try{ sb.from('lead_interactions').insert({lead_id:id,type:a.dataset.a==='wa'?'whatsapp_click':'call_click',actor:'advisor',payload:{desde:'arranca'}}).then(()=>{},()=>{}); }catch(_e){} ULT[id]=Date.now(); if(k==='seg'&&!ST.seg.includes(id)){ST.seg.push(id);guardar();} }
    if((a.dataset.a==='wa'||a.dataset.a==='call'||a.dataset.a==='ok')&&l.status==='new'){ const {error}=await sb.from('leads').update({status:'contacted'}).eq('id',id); if(!error){ l.status='contacted'; ULT[id]=Date.now(); try{ sb.from('lead_interactions').insert({lead_id:id,type:'status_change',actor:'advisor',payload:{de:'new',a:'contacted',desde:'arranca'}}).then(()=>{},()=>{}); }catch(_e){} if(a.dataset.a==='ok')toast('Listo ✓ Pasó a ACTIVO'); } else toast('No se pudo actualizar'); }
    setTimeout(pintar,500); return;
  }
  if(k==='ofr'){
    const p=PROPS.find(x=>x.id===id); if(!p) return;
    if(a.dataset.a==='copiar'){ try{ await navigator.clipboard.writeText(msgOf(p)); toast('Copiado ✓ Pégalo en tus grupos'); }catch(_e){ toast('No se pudo copiar'); } }
    try{ sb.from('ofrezcos_log').insert({property_id:id,advisor_id:MY,canal:a.dataset.a==='ofr'?'whatsapp':'copiar',user_email:session.user.email}).then(()=>{},()=>{}); }catch(_e){}
    if(!ST.ofr.includes(id)){ST.ofr.push(id);guardar();} p._ult=Date.now(); setTimeout(pintar,500); return;
  }
  if(k==='cap'){
    const s=SCOUT.find(x=>x.id===id); if(!s) return;
    if(a.dataset.a==='capwa'||a.dataset.a==='capcall'){ if(!ST.cap.includes(id)){ST.cap.push(id);guardar();} setTimeout(pintar,500); return; }
    const rpc={mio:['scouting_capturar_lead',{p_lead_id:id,p_asesor:MY},'🏠 ¡Captada! Quedó a tu nombre en Scouting'],esasesor:['scouting_marcar_asesor',{p_lead_id:id,p_marcado_por:MY,p_motivo:'desde Arranca tu día'},'Marcado como asesor. Gracias'],nodisp:['scouting_marcar_no_disponible',{p_lead_id:id,p_marcado_por:MY,p_motivo:'desde Arranca tu día'},'Marcada como no disponible']}[a.dataset.a];
    if(!rpc) return;
    const {data,error}=await sb.rpc(rpc[0],rpc[1]); if(error||(data&&data.success===false)){ toast(data&&data.reason==='ya_capturado'?'🔒 Otro asesor ya la captó':'No se pudo guardar'); return; }
    SCOUT=SCOUT.filter(x=>x.id!==id); toast(rpc[2]); pintar(); return;
  }
};
$('#app').addEventListener('keydown',e=>{ const tg=e.target.closest('.mh[data-tog]'); if(tg&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); tg.click(); } });
$('#app').onchange=e=>{ const c=e.target.closest('[data-est]'); if(!c) return; ST.est[c.dataset.est]=c.checked; guardar(); pintar(); };
</script>
