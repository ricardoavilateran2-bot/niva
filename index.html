<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NIVA OS</title>
<style>
:root{--navy:#141d33;--navy2:#1d2947;--gold:#c9a227;--bg:#f4f5f8;--card:#fff;--txt:#1a2133;--mut:#6b7280;--ok:#16a34a;--new:#2563eb;--warn:#d97706;--bad:#9ca3af}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.hidden{display:none!important}
/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);padding:24px}
.lbox{width:100%;max-width:360px;background:#fff;border-radius:16px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{text-align:center;margin-bottom:18px}
.logo b{font-size:26px;letter-spacing:4px;color:var(--navy)}
.logo span{display:block;font-size:11px;letter-spacing:3px;color:var(--gold);margin-top:2px}
.lbox label{font-size:12px;color:var(--mut);display:block;margin:12px 0 4px}
.lbox input{width:100%;padding:12px;border:1px solid #d7dbe3;border-radius:10px;font-size:16px}
.lbox button{width:100%;margin-top:18px;padding:13px;background:var(--navy);color:#fff;border:0;border-radius:10px;font-size:16px;font-weight:600}
#lerr{color:#dc2626;font-size:13px;margin-top:10px;text-align:center;min-height:16px}
/* APP */
header{background:var(--navy);color:#fff;padding:14px 16px calc(10px);position:sticky;top:0;z-index:20}
.hrow{display:flex;justify-content:space-between;align-items:center}
.hname{font-size:13px;opacity:.85}
.hout{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:5px 10px;font-size:12px}
.tabs{display:flex;gap:8px;margin-top:12px}
.tab{flex:1;text-align:center;padding:9px 4px;border-radius:10px;background:rgba(255,255,255,.08);font-size:12.5px;font-weight:600;border:0;color:#fff}
.tab .n{display:block;font-size:19px;font-weight:800;color:var(--gold)}
.tab.on{background:var(--gold);color:var(--navy)}
.tab.on .n{color:var(--navy)}
main{padding:12px 12px 60px;max-width:640px;margin:0 auto}
.filtros{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.f{border:1px solid #d7dbe3;background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;white-space:nowrap;color:var(--mut)}
.f.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#buscar{width:100%;padding:10px 12px;border:1px solid #d7dbe3;border-radius:10px;font-size:15px;margin-bottom:10px;background:#fff}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 4px rgba(15,23,42,.08);margin-bottom:12px;overflow:hidden}
.crow{display:flex;gap:12px;padding:12px}
.cimg{width:86px;height:86px;border-radius:10px;object-fit:cover;background:#e5e7eb;flex-shrink:0}
.cinfo{flex:1;min-width:0}
.cname{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;letter-spacing:.5px}
.b-new{background:var(--new)}.b-contacted{background:var(--warn)}.b-attended{background:var(--ok)}.b-cancelled{background:var(--bad)}
.b-agent{background:#7c3aed}
.cprop{font-size:13px;color:var(--txt);margin-top:3px;line-height:1.35}
.cmeta{font-size:12px;color:var(--mut);margin-top:3px}
.cprice{color:var(--navy);font-weight:700}
details{padding:0 12px 8px}
details summary{font-size:12.5px;color:var(--mut);cursor:pointer}
details p{font-size:13.5px;background:#f1f3f7;border-radius:8px;padding:8px;margin-top:6px;white-space:pre-wrap}
.acciones{display:flex;gap:8px;padding:0 12px 12px}
.acc{flex:1;text-align:center;padding:10px 4px;border-radius:10px;font-size:13.5px;font-weight:700;border:0;text-decoration:none;color:#fff;display:block}
.wa{background:#25d366}.tel{background:var(--navy)}.ver{background:#64748b}
.estado{padding:0 12px 12px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.estado select{flex:1;padding:8px;border:1px solid #d7dbe3;border-radius:8px;font-size:14px;background:#fff}
.wabox{padding:0 12px 12px}
.wabox textarea{width:100%;min-height:84px;border:1px solid #d7dbe3;border-radius:10px;padding:10px;font-size:14px;font-family:inherit}
.wabox .go{margin-top:8px;width:100%;padding:11px;background:#25d366;color:#fff;border:0;border-radius:10px;font-size:15px;font-weight:700}
.vacio{text-align:center;color:var(--mut);padding:50px 20px;font-size:14.5px}
.pcard .cimg{width:96px;height:96px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
</style></head><body>

<div id="login">
  <div class="lbox">
    <div class="logo"><b>NIVA</b><span>INMOBILIARIA · OS</span></div>
    <label>Usuario</label><input id="lu" autocapitalize="none" autocomplete="username">
    <label>Contraseña</label><input id="lp" type="password" autocomplete="current-password">
    <button id="lbtn">Entrar</button>
    <div id="lerr"></div>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <div class="hrow"><div class="hname" id="hname"></div><button class="hout" id="hout">Salir</button></div>
  <div class="tabs">
    <button class="tab on" data-t="nuevos">NUEVOS<span class="n" id="n-nuevos">–</span></button>
    <button class="tab" data-t="leads">MIS LEADS<span class="n" id="n-leads">–</span></button>
    <button class="tab" data-t="props">PROPIEDADES<span class="n" id="n-props">–</span></button>
  </div>
</header>
<main>
  <div id="barra" class="">
    <div class="filtros" id="filtros">
      <button class="f on" data-f="todos">Todos</button>
      <button class="f" data-f="new">Nuevos</button>
      <button class="f" data-f="contacted">Contactados</button>
      <button class="f" data-f="attended">Atendidos</button>
      <button class="f" data-f="cancelled">Cancelados</button>
    </div>
    <input id="buscar" placeholder="Buscar: nombre, teléfono, propiedad, folio, portal...">
  </div>
  <div id="lista"></div>
</main>
<div id="toast"></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const cfg = await (await fetch('https://gjyzdwsfdmdfhcspvxbz.supabase.co/functions/v1/niva-config')).json();
const sb = createClient(cfg.url, cfg.anon);
const $ = (s)=>document.querySelector(s);
let LEADS=[], PROPS=[], TAB='nuevos', FIL='todos', Q='';
const EST={new:'NUEVO',contacted:'CONTACTADO',attended:'ATENDIDO',cancelled:'CANCELADO'};
const ESRC={easybroker:'EasyBroker',inmuebles24_email:'Inmuebles24',manual_admin:'Manual'};
const fmt=(n)=>n==null?'':'$'+Number(n).toLocaleString('es-MX');
const ftel=(t)=>t?t.replace('+52',''):'';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

async function entrar(){
  const u=$('#lu').value.trim().toLowerCase(), p=$('#lp').value;
  if(!u||!p){$('#lerr').textContent='Escribe usuario y contraseña';return}
  $('#lerr').textContent='';$('#lbtn').textContent='Entrando...';
  const email=u.includes('@')?u:(u+'@niva.internal');
  const {error}=await sb.auth.signInWithPassword({email,password:p});
  $('#lbtn').textContent='Entrar';
  if(error){$('#lerr').textContent='Usuario o contraseña incorrectos';return}
  iniciar();
}
$('#lbtn').onclick=entrar;
$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});
$('#hout').onclick=async()=>{await sb.auth.signOut();location.reload()};

async function iniciar(){
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  const {data:{user}}=await sb.auth.getUser();
  $('#hname').textContent=(user?.email??'').split('@')[0];
  await cargar();
}
async function cargar(){
  const [l,p]=await Promise.all([
    sb.from('my_leads').select('*').order('happened_at',{ascending:false}),
    sb.from('my_properties').select('*')
  ]);
  LEADS=l.data??[];PROPS=p.data??[];
  $('#n-nuevos').textContent=LEADS.filter(x=>x.status==='new').length;
  $('#n-leads').textContent=LEADS.length;
  $('#n-props').textContent=PROPS.length;
  pintar();
}
function pintar(){
  $('#barra').style.display=TAB==='props'?'none':'';
  const host=$('#lista');host.innerHTML='';
  if(TAB==='props'){
    if(!PROPS.length){host.innerHTML='<div class="vacio">No tienes propiedades activas asignadas.</div>';return}
    for(const p of PROPS){
      const d=document.createElement('div');d.className='card pcard';
      d.innerHTML='<div class="crow">'
        +'<img class="cimg" loading="lazy" src="'+(p.title_image_url||'')+'" onerror="this.style.visibility=\'hidden\'">'
        +'<div class="cinfo"><div class="cname">'+(p.title||p.eb_public_id)+'</div>'
        +'<div class="cmeta">'+p.eb_public_id+' · '+(p.operation_type==='rental'?'Renta':'Venta')+'</div>'
        +'<div class="cprice">'+fmt(p.price_amount)+(p.operation_type==='rental'?' /mes':'')+'</div>'
        +'<div class="cmeta">'+(p.location_name||'')+'</div>'
        +'<div class="cmeta">'+[p.bedrooms?p.bedrooms+' rec':null,p.bathrooms?p.bathrooms+' baños':null,p.parking_spaces?p.parking_spaces+' est':null,p.construction_size?p.construction_size+' m²':null].filter(Boolean).join(' · ')+'</div>'
        +'</div></div>'
        +(p.public_url?'<div class="acciones"><a class="acc ver" target="_blank" href="'+p.public_url+'">🏠 Ver anuncio</a></div>':'');
      host.appendChild(d);
    }
    return;
  }
  let arr=TAB==='nuevos'?LEADS.filter(x=>x.status==='new'):LEADS.slice();
  if(TAB==='leads'&&FIL!=='todos')arr=arr.filter(x=>x.status===FIL);
  if(Q){const q=Q.toLowerCase();arr=arr.filter(x=>[x.full_name,x.phone_normalized,x.property_title,x.eb_public_id,ESRC[x.source]].join(' ').toLowerCase().includes(q))}
  if(!arr.length){host.innerHTML='<div class="vacio">'+(TAB==='nuevos'?'Sin leads nuevos por ahora. 🎉':'Sin resultados.')+'</div>';return}
  for(const l of arr)host.appendChild(cardLead(l));
}
function cardLead(l){
  const d=document.createElement('div');d.className='card';
  const fecha=l.happened_at?new Date(l.happened_at).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  d.innerHTML='<div class="crow">'
    +'<img class="cimg" loading="lazy" src="'+(l.title_image_url||'')+'" onerror="this.style.visibility=\'hidden\'">'
    +'<div class="cinfo">'
    +'<div class="cname">'+(l.full_name||'Sin nombre')+' <span class="badge b-'+l.status+'">'+EST[l.status]+'</span>'+(l.contact_type==='agent'?' <span class="badge b-agent">ASESOR</span>':'')+'</div>'
    +'<div class="cprop">'+(l.property_title||'⚠️ Propiedad no identificada')+'</div>'
    +'<div class="cmeta"><span class="cprice">'+fmt(l.price_amount)+(l.operation_type==='rental'?' /mes':'')+'</span>'+(l.location_name?' · '+l.location_name:'')+'</div>'
    +'<div class="cmeta">'+[l.bedrooms?l.bedrooms+' rec':null,l.bathrooms?l.bathrooms+' baños':null,l.construction_size?l.construction_size+' m²':null].filter(Boolean).join(' · ')+'</div>'
    +'<div class="cmeta">'+ESRC[l.source]+(l.eb_public_id?' · '+l.eb_public_id:'')+' · '+fecha+'</div>'
    +'</div></div>'
    +(l.first_message?'<details><summary>Ver mensaje original</summary><p></p></details>':'')
    +'<div class="acciones">'
    +(l.phone_normalized?'<button class="acc wa">💬 WhatsApp</button>':'')
    +(l.phone_normalized?'<a class="acc tel" href="tel:'+l.phone_normalized+'">📞 Llamar</a>':'')
    +(l.public_url?'<a class="acc ver" target="_blank" href="'+l.public_url+'">🏠 Ver</a>':'')
    +'</div>'
    +'<div class="wabox hidden"><textarea></textarea><button class="go">Abrir WhatsApp con este mensaje</button></div>'
    +'<div class="estado"><span>Estado:</span><select>'
    +Object.entries(EST).map(([k,v])=>'<option value="'+k+'"'+(k===l.status?' selected':'')+'>'+v+'</option>').join('')
    +'</select></div>';
  if(l.first_message)d.querySelector('details p').textContent=l.first_message;
  const wab=d.querySelector('.wabox');
  const btnWa=d.querySelector('.wa');
  if(btnWa)btnWa.onclick=()=>{
    if(wab.classList.contains('hidden')){
      wab.querySelector('textarea').value='Hola '+(l.full_name?l.full_name.split(' ')[0]:'')+', soy tu asesor de NIVA Inmobiliaria. Vi tu interés en "'+(l.property_title||'nuestra propiedad')+'"'+(l.price_amount?' ('+fmt(l.price_amount)+(l.operation_type==='rental'?' al mes':'')+')':'')+'. ¿Te gustaría agendar una visita o resolver alguna duda?';
      wab.classList.remove('hidden');
    } else wab.classList.add('hidden');
  };
  const go=d.querySelector('.go');
  if(go)go.onclick=async()=>{
    const msg=wab.querySelector('textarea').value;
    window.open('https://wa.me/'+l.phone_normalized.replace('+','')+'?text='+encodeURIComponent(msg),'_blank');
    await sb.from('lead_interactions').insert({lead_id:l.id,type:'whatsapp_click',actor:'advisor',payload:{message:msg}});
    if(l.status==='new'){await sb.from('leads').update({status:'contacted'}).eq('id',l.id);l.status='contacted';toast('Lead marcado como CONTACTADO');pintar();cargarContadores()}
  };
  const telA=d.querySelector('.tel');
  if(telA)telA.addEventListener('click',()=>{sb.from('lead_interactions').insert({lead_id:l.id,type:'call_click',actor:'advisor',payload:{}})});
  d.querySelector('select').onchange=async(e)=>{
    const nv=e.target.value, prev=l.status;
    const {error}=await sb.from('leads').update({status:nv}).eq('id',l.id);
    if(error){e.target.value=prev;toast('No se pudo cambiar');return}
    await sb.from('lead_interactions').insert({lead_id:l.id,type:'status_change',actor:'advisor',payload:{de:prev,a:nv}});
    l.status=nv;toast('Estado: '+EST[nv]);pintar();cargarContadores();
  };
  return d;
}
function cargarContadores(){
  $('#n-nuevos').textContent=LEADS.filter(x=>x.status==='new').length;
  $('#n-leads').textContent=LEADS.length;
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  TAB=b.dataset.t;pintar();
});
document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  FIL=b.dataset.f;if(TAB==='nuevos'){TAB='leads';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t==='leads'))}
  pintar();
});
$('#buscar').oninput=(e)=>{Q=e.target.value;pintar()};
// sesion existente
const {data:{session}}=await sb.auth.getSession();
if(session)iniciar();
</script>
</body></html>
