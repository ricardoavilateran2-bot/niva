<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NIVA CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B2A4A; --navy2:#0f1e36; --gold:#C9A84C; --gold2:#e8c96a;
  --bg:#f4f6fa; --card:#fff; --txt:#1e293b; --mut:#64748b; --border:#e2e8f0;
  --ok:#16a34a; --new:#2563eb; --warn:#d97706; --bad:#9ca3af; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.hidden{display:none!important}
button{font-family:inherit}
input,select,textarea{font-family:inherit}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse 80% 60% at 20% 10%, rgba(201,168,76,.10) 0%, transparent 60%),
             linear-gradient(160deg,#0d1828 0%,#1B2A4A 50%,#0d1828 100%)}
.lbox{width:100%;max-width:360px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:34px 28px;box-shadow:0 20px 60px rgba(0,0,0,.4);backdrop-filter:blur(6px)}
.lbox .logo-block{display:flex;align-items:flex-end;gap:4px;justify-content:center}
.lbox .logo-niva{font-size:34px;font-weight:900;letter-spacing:-.02em;color:#fff;line-height:1}
.lbox .logo-dot{width:8px;height:8px;background:var(--gold);border-radius:50%;margin-bottom:5px}
.lbox .logo-sub{text-align:center;font-size:11px;font-weight:600;letter-spacing:.18em;color:rgba(201,168,76,.7);text-transform:uppercase;margin:4px 0 26px}
.lbox label{font-size:12px;color:rgba(255,255,255,.5);display:block;margin:14px 0 6px}
.lbox input{width:100%;padding:12px 14px;border-radius:10px;font-size:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff}
.lbox input:focus{outline:none;border-color:rgba(201,168,76,.5)}
.lbox button{width:100%;margin-top:22px;padding:13px;background:linear-gradient(135deg,var(--gold),#b8922e);color:var(--navy2);border:0;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer}
#lerr{color:#f87171;font-size:12.5px;margin-top:12px;text-align:center;min-height:16px}

/* APP */
#app{display:flex;min-height:100vh}
#sbar{width:220px;flex-shrink:0;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.slogo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.slogo-row{display:flex;align-items:flex-end;gap:4px}
.slogo b{font-size:22px;letter-spacing:-.02em;font-weight:900;line-height:1}
.slogo .dot{width:7px;height:7px;background:var(--gold);border-radius:50%;margin-bottom:3px}
.slogo span{display:block;font-size:9.5px;letter-spacing:.18em;color:rgba(201,168,76,.7);margin-top:3px;font-weight:600}
.sback{display:block;margin:10px 8px 0;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:600;color:rgba(255,255,255,.55);text-decoration:none;border:1px solid rgba(255,255,255,.1);text-align:center;transition:all .18s}
.sback:hover{color:var(--gold);border-color:rgba(201,168,76,.4)}
.snav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.tab{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;background:none;font-size:13px;font-weight:600;border:0;color:rgba(255,255,255,.75);text-align:left;cursor:pointer;white-space:nowrap;transition:background .15s}
.tab:hover{background:rgba(255,255,255,.07)}
.tab.on{background:var(--gold);color:var(--navy)}
.tab .n{margin-left:auto;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.tab.on .n{background:rgba(20,29,51,.18);color:var(--navy)}
.tab .n.hot{background:var(--new);color:#fff}
.sfoot{padding:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:8px}
.hname{font-size:12px;opacity:.85;overflow:hidden;text-overflow:ellipsis}
.hout{background:none;border:1px solid rgba(201,168,76,.4);color:var(--gold);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:all .18s}
.hout:hover{background:var(--gold);color:var(--navy2)}
#contenido{flex:1;min-width:0}
main{padding:20px 20px 60px;max-width:720px;margin:0 auto}

/* ESTADOS DE CARGA / ERROR */
.skel{background:var(--card);border-radius:var(--radius);margin-bottom:12px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.skel .l{height:13px;border-radius:6px;background:linear-gradient(90deg,#eef1f6 25%,#f7f9fc 50%,#eef1f6 75%);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.errbox{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius);padding:22px;text-align:center;margin-top:20px}
.errbox p{color:#991b1b;font-size:14px;margin-bottom:14px;font-weight:600}
.errbox button{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer}

.lsec{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--navy);padding:5px 2px;border-bottom:2px solid var(--gold);margin:14px 0 10px;display:flex;align-items:center;gap:7px}
.lsec span{background:var(--navy);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px}
.lsec.gris{border-bottom-color:var(--border);color:var(--mut)}.lsec.gris span{background:#9ca3af}
.tipofix{padding:0 14px 14px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.tipofix button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.tipofix button:hover{background:#f1f3f7}
.tipofix select{padding:6px 8px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff}
@media(max-width:719px){
  #app{flex-direction:column}
  #sbar{width:100%;height:auto;position:sticky;flex-direction:column;z-index:30}
  .slogo{padding:12px 14px 8px;border-bottom:0;display:flex;align-items:baseline;gap:8px}
  .slogo span{display:inline;margin:0}
  .sback{display:none}
  .snav{flex-direction:row;overflow-x:auto;padding:0 8px 10px;gap:6px}
  .tab{padding:7px 10px;font-size:12px;flex-shrink:0}
  .sfoot{position:absolute;top:10px;right:12px;border:0;padding:0}
  .hname{display:none}
}
.filtros{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.f{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;white-space:nowrap;color:var(--mut);cursor:pointer;font-weight:600;transition:all .15s}
.f.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#buscar{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;margin-bottom:12px;background:#fff}
#buscar:focus{outline:none;border-color:rgba(201,168,76,.7);box-shadow:0 0 0 3px rgba(201,168,76,.12)}

.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(15,23,42,.06);border:1px solid rgba(226,232,240,.7);margin-bottom:12px;overflow:hidden;transition:box-shadow .18s}
.card:hover{box-shadow:0 4px 16px rgba(15,23,42,.09)}
.crow{display:flex;gap:12px;padding:14px}
.cimg{width:80px;height:80px;border-radius:10px;object-fit:cover;background:#e8ecf2;flex-shrink:0}
.cimg-ph{width:80px;height:80px;border-radius:10px;background:linear-gradient(135deg,#1B2A4A,#2a3f66);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:800;font-size:26px}
.cinfo{flex:1;min-width:0}
.cname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;letter-spacing:.5px}
.b-new{background:var(--new)}.b-contacted{background:var(--warn)}.b-attended{background:var(--ok)}.b-cancelled{background:var(--bad)}
.b-agent{background:#7c3aed}.b-client{background:#0e7a3d}.b-unid{background:#64748b}
.cprop{font-size:13px;color:var(--txt);margin-top:3px;line-height:1.35}
.cmeta{font-size:12px;color:var(--mut);margin-top:3px}
.cprice{color:var(--navy);font-weight:700}
details{padding:0 14px 8px}
details summary{font-size:12.5px;color:var(--mut);cursor:pointer}
details p{font-size:13.5px;background:#f1f3f7;border-radius:8px;padding:8px;margin-top:6px;white-space:pre-wrap}
.acciones{display:flex;gap:8px;padding:0 14px 12px}
.acc{flex:1;text-align:center;padding:10px 4px;border-radius:10px;font-size:13.5px;font-weight:700;border:0;text-decoration:none;color:#fff;display:block;cursor:pointer;transition:opacity .15s}
.acc:hover{opacity:.9}
.wa{background:#25d366}.tel{background:var(--navy)}.ver{background:#64748b}
.estado{padding:0 14px 12px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.estado select{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff}
.wabox{padding:0 14px 12px}
.wabox textarea{width:100%;min-height:84px;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px}
.wabox .go{margin-top:8px;width:100%;padding:11px;background:#25d366;color:#fff;border:0;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.vermas{width:100%;padding:12px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);font-size:13.5px;font-weight:700;color:var(--navy);cursor:pointer;margin-top:4px}
.vermas:hover{border-color:rgba(201,168,76,.6)}
#pbarra{padding:12px 12px 0;max-width:760px;margin:0 auto}
#pbarra .filtros{margin-bottom:8px}
.psort{display:flex;gap:8px;flex-wrap:wrap}
.psort select{flex:0 0 auto;border:1px solid var(--border);border-radius:10px;padding:9px 10px;font-size:13.5px;background:#fff}
.psort input{flex:1;min-width:160px;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px}
body[data-tab="props"] main{max-width:1280px}
.psecs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:640px){.psecs{grid-template-columns:1fr}}
.psec{margin-bottom:0}
.psec-h{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--navy);padding:6px 2px;border-bottom:2px solid var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.psec-h span{background:var(--navy);color:#fff;border-radius:999px;padding:1px 9px;font-size:11.5px}
.ptabla{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.06);border:1px solid rgba(226,232,240,.7);overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #eef0f4;text-decoration:none;color:var(--txt)}
.prow:last-child{border-bottom:0}
.prow:hover{background:#f8f9fc}
.prow img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#e8ecf2;flex-shrink:0}
.pr-main{flex:1;min-width:0}
.pr-t{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-m{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-tipo{font-size:11.5px;color:var(--mut);width:92px;flex-shrink:0}
.pr-specs{font-size:11.5px;color:var(--mut);width:110px;flex-shrink:0;text-align:right}
.pr-precio{font-size:13.5px;font-weight:800;color:var(--navy);width:110px;flex-shrink:0;text-align:right}
.pr-precio small{font-weight:600;color:var(--mut);font-size:10.5px}
@media(max-width:560px){.pr-tipo,.pr-specs{display:none}.pr-precio{width:auto}}
.vacio{text-align:center;color:var(--mut);padding:56px 20px;font-size:14.5px;background:var(--card);border-radius:var(--radius);border:1px dashed var(--border)}
.vacio .vi{font-size:34px;display:block;margin-bottom:10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:.3s;pointer-events:none;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1}
</style></head><body>

<div id="login">
  <div class="lbox">
    <div class="logo-block"><span class="logo-niva">NIVA</span><div class="logo-dot"></div></div>
    <div class="logo-sub">CRM · Inmobiliaria</div>
    <label>Usuario</label><input id="lu" autocapitalize="none" autocomplete="username">
    <label>Contraseña</label><input id="lp" type="password" autocomplete="current-password">
    <button id="lbtn">Entrar</button>
    <div id="lerr"></div>
  </div>
</div>

<div id="app" class="hidden">
<aside id="sbar">
  <div class="slogo">
    <div class="slogo-row"><b>NIVA</b><div class="dot"></div></div>
    <span>CRM</span>
  </div>
  <a class="sback" href="./index.html">← Volver a NIVA OS</a>
  <nav class="snav">
    <button class="tab on" data-t="clientes">👤 Clientes<span class="n hot" id="n-clientes">–</span></button>
    <button class="tab" data-t="asesores">👔 Asesores<span class="n" id="n-asesores">–</span></button>
    <button class="tab" data-t="sinid" id="tab-sinid" style="display:none">❓ Sin identificar<span class="n" id="n-sinid">–</span></button>
    <button class="tab" data-t="todos">📋 Todos<span class="n" id="n-todos">–</span></button>
    <button class="tab" data-t="props">🏠 Propiedades<span class="n" id="n-props">–</span></button>
  </nav>
  <div class="sfoot"><div class="hname" id="hname"></div><button class="hout" id="hout">Salir</button></div>
</aside>
<div id="contenido">
<main>
<div id="barra" class="">
  <div class="filtros" id="filtros">
    <button class="f on" data-f="todos">Todos</button>
    <button class="f" data-f="new">Nuevos</button>
    <button class="f" data-f="contacted">Contactados</button>
    <button class="f" data-f="attended">Atendidos</button>
    <button class="f" data-f="cancelled">Cancelados</button>
  </div>
  <input id="buscar" placeholder="Buscar: nombre, teléfono, propiedad, folio, portal...">
</div>
<div id="pbarra" class="hidden">
  <div class="filtros" id="pf-tipo">
    <button class="f on" data-f="todas">Todas</button>
    <button class="f" data-f="casa">Casas</button>
    <button class="f" data-f="depa">Departamentos</button>
    <button class="f" data-f="otro">Otros</button>
  </div>
  <div class="filtros" id="pf-op">
    <button class="f on" data-f="todo">Renta y venta</button>
    <button class="f" data-f="rental">Renta</button>
    <button class="f" data-f="sale">Venta</button>
  </div>
  <div class="psort">
    <select id="pf-sort">
      <option value="az">Ordenar: A → Z</option>
      <option value="za">Ordenar: Z → A</option>
      <option value="pmin">Precio: menor a mayor</option>
      <option value="pmax">Precio: mayor a menor</option>
    </select>
    <input id="pbuscar" placeholder="Buscar por nombre, folio, zona...">
  </div>
</div>
<div id="lista"></div>
</main>
</div>
<div id="toast"></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const cfg = await (await fetch('https://gjyzdwsfdmdfhcspvxbz.supabase.co/functions/v1/niva-config')).json();
const sb = createClient(cfg.url, cfg.anon);
const $ = (s)=>document.querySelector(s);
let LEADS=[], PROPS=[], TAB='clientes', FIL='todos', Q='', ESADMIN=false;
let SHOWN=60; // paginación incremental
const tipoLead=(l)=>l.contact_type||'unidentified';
let PT='todas', PO='todo', PS='az', PQ='';
const EST={new:'NUEVO',contacted:'CONTACTADO',attended:'ATENDIDO',cancelled:'CANCELADO'};
const ESRC={easybroker:'EasyBroker',inmuebles24_email:'Inmuebles24',manual_admin:'Manual'};
const fmt=(n)=>n==null?'':'$'+Number(n).toLocaleString('es-MX');
const ftel=(t)=>t?t.replace('+52',''):'';
// P0: escape de HTML para todo dato dinámico (anti-XSS)
const esc=(v)=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const m2ok=(n)=>n && Number(n)>=20; // saneo: superficies absurdas no se muestran
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

async function entrar(){
  const u=$('#lu').value.trim().toLowerCase(), p=$('#lp').value;
  if(!u||!p){$('#lerr').textContent='Escribe usuario y contraseña';return}
  $('#lerr').textContent='';$('#lbtn').textContent='Entrando...';
  const email=u.includes('@')?u:(u+'@niva.internal');
  const {error}=await sb.auth.signInWithPassword({email,password:p});
  $('#lbtn').textContent='Entrar';
  if(error){$('#lerr').textContent='Usuario o contraseña incorrectos';return}
  iniciar();
}
$('#lbtn').onclick=entrar;
$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});
$('#hout').onclick=async()=>{await sb.auth.signOut();location.reload()};

async function iniciar(){
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  const {data:{user}}=await sb.auth.getUser();
  const uname=(user?.email??'').split('@')[0];
  $('#hname').textContent=uname;
  ESADMIN=(uname==='admin');
  const tabSinId=$('#tab-sinid');
  if(tabSinId) tabSinId.style.display = ESADMIN ? '' : 'none';
  if(!ESADMIN && TAB==='sinid'){
    TAB='clientes';
    document.querySelectorAll('.snav .tab').forEach(b=>b.classList.toggle('on', b.dataset.t==='clientes'));
  }
  await cargar();
}
function skeleton(){
  const host=$('#lista');
  host.innerHTML='';
  for(let i=0;i<4;i++){
    const d=document.createElement('div');d.className='skel';
    d.innerHTML='<div class="l" style="width:45%"></div><div class="l" style="width:70%"></div><div class="l" style="width:30%;margin-bottom:0"></div>';
    host.appendChild(d);
  }
}
function errorCarga(msg){
  $('#lista').innerHTML='<div class="errbox"><p>⚠️ No se pudieron cargar los datos'+(msg?': '+esc(msg):'')+'.</p><button id="btn-reintentar">🔄 Reintentar</button></div>';
  document.getElementById('btn-reintentar').onclick=()=>cargar();
}
async function cargar(){
  skeleton(); // P0: estado de carga visible
  try{
    const [l,p]=await Promise.all([
      sb.from('my_leads').select('*').order('happened_at',{ascending:false}),
      sb.from('my_properties').select('*')
    ]);
    // P0: detectar errores de Supabase en vez de pintar éxito vacío
    if(l.error) throw new Error(l.error.message||'leads');
    if(p.error) throw new Error(p.error.message||'propiedades');
    LEADS=l.data??[];PROPS=p.data??[];
    cargarContadores();
    pintar();
  }catch(e){
    console.error('[CRM] error de carga:',e);
    errorCarga(e.message);
  }
}
function tipoDe(p){
  const t=(p.property_type||'').toLowerCase();
  if(t.includes('depa')||t.includes('departamento'))return 'depa';
  if(t.includes('casa'))return 'casa';
  return 'otro';
}
function vacioHTML(txt,icon){return '<div class="vacio"><span class="vi">'+(icon||'📭')+'</span>'+txt+'</div>'}
function pintar(){
  document.body.dataset.tab=TAB;
  $('#barra').style.display=TAB==='props'?'none':'';
  $('#pbarra').classList.toggle('hidden',TAB!=='props');
  const host=$('#lista');host.innerHTML='';
  if(TAB==='props'){
    if(!PROPS.length){host.innerHTML=vacioHTML('No tienes propiedades activas asignadas.','🏠');return}
    let ps=PROPS.slice();
    if(PT!=='todas')ps=ps.filter(p=>tipoDe(p)===PT);
    if(PO!=='todo')ps=ps.filter(p=>p.operation_type===PO);
    if(PQ){const q=PQ.toLowerCase();ps=ps.filter(p=>[p.title,p.eb_public_id,p.location_name,p.property_type].join(' ').toLowerCase().includes(q))}
    const tt=(p)=>(p.title||p.eb_public_id||'').toLowerCase();
    if(PS==='az')ps.sort((a,b)=>tt(a).localeCompare(tt(b)));
    else if(PS==='za')ps.sort((a,b)=>tt(b).localeCompare(tt(a)));
    else if(PS==='pmin')ps.sort((a,b)=>(a.price_amount??Infinity)-(b.price_amount??Infinity));
    else if(PS==='pmax')ps.sort((a,b)=>(b.price_amount??-1)-(a.price_amount??-1));
    if(!ps.length){host.innerHTML=vacioHTML('Sin propiedades con esos filtros.','🔍');return}
    const secciones=[['rental','RENTA'],['sale','VENTA']];
    const wrapper=document.createElement('div');wrapper.className='psecs';
    for(const [op,titulo] of secciones){
      const grupo=ps.filter(p=>p.operation_type===op);
      if(!grupo.length)continue;
      const sec=document.createElement('div');sec.className='psec';
      sec.innerHTML='<div class="psec-h">'+titulo+' <span>'+grupo.length+'</span></div>';
      const tabla=document.createElement('div');tabla.className='ptabla';
      for(const p of grupo){
        const fila=document.createElement('a');fila.className='prow';
        if(p.public_url){fila.href=p.public_url;fila.target='_blank';fila.rel='noopener'}
        const specs=[p.bedrooms?p.bedrooms+'r':null,p.bathrooms?p.bathrooms+'b':null,m2ok(p.construction_size)?p.construction_size+'m²':null].filter(Boolean).join(' · ');
        fila.innerHTML='<img loading="lazy" src="'+esc(p.title_image_url||'')+'" onerror="this.style.visibility=\'hidden\'">'
          +'<div class="pr-main"><div class="pr-t">'+esc(p.title||p.eb_public_id)+'</div>'
          +'<div class="pr-m">'+esc(p.eb_public_id)+(p.location_name?' · '+esc(p.location_name):'')+'</div></div>'
          +'<div class="pr-tipo">'+esc(p.property_type||'')+'</div>'
          +'<div class="pr-specs">'+specs+'</div>'
          +'<div class="pr-precio">'+fmt(p.price_amount)+(op==='rental'?'<small>/mes</small>':'')+'</div>';
        tabla.appendChild(fila);
      }
      sec.appendChild(tabla);wrapper.appendChild(sec);
    }
    host.appendChild(wrapper);
    return;
  }
  let arr=LEADS.slice();
  if(TAB==='clientes')arr=arr.filter(l=>tipoLead(l)==='client');
  else if(TAB==='asesores')arr=arr.filter(l=>tipoLead(l)==='agent');
  else if(TAB==='sinid')arr=arr.filter(l=>tipoLead(l)==='unidentified');
  if(FIL!=='todos')arr=arr.filter(x=>x.status===FIL);
  if(Q){const q=Q.toLowerCase();arr=arr.filter(x=>[x.full_name,x.phone_normalized,x.property_title,x.eb_public_id,ESRC[x.source]].join(' ').toLowerCase().includes(q))}
  const vacios={clientes:'Sin clientes por ahora.',asesores:'Sin leads de asesores.',sinid:'Nada pendiente de identificar. ✅',todos:'Sin resultados.'};
  if(!arr.length){host.innerHTML=vacioHTML(vacios[TAB]||'Sin resultados.',TAB==='sinid'?'✅':'📭');return}
  const nuevos=arr.filter(l=>l.status==='new'), resto=arr.filter(l=>l.status!=='new');
  const ordenado=(FIL==='todos')?[...nuevos,...resto]:[...nuevos,...resto];
  const total=ordenado.length;
  const visibles=ordenado.slice(0,SHOWN);
  let nCount=0;
  if(FIL==='todos'&&nuevos.length&&resto.length){
    const h1=document.createElement('div');h1.className='lsec';h1.innerHTML='🟢 NUEVOS <span>'+nuevos.length+'</span>';host.appendChild(h1);
    let restoHeader=false;
    for(const l of visibles){
      if(l.status!=='new'&&!restoHeader){
        const h2=document.createElement('div');h2.className='lsec gris';h2.innerHTML='ANTERIORES <span>'+resto.length+'</span>';host.appendChild(h2);
        restoHeader=true;
      }
      host.appendChild(cardLead(l));
    }
  } else {
    for(const l of visibles)host.appendChild(cardLead(l));
  }
  if(total>SHOWN){
    const b=document.createElement('button');b.className='vermas';
    b.textContent='Mostrar más ('+(total-SHOWN)+' restantes)';
    b.onclick=()=>{SHOWN+=60;pintar()};
    host.appendChild(b);
  }
}
function cardLead(l){
  const d=document.createElement('div');d.className='card';
  const fecha=l.happened_at?new Date(l.happened_at).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  const nombre=(l.full_name&&l.full_name.trim().length>2)?l.full_name:'Sin nombre';
  const inicial=esc(nombre.charAt(0).toUpperCase());
  const imgHTML=l.title_image_url
    ?'<img class="cimg" loading="lazy" src="'+esc(l.title_image_url)+'" onerror="this.outerHTML=\'<div class=cimg-ph>'+inicial+'</div>\'">'
    :'<div class="cimg-ph">'+inicial+'</div>';
  const metaSpecs=[l.bedrooms?l.bedrooms+' rec':null,l.bathrooms?l.bathrooms+' baños':null,m2ok(l.construction_size)?l.construction_size+' m²':null].filter(Boolean).join(' · ');
  const metaSrc=[ESRC[l.source],l.eb_public_id?esc(l.eb_public_id):null].filter(Boolean).join(' · ');
  const telVisible=l.phone_normalized?('<div class="cmeta">📱 <a href="tel:'+esc(l.phone_normalized)+'" style="color:var(--navy);font-weight:700;text-decoration:none">'+esc(ftel(l.phone_normalized))+'</a></div>'):'';
  const fechaVisible=fecha?('<div class="cmeta">🕐 Se comunicó: <strong style="color:var(--txt)">'+fecha+'</strong></div>'):'';
  d.innerHTML='<div class="crow">'
    +imgHTML
    +'<div class="cinfo">'
    +'<div class="cname">'+esc(nombre)+' <span class="badge b-'+esc(l.status)+'">'+(EST[l.status]||esc(l.status))+'</span>'
    +(tipoLead(l)==='agent'?' <span class="badge b-agent">👔 ASESOR</span>':tipoLead(l)==='client'?' <span class="badge b-client">👤 CLIENTE</span>':' <span class="badge b-unid">❓ SIN IDENTIFICAR</span>')+'</div>'
    +'<div class="cprop">'+(l.property_title?esc(l.property_title):'⚠️ Propiedad no identificada')+'</div>'
    +'<div class="cmeta"><span class="cprice">'+fmt(l.price_amount)+(l.operation_type==='rental'?' /mes':'')+'</span>'+(l.location_name?' · '+esc(l.location_name):'')+'</div>'
    +(metaSpecs?'<div class="cmeta">'+metaSpecs+'</div>':'')
    +telVisible
    +fechaVisible
    +'<div class="cmeta">'+metaSrc+'</div>'
    +'</div></div>'
    +(l.first_message?'<details><summary>Ver mensaje original</summary><p></p></details>':'')
    +'<div class="acciones">'
    +(l.phone_normalized?'<button class="acc wa">💬 WhatsApp</button>':'')
    +(l.phone_normalized?'<a class="acc tel" href="tel:'+esc(l.phone_normalized)+'">📞 Llamar</a>':'')
    +(l.public_url?'<a class="acc ver" target="_blank" rel="noopener" href="'+esc(l.public_url)+'">🏠 Ver</a>':'')
    +'</div>'
    +'<div class="wabox hidden"><textarea></textarea><button class="go">Abrir WhatsApp con este mensaje</button></div>'
    +'<div class="estado"><span>Estado:</span><select>'
    +Object.entries(EST).map(([k,v])=>'<option value="'+k+'"'+(k===l.status?' selected':'')+'>'+v+'</option>').join('')
    +'</select></div>'
    +(tipoLead(l)==='unidentified'&&!ESADMIN?'<div class="tipofix"><span>Tipo:</span><button data-tp="client">👤 Cliente</button><button data-tp="agent">👔 Asesor</button></div>':'')
    +(ESADMIN?'<div class="tipofix"><span>Tipo:</span><select class="tpsel"><option value="client"'+(tipoLead(l)==='client'?' selected':'')+'>👤 Cliente</option><option value="agent"'+(tipoLead(l)==='agent'?' selected':'')+'>👔 Asesor</option><option value="unidentified"'+(tipoLead(l)==='unidentified'?' selected':'')+'>❓ Sin identificar</option></select></div>':'');
  if(l.first_message)d.querySelector('details p').textContent=l.first_message;
  const wab=d.querySelector('.wabox');
  const btnWa=d.querySelector('.wa');
  if(btnWa)btnWa.onclick=()=>{
    if(wab.classList.contains('hidden')){
      wab.querySelector('textarea').value='Hola '+(l.full_name?l.full_name.split(' ')[0]:'')+', soy tu asesor de NIVA Inmobiliaria. Vi tu interés en "'+(l.property_title||'nuestra propiedad')+'"'+(l.price_amount?' ('+fmt(l.price_amount)+(l.operation_type==='rental'?' al mes':'')+')':'')+'. ¿Te gustaría agendar una visita o resolver alguna duda?';
      wab.classList.remove('hidden');
    } else wab.classList.add('hidden');
  };
  const go=d.querySelector('.go');
  if(go)go.onclick=async()=>{
    const msg=wab.querySelector('textarea').value;
    window.open('https://wa.me/'+l.phone_normalized.replace('+','')+'?text='+encodeURIComponent(msg),'_blank');
    await sb.from('lead_interactions').insert({lead_id:l.id,type:'whatsapp_click',actor:'advisor',payload:{message:msg}});
    if(l.status==='new'){await sb.from('leads').update({status:'contacted'}).eq('id',l.id);l.status='contacted';toast('Lead marcado como CONTACTADO');pintar();cargarContadores()}
  };
  const telA=d.querySelector('.tel');
  if(telA)telA.addEventListener('click',()=>{sb.from('lead_interactions').insert({lead_id:l.id,type:'call_click',actor:'advisor',payload:{}})});
  d.querySelector('.estado select').onchange=async(e)=>{
    const nv=e.target.value, prev=l.status;
    const {error}=await sb.from('leads').update({status:nv}).eq('id',l.id);
    if(error){e.target.value=prev;toast('No se pudo cambiar');return}
    await sb.from('lead_interactions').insert({lead_id:l.id,type:'status_change',actor:'advisor',payload:{de:prev,a:nv}});
    l.status=nv;toast('Estado: '+EST[nv]);pintar();cargarContadores();
  };
  async function cambiarTipo(nv){
    const {error}=await sb.rpc('set_lead_contact_type',{p_lead_id:l.id,p_type:nv});
    if(error){toast('No se pudo cambiar el tipo');return}
    const mismos=LEADS.filter(x=>(l.phone_normalized&&x.phone_normalized===l.phone_normalized)||x.id===l.id);
    mismos.forEach(x=>x.contact_type=nv);
    toast('Tipo: '+(nv==='client'?'CLIENTE':nv==='agent'?'ASESOR':'SIN IDENTIFICAR'));
    pintar();cargarContadores();
  }
  d.querySelectorAll('.tipofix button').forEach(b=>b.onclick=()=>cambiarTipo(b.dataset.tp));
  const tps=d.querySelector('.tpsel');
  if(tps)tps.onchange=(e)=>cambiarTipo(e.target.value);
  return d;
}
function cargarContadores(){
  const cli=LEADS.filter(l=>tipoLead(l)==='client');
  const cliNew=cli.filter(l=>l.status==='new').length;
  const nc=$('#n-clientes');
  nc.textContent=cliNew>0?cliNew:cli.length;
  nc.classList.toggle('hot',cliNew>0);
  nc.title=cliNew>0?(cliNew+' clientes nuevos'):(cli.length+' clientes');
  $('#n-asesores').textContent=LEADS.filter(l=>tipoLead(l)==='agent').length;
  $('#n-sinid').textContent=LEADS.filter(l=>tipoLead(l)==='unidentified').length;
  $('#n-todos').textContent=LEADS.length;
  $('#n-props').textContent=PROPS.length;
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  TAB=b.dataset.t;SHOWN=60;pintar();
});
document.querySelectorAll('#filtros .f').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#filtros .f').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  FIL=b.dataset.f;SHOWN=60;pintar();
});
// P2: debounce en búsquedas
let _dq=null;
$('#buscar').oninput=(e)=>{clearTimeout(_dq);_dq=setTimeout(()=>{Q=e.target.value;SHOWN=60;pintar()},180)};
document.querySelectorAll('#pf-tipo .f').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#pf-tipo .f').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  PT=b.dataset.f;pintar();
});
document.querySelectorAll('#pf-op .f').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#pf-op .f').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  PO=b.dataset.f;pintar();
});
$('#pf-sort').onchange=(e)=>{PS=e.target.value;pintar()};
let _dpq=null;
$('#pbuscar').oninput=(e)=>{clearTimeout(_dpq);_dpq=setTimeout(()=>{PQ=e.target.value;pintar()},180)};
// sesion existente
const {data:{session}}=await sb.auth.getSession();
if(session)iniciar();
</script>
