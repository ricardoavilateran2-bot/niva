<!doctype html>
<html lang="es" class="oscuro"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NIVA CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B2A4A; --navy2:#0f1e36; --gold:#C9A84C; --gold2:#e8c96a;
  --bg:#f4f6fa; --card:#fff; --txt:#1e293b; --mut:#64748b; --border:#e2e8f0;
  --ok:#eab308; --new:#2563eb; --warn:#16a34a; --bad:#dc2626; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;min-height:100dvh}
.hidden{display:none!important}
button{font-family:inherit}
input,select,textarea{font-family:inherit}

/* LOGIN */
#login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse 80% 60% at 20% 10%, rgba(201,168,76,.10) 0%, transparent 60%),
             linear-gradient(160deg,#0d1828 0%,#1B2A4A 50%,#0d1828 100%)}
.lbox{width:100%;max-width:360px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:34px 28px;box-shadow:0 20px 60px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lbox .logo-block{display:flex;align-items:flex-end;gap:4px;justify-content:center}
.lbox .logo-niva{font-size:34px;font-weight:900;letter-spacing:-.02em;color:#fff;line-height:1}
.lbox .logo-dot{width:8px;height:8px;background:var(--gold);border-radius:50%;margin-bottom:5px}
.lbox .logo-sub{text-align:center;font-size:12px;font-weight:600;letter-spacing:.18em;color:rgba(201,168,76,.7);text-transform:uppercase;margin:4px 0 26px}
.lbox label{font-size:12px;color:rgba(255,255,255,.5);display:block;margin:14px 0 6px}
.lbox input{width:100%;padding:12px 14px;border-radius:10px;font-size:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff}
.lbox input:focus{outline:none;border-color:rgba(201,168,76,.5)}
.lbox button{width:100%;margin-top:22px;padding:13px;background:linear-gradient(135deg,var(--gold),#b8922e);color:var(--navy2);border:0;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer}
#lerr{color:#f87171;font-size:12.5px;margin-top:12px;text-align:center;min-height:16px}

/* APP */
#app{display:flex;min-height:100vh;min-height:100dvh}
#sbar{width:220px;flex-shrink:0;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh}
.slogo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.slogo-row{display:flex;align-items:flex-end;gap:4px}
.slogo b{font-size:22px;letter-spacing:-.02em;font-weight:900;line-height:1}
.slogo .dot{width:7px;height:7px;background:var(--gold);border-radius:50%;margin-bottom:3px}
.slogo span{display:block;font-size:12px;letter-spacing:.18em;color:rgba(201,168,76,.7);margin-top:3px;font-weight:600}
.sback{display:block;margin:10px 8px 0;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:600;color:rgba(255,255,255,.55);text-decoration:none;border:1px solid rgba(255,255,255,.1);text-align:center;transition:all .18s}
.sback:hover{color:var(--gold);border-color:rgba(201,168,76,.4)}
.niva-backfab{position:fixed;top:14px;left:14px;z-index:99999;background:#1B2A4A;color:#C9A84C;font:600 12px 'Inter',sans-serif;padding:8px 14px;border-radius:9px;text-decoration:none;box-shadow:0 3px 12px rgba(0,0,0,.3);border:1px solid rgba(201,168,76,.4);display:inline-flex;align-items:center;gap:6px;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .22s ease,transform .22s ease}
.niva-backfab.show{opacity:1;transform:translateY(0);pointer-events:auto}
.niva-backfab:hover{background:#22345c}
.snuevo{display:block;width:calc(100% - 16px);margin:10px 8px 2px;padding:10px 12px;border-radius:9px;font-size:13px;font-weight:800;color:#0d1a2e;background:var(--gold);border:0;cursor:pointer;transition:filter .18s}
.snuevo:hover{filter:brightness(1.08)}
#modalNuevo{position:fixed;inset:0;background:rgba(8,14,26,.62);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
#modalNuevo .mbox{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:92vh;overflow-y:auto}
#modalNuevo h3{margin:0 0 14px;font-size:17px;color:var(--navy)}
#modalNuevo label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:12px 0 5px}
#modalNuevo label small{font-weight:500;opacity:.8}
#modalNuevo input,#modalNuevo select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:#fff;box-sizing:border-box;font-family:inherit}
#modalNuevo input:focus,#modalNuevo select:focus{outline:none;border-color:rgba(201,168,76,.7);box-shadow:0 0 0 3px rgba(201,168,76,.12)}
#modalNuevo .merr{min-height:18px;margin-top:10px;font-size:12.5px;color:#c0392b;font-weight:600}
#modalNuevo .macc{display:flex;gap:10px;margin-top:6px}
#modalNuevo .macc button{flex:1;padding:12px;border-radius:10px;font-size:14.5px;font-weight:700;border:0;cursor:pointer}
#modalNuevo .mcancel{background:#eef1f5;color:var(--mut)}
#modalNuevo .msave{background:var(--navy);color:#fff}
#modalNuevo .msave:disabled{opacity:.6;cursor:default}
.snav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.tab{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;background:none;font-size:13px;font-weight:600;border:0;color:rgba(255,255,255,.75);text-align:left;cursor:pointer;white-space:nowrap;transition:background .15s}
.tab:hover{background:rgba(255,255,255,.07)}
.tab.on{background:var(--gold);color:var(--navy)}
.tab .n{margin-left:auto;font-size:12px;font-weight:800;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.tab.on .n{background:rgba(20,29,51,.18);color:var(--navy)}
.tab .n.hot{background:var(--new);color:#fff}
.sfoot{padding:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:8px}
.hname{font-size:12px;opacity:.85;overflow:hidden;text-overflow:ellipsis}
.hout{background:none;border:1px solid rgba(201,168,76,.4);color:var(--gold);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:all .18s}
.hout:hover{background:var(--gold);color:var(--navy2)}
#contenido{flex:1;min-width:0}
main{padding:20px 20px 60px;max-width:720px;margin:0 auto}

/* ESTADOS DE CARGA / ERROR */
.skel{background:var(--card);border-radius:var(--radius);margin-bottom:12px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.skel .l{height:13px;border-radius:6px;background:linear-gradient(90deg,#eef1f6 25%,#f7f9fc 50%,#eef1f6 75%);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.errbox{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius);padding:22px;text-align:center;margin-top:20px}
.errbox p{color:#991b1b;font-size:14px;margin-bottom:14px;font-weight:600}
.errbox button{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer}

.lsec{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--navy);padding:5px 2px;border-bottom:2px solid var(--gold);margin:14px 0 10px;display:flex;align-items:center;gap:7px}
.lsec span{background:var(--navy);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px}
.lsec.gris{border-bottom-color:var(--border);color:var(--mut)}.lsec.gris span{background:#9ca3af}
.tipofix{padding:0 14px 14px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.tipofix button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.tipofix button:hover{background:#f1f3f7}
.tipofix select{padding:8px 8px;border:1px solid var(--border);border-radius:8px;font-size:16px;background:#fff}
@media(max-width:719px){
  #app{flex-direction:column}
  #sbar{width:100%;height:auto;position:sticky;flex-direction:column;z-index:30}
  .slogo{padding:12px 14px 8px;border-bottom:0;display:flex;align-items:baseline;gap:8px}
  .slogo span{display:inline;margin:0}
  .sback{display:none}
  .snuevo{margin:0 8px 8px;width:calc(100% - 16px)}
  .snav{flex-direction:row;overflow-x:auto;padding:0 8px 10px;gap:6px}
  .tab{padding:7px 10px;font-size:12px;flex-shrink:0}
  .sfoot{position:absolute;top:10px;right:12px;border:0;padding:0}
  .hname{display:none}
}
.filtros{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.f{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;white-space:nowrap;color:var(--mut);cursor:pointer;font-weight:600;transition:all .15s}
.f.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#buscar{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:16px;margin-bottom:12px;background:#fff}
#buscar:focus{outline:none;border-color:rgba(201,168,76,.7);box-shadow:0 0 0 3px rgba(201,168,76,.12)}

.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(15,23,42,.06);border:1px solid rgba(226,232,240,.7);margin-bottom:12px;overflow:hidden;transition:box-shadow .18s}
.card:hover{box-shadow:0 4px 16px rgba(15,23,42,.09)}
.crow{display:flex;gap:12px;padding:14px}
.cimg{width:80px;height:80px;border-radius:10px;object-fit:cover;background:#e8ecf2;flex-shrink:0}
.cimg-ph{width:80px;height:80px;border-radius:10px;background:linear-gradient(135deg,#1B2A4A,#2a3f66);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:800;font-size:26px}
.cinfo{flex:1;min-width:0}
.cname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;letter-spacing:.5px}
.b-new{background:var(--new)}.b-contacted{background:var(--warn)}.b-attended{background:var(--ok)}.b-cancelled{background:var(--bad)}
.b-agent{background:#7c3aed}.b-client{background:#0e7a3d}.b-unid{background:#64748b}
.cprop{font-size:13px;color:var(--txt);margin-top:3px;line-height:1.35}
.cmeta{font-size:12px;color:var(--mut);margin-top:3px}
.cprice{color:var(--navy);font-weight:700}
details{padding:0 14px 8px}
details summary{font-size:12.5px;color:var(--mut);cursor:pointer}
details p{font-size:13.5px;background:#f1f3f7;border-radius:8px;padding:8px;margin-top:6px;white-space:pre-wrap}
.acciones{display:flex;gap:8px;padding:0 14px 12px}
.acc{flex:1;text-align:center;padding:10px 4px;border-radius:10px;font-size:13.5px;font-weight:700;border:0;text-decoration:none;color:#fff;display:block;cursor:pointer;transition:opacity .15s}
.acc:hover{opacity:.9}
.wa{background:#25d366}.tel{background:var(--navy)}.ver{background:#64748b}
.arch{background:#8a94a6}.desarch{background:#3d6b4a}.elim{background:#b4451f}
.fsep{width:1px;background:var(--border);margin:2px 4px;flex-shrink:0}
.sagrupo{background:#fff;border:1px solid var(--border);border-left:3px solid #c9a84c;border-radius:var(--radius);padding:13px 15px;margin-bottom:11px}
.sagrupo.sinprop{border-left-color:#b4451f}
.sat{font-weight:800;color:var(--navy);font-size:14.5px;line-height:1.3}
.sam{font-size:12.5px;color:var(--mut);margin-top:3px}
.sanombres{font-size:12.5px;color:var(--txt);margin-top:8px;line-height:1.5}
.sanombres span{display:inline-block;background:#f1f3f7;border-radius:6px;padding:2px 7px;margin:0 4px 4px 0}
.saacc{display:flex;gap:8px;margin-top:11px;align-items:center;flex-wrap:wrap}
.saacc select{flex:1;min-width:170px;padding:9px 10px;border:1px solid var(--border);border-radius:9px;font-size:16px;background:#fff}
.saacc button{padding:9px 16px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer}
.saacc button:disabled{opacity:.5;cursor:default}
.saacc button.elimg{background:#f6e8e4;color:#b4451f}
.saacc button.elimg:disabled{opacity:.6}
.sacount{background:var(--navy);color:#fff;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;margin-left:6px}
.sahead{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 0 9px}
.sahead:first-child{margin-top:0}
body[data-vista="tablero"] main{max-width:1600px}
body[data-vista="tablero"] #buscar{max-width:640px}
.kb{display:flex;gap:10px;align-items:flex-start;padding-bottom:10px;width:100%}
.kbcol{flex:1 1 0;min-width:0;background:#eaeef3;border-radius:12px;padding:7px;min-height:110px;transition:background .15s}
/* en pantallas angostas las columnas recuperan ancho fijo y el tablero se desliza */
@media(max-width:860px){.kb{overflow-x:auto}.kbcol{flex:0 0 235px;min-width:235px}}
.kbcol.sobre{background:#e0e9dd;outline:2px dashed #3d6b4a;outline-offset:-2px}
.kbh{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:3px 5px 9px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.kbh>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbn{background:#fff;border-radius:99px;padding:2px 8px;font-size:12px;color:var(--navy)}
.kbcard{background:#fff;border-radius:10px;padding:9px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.09);cursor:grab;border-left:3px solid #cbd3de;overflow-wrap:anywhere}
.kbcard:hover{box-shadow:0 3px 10px rgba(0,0,0,.14)}
.kbcard.arrastrando{opacity:.4}
.kbcard.s-new{border-left-color:#2563eb}
.kbcard.s-contacted{border-left-color:#16a34a}
.kbcard.s-attended{border-left-color:#eab308}
.kbcard.s-cancelled{border-left-color:#dc2626}
.kbt{font-weight:800;font-size:13.5px;color:var(--navy);line-height:1.25}
.kbp{font-size:12px;color:var(--txt);line-height:1.3;margin-top:3px}
.kbm{font-size:12px;color:var(--mut);margin-top:5px;display:flex;justify-content:space-between;gap:8px}
.kbm b{color:var(--navy);font-weight:700}
.kbacc{display:flex;gap:5px;margin-top:8px}
.kbacc a,.kbacc button{flex:1 1 0;min-width:0;text-align:center;font-size:12px;font-weight:700;padding:11px 2px;border-radius:7px;border:0;color:#fff;text-decoration:none;cursor:pointer;display:block;white-space:nowrap;overflow:hidden}
/* Mover de etapa sin arrastrar — el drag-and-drop del tablero no funciona en
   celular/iPad (no dispara eventos táctiles), así que cada tarjeta trae este
   select como alternativa que funciona igual con dedo, mouse o teclado. */
.kbmover{width:100%;margin-top:6px;padding:10px 8px;border-radius:7px;border:1px solid rgba(0,0,0,.12);background:#f6f8fb;color:var(--navy);font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
.kbvacia{font-size:12px;color:var(--mut);text-align:center;padding:14px 6px;font-style:italic}
#modalFicha{position:fixed;inset:0;background:rgba(8,14,26,.62);display:flex;align-items:flex-start;justify-content:center;z-index:70;padding:20px 12px;overflow-y:auto}
#modalFicha .fbox{width:100%;max-width:520px;position:relative;margin-top:8px}
#modalFicha .fcerrar{position:absolute;top:-12px;right:-6px;z-index:2;width:36px;height:36px;padding:0;border:2px solid #fff;border-radius:50%;background:var(--navy);color:#fff;font-size:20px;line-height:1;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.35)}
/* Con el detalle de un lead abierto se oculta el botón "← NIVA OS" */
body.ficha-abierta .niva-backfab{display:none!important}
.interes{margin:0 14px 12px;padding:11px 12px;background:#f6f8fb;border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:10px}
.ilinea{display:flex;gap:10px;font-size:13px;padding:3px 0;align-items:baseline}
.ilinea span{flex:0 0 92px;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.ilinea b{flex:1;color:var(--txt);font-weight:600;line-height:1.45}
.ilinea b em{font-style:normal;color:var(--mut);font-weight:500;font-size:12px}
.inota{margin-top:7px;font-size:12px;color:var(--mut);font-style:italic}
.repwrap{display:flex;flex-direction:column;gap:14px}
.repsec{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;overflow-x:auto}
.reph{font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.07em;margin-bottom:10px;text-transform:uppercase}
.repgrid{display:flex;flex-wrap:wrap;gap:8px}
.repbtn{padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:13.5px;font-weight:700;color:var(--navy);cursor:pointer;transition:all .15s}
.repbtn:hover{border-color:rgba(201,168,76,.6)}
.repbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.reptable{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
.reptable th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.reptable td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.reptable tr:last-child td{border-bottom:0}
.reptable td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.reptable th.num{text-align:right}
.repbar{height:8px;background:var(--navy);border-radius:99px;min-width:2px}
.repnote{font-size:12.5px;color:var(--mut);margin-top:8px}
.acc:disabled{opacity:.6;cursor:default}
.card.esarchivada{opacity:.82}
.estado{padding:0 14px 12px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.estado select{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:16px;background:#fff}
.notas{padding:12px 14px 14px;border-top:1px solid var(--border);margin-top:2px}
.notas .nlabel{font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.notas .ncampo{margin-bottom:8px}
.notas .ncampo label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.notas .ncampo input,.notas .ncampo textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:inherit;box-sizing:border-box}
.notas .ncampo textarea{min-height:60px;resize:vertical}
.notas .nguardarbtn{width:100%;padding:9px;background:var(--navy);color:#fff;border:0;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-top:2px}
.notas .nguardarbtn:disabled{opacity:.6}
.editnombre{background:none;border:none;cursor:pointer;font-size:13px;padding:0 2px;vertical-align:middle;opacity:.6}
.editnombre:hover{opacity:1}
.nombrebox{padding:0 14px 12px;display:flex;gap:6px;flex-wrap:wrap}
.nombrebox.hidden{display:none}
.nombrebox .ninput{flex:1;min-width:160px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px}
.nombrebox .nguardar{padding:9px 14px;background:var(--navy);color:#fff;border:0;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.nombrebox .ncancelar{padding:9px 14px;background:#fff;color:var(--mut);border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.addtel{background:none;border:none;cursor:pointer;font-size:12.5px;color:var(--navy);font-weight:700;padding:0;text-decoration:underline}
.telbox{padding:0 14px 12px;display:flex;gap:6px;flex-wrap:wrap}
.telbox.hidden{display:none}

window.abrirWA=function(tel,texto){
  tel=String(tel||'').replace(/\D/g,'');
  var q=texto?('&text='+encodeURIComponent(texto)):'';
  var web='https://wa.me/'+tel+(texto?('?text='+encodeURIComponent(texto)):'');
  var movil=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if(!movil){ window.open(web,'_blank'); return; }
  var salio=false, marca=function(){ if(document.hidden) salio=true; };
  document.addEventListener('visibilitychange',marca);
  location.href='whatsapp://send?phone='+tel+q;
  setTimeout(function(){ document.removeEventListener('visibilitychange',marca); if(!salio && !document.hidden) window.open(web,'_blank'); },1800);
};
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[href^="https://wa.me/"]'); if(!a) return;
  e.preventDefault(); var u=new URL(a.href); window.abrirWA(u.pathname.slice(1),u.searchParams.get('text')||'');
},true);
</script>

// Nombre y teléfono viven en `contacts` (la vista my_leads no expone contact_id). Antes el CRM
// intentaba escribir columnas inexistentes en `leads` y el guardado fallaba para todos.
// Ahora: RPC actualizar_contacto_lead (valida permisos y duplicados); si la RPC aún no existe
// en la base, el admin puede actualizar el contacto directo (los asesores reciben un aviso claro).
async function actualizarContacto(l, cambios){
  const r=await sb.rpc('actualizar_contacto_lead',{p_lead_id:l.id, p_nombre:cambios.nombre??null, p_telefono:cambios.telefono??null});
  if(!r.error) return r.data;
  const noExiste=/could not find the function|does not exist|PGRST202/i.test(r.error.message||'')||r.error.code==='PGRST202'||r.error.code==='42883';
  if(!noExiste) throw r.error;
  const lk=await sb.from('leads').select('contact_id').eq('id',l.id).maybeSingle();
  if(lk.error||!lk.data) throw new Error('No se encontró el contacto del lead');
  const upd={};
  if(cambios.nombre!=null) upd.full_name=cambios.nombre;
  if(cambios.telefono!=null) upd.phone_normalized='+52'+String(cambios.telefono).slice(-10);
  const u=await sb.from('contacts').update(upd).eq('id',lk.data.contact_id).select('id');
  if(u.error) throw u.error;
  if(!u.data||!u.data.length) throw new Error('Tu usuario no tiene permiso para editar contactos; pide al administrador que aplique la actualización de la base de datos.');
  return {ok:true};
}

async function resolveAdvisorDisplayName(uname){
  try{
    // Primero por identidad real (my_advisor_id resuelve auth.uid → app_users → advisors);
    // el nombre de pila solo como respaldo (dos asesores pueden llamarse igual).
    const me=await sb.rpc('my_advisor_id');

      const {data:row}=await sb.from('advisors').select('first_name,last_name').eq('id',me.data).maybeSingle();
      if(row) return ((row.first_name||'')+' '+(row.last_name||'')).trim();
    }
    const {data}=await sb.from('advisors').select('first_name,last_name');
    const rows=data||[];
    const norm=s=>(s||'').trim().toLowerCase();
    let match=rows.find(r=>norm(r.first_name)===uname);
    if(!match){ const tok=uname.split(/[._]/)[0]; match=rows.find(r=>norm(r.first_name)===tok); }
    if(match) return ((match.first_name||'')+' '+(match.last_name||'')).trim();
  }catch(e){}
  return uname.split(/[._]/).filter(Boolean).map(s=>s[0].toUpperCase()+s.slice(1)).join(' ');
}

const CACHE_KEY='niva_cache_v1', QUEUE_KEY='niva_queue_v1';
// Errores que NO se arreglan reintentando (permisos, violación de reglas, valor inválido)
const esErrorPermanente=(e)=>!!e && (['42501','23514','23505','22P02','PGRST301','PGRST116'].includes(e.code) || /permission|policy|row-level|invalid input|violates/i.test(e.message||''));

}
function cargarCache(){
  try{
    const raw=localStorage.getItem(CACHE_KEY);
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(e){return null}
}
function leerCola(){
  try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]');}catch(e){return []}
}
function guardarCola(q){
  try{localStorage.setItem(QUEUE_KEY, JSON.stringify(q));}catch(e){}
  actualizarBadgeSync();
}
function encolar(op){
  const q=leerCola();
  q.push(Object.assign({id:Date.now()+'_'+Math.random().toString(36).slice(2)},op));
  guardarCola(q);
}
function actualizarBadgeSync(){
  const n=leerCola().length;
  const b=$('#syncBanner');
  if(!b)return;
  if(!navigator.onLine){
    b.textContent='📡 Sin conexión'+(n?' — '+n+' cambio'+(n>1?'s':'')+' pendiente'+(n>1?'s':'')+' de sincronizar':' — viendo datos guardados');
    b.classList.remove('hidden');
  }else if(n>0){
    b.textContent='🔄 Sincronizando '+n+' cambio'+(n>1?'s':'')+' pendiente'+(n>1?'s':'')+'...';
    b.classList.remove('hidden');
  }else{
    b.classList.add('hidden');
  }
}
let SINCRONIZANDO=false;
async function sincronizar(){
  if(!navigator.onLine)return;
  // Sin este candado, el listener 'online' y el setInterval de 30s podían disparar dos
  // sincronizar() encimadas; al terminar, la más lenta sobreescribía localStorage con
  // una foto vieja de la cola y borraba en silencio cambios que el asesor había hecho
  // (y encolado) mientras la primera sincronización seguía en curso.
  if(SINCRONIZANDO)return;
  SINCRONIZANDO=true;
  try{
    let q=leerCola();
    if(!q.length)return;
    const exitosos=new Set();
    for(const op of q){
      try{
        if(op.tipo==='status_change'){
          const {error}=await sb.from('leads').update({status:op.nuevo}).eq('id',op.leadId);
          if(error && esErrorPermanente(error)){ exitosos.add(op.id); continue; } // no reintentar lo que la base rechaza siempre
          if(error)throw error;
                    sb.from('lead_interactions').insert({lead_id:op.leadId,type:'status_change',actor:'advisor',payload:{de:op.prev,a:op.nuevo}}).then(()=>{});
        }
        exitosos.add(op.id);
      }catch(e){
        // se reintenta después
      }
    }
    // Se vuelve a leer la cola actual (no la foto de arriba) para no perder operaciones
    // nuevas que se hayan encolado mientras esto corría.
    const qActual=leerCola();
    const restantes=qActual.filter(op=>!exitosos.has(op.id));
    guardarCola(restantes);
    if(exitosos.size>0)toast('Cambios sincronizados ✓');
    actualizarBadgeSync();
  } finally {
    SINCRONIZANDO=false;
  }
}
window.addEventListener('online',()=>{actualizarBadgeSync();sincronizar();});
window.addEventListener('offline',actualizarBadgeSync);

async function cargar(){
  skeleton(); // P0: estado de carga visible

      LEADS=c.LEADS||[];PROPS=c.PROPS||[];

  }

      sb.from('my_leads').select('*').order('happened_at',{ascending:false}).range(0,9999),
      sb.from('my_properties').select('*').range(0,9999)
    ]);
    // P0: detectar errores de Supabase en vez de pintar éxito vacío.
    // Antes cualquier error (red, sesión vencida, RLS) se trataba igual y terminaba
    // mostrando "Sin conexión — mostrando datos guardados" aunque hubiera wifi perfecto,
    // dejando al asesor trabajando horas con datos viejos creyendo que era un problema
    // de señal. Si la sesión realmente expiró, lo decimos y mandamos a iniciar sesión.
    const esErrorDeSesion=(r)=> r?.error && (r.error.status===401 || r.error.code==='PGRST301' || /jwt|token/i.test(r.error.message||''));
    if(esErrorDeSesion(l) || esErrorDeSesion(p)){
      const {data:{session:s2}}=await sb.auth.getSession();
      if(!s2){
        toast('Tu sesión expiró — vuelve a iniciar sesión.');
        setTimeout(()=>window.location.replace('./index.html'),1600);
        return;

    }
    if(l.error) throw new Error(l.error.message||'leads');
    if(p.error) throw new Error(p.error.message||'propiedades');
    LEADS=l.data??[];PROPS=p.data??[];

    if(ESADMIN){

        if(!a.error)ASESORES=(a.data||[]).filter(x=>x.status!=='inactive')
          .map(x=>({id:x.id,n:(((x.first_name||'')+' '+(x.last_name||'')).trim())||x.niva_code||'Asesor'}))
          .sort((x,y)=>x.n.localeCompare(y.n));

      const fa=$('#f-asesor'); if(fa&&fa.options.length<=2){ ASESORES.forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=a.n;fa.appendChild(o);}); fa.classList.remove('hidden'); }
      const d=await sb.from('property_advisors').select('property_id,advisor_id').order('updated_at',{ascending:false}).range(0,9999); // la API corta en 1000 filas: pedimos primero las más recientes (las renovadas) para que no parezcan 'sin dueño'
      DUENOS={};
      if(!d.error)(d.data||[]).forEach(x=>{DUENOS[x.property_id]=x.advisor_id});
    }
    cargarContadores();
    pintar();
    actualizarBadgeSync();
    LASTLEADIDS=new Set(LEADS.map(x=>x.id));
    cargarUltimos();
    cargarCitas();
    $('#newBanner').classList.remove('show');
  }catch(e){
    console.error('[CRM] error de carga:',e);
    const c=cargarCache();
    if(c){
      LEADS=c.LEADS||[];PROPS=c.PROPS||[];
      cargarContadores();pintar();actualizarBadgeSync();
      // Si de verdad no hay red, el aviso de "sin conexión" es correcto y tranquiliza.
      // Si SÍ hay red y aun así falló, decirle "sin conexión" es engañoso — mostramos
      // el error real para que el asesor sepa que algo distinto pasó (y pueda avisar).
      toast(navigator.onLine
        ? 'No se pudo actualizar (mostrando datos guardados): '+(e.message||'error desconocido')
        : 'Sin conexión — mostrando datos guardados');
      return;
    }
    errorCarga(e.message);
  }
}

function grupoSinAsignar(clave,titulo,sub,leads,esProp){

  d.innerHTML='<div class="sat">'+titulo+'<span class="sacount">'+leads.length+(leads.length===1?' lead':' leads')+'</span></div>'

    // con propiedad basta un lead: el servidor arrastra a los demas de esa propiedad
    const objetivo = esProp ? [leads[0]] : leads;
    let err=null;
    for(const l of objetivo){
      const r=await sb.rpc('asignar_asesor',{p_lead_id:l.id,p_advisor_id:sel.value});
      if(r.error){err=r.error;break}
    }
    if(err){btn.disabled=false;btn.textContent='Asignar';toast('No se pudo asignar');return}
    toast('Asignado a '+((ASESORES.find(a=>a.id===sel.value)||{}).n||'asesor'));
    await cargar();
  };
  const belim=d.querySelector('.elimg');
  if(belim)belim.onclick=async()=>{
    if(!confirm('¿Eliminar definitivamente '+(leads.length>1?'estos '+leads.length+' leads':'este lead')+'?\n\nSe borran junto con su historial. No se puede deshacer.\n\nSi solo quieres organizarlos, mejor asígnalos a un asesor.'))return;
    const motivo=prompt('¿Por qué los eliminas? (opcional — queda en la bitácora)','');
    if(motivo===null)return;
    belim.disabled=true;belim.textContent='Eliminando...';
    let err=null;
    for(const l of leads){
      const r=await sb.rpc('eliminar_lead',{p_lead_id:l.id,p_motivo:motivo||null});
      if(r.error){err=r.error;break}
    }
    if(err){belim.disabled=false;belim.textContent='🗑️ Eliminar';toast(err.message||'No se pudo eliminar');return}
    toast(leads.length>1?'Leads eliminados':'Lead eliminado');
    await cargar();
  };
  return d;
}

async function archivarLead(l,archivando){
  const cambio=archivando
    ? {archived_at:new Date().toISOString(), archived_by:USUARIO}
    : {archived_at:null, archived_by:null};
  const {error}=await sb.from('leads').update(cambio).eq('id',l.id);
  if(error){ toast('No se pudo '+(archivando?'archivar':'restaurar')); return false; }
  l.archived_at=cambio.archived_at;l.archived_by=cambio.archived_by;
  sb.from('lead_interactions').insert({lead_id:l.id,type:archivando?'archived':'unarchived',actor:'advisor',payload:{}}).then(()=>{});
  // Al archivar/restaurar se cierra el detalle del lead (asesor o cliente)
  const mfA=document.getElementById('modalFicha'); if(mfA){mfA.remove();document.body.classList.remove('ficha-abierta');}
  toast(archivando?'Lead archivado':'Lead restaurado');
  pintar();cargarContadores();
  return true;
}
async function moverEtapa(id,nuevo){
  const l=LEADS.find(x=>x.id===id);
  if(!l||l.status===nuevo)return;
  const prev=l.status;l.status=nuevo;pintar();cargarContadores();guardarCache();
  if(!navigator.onLine){
    encolar({tipo:'status_change',leadId:id,prev,nuevo});
    toast('Movido a '+EST[nuevo]+' (sin conexión, se sincronizará)');
    return;
  }
  const {error,data}=await sb.from('leads').update({status:nuevo}).eq('id',id).select('id');
  if(error||!data||!data.length){
    if(error && esErrorPermanente(error) || (!error && (!data||!data.length))){
      // rechazo definitivo (permisos / lead ya no es tuyo): revertimos y avisamos, no lo dejamos en cola infinita
      l.status=prev;pintar();cargarContadores();guardarCache();
      toast('No se pudo mover: '+(error?.message||'el lead ya no está asignado a ti'));
      return;
    }
    // pudo ser un corte de red en el momento del envío: no revertimos, lo encolamos
    encolar({tipo:'status_change',leadId:id,prev,nuevo});
    toast('Movido a '+EST[nuevo]+' (pendiente de sincronizar)');
    return;
  }
    sb.from('lead_interactions').insert({lead_id:id,type:'status_change',actor:'advisor',payload:{de:prev,a:nuevo}}).then(()=>{});
  toast('Movido a '+EST[nuevo]);
}

  host.appendChild(kb);

function textoCliente(l){
  let t=(l.first_message||'').trim();
  if(!t)return '';
  if(/^Lead Inmuebles24/i.test(t))return '';           // resumen del portal, no es del cliente
  if(/^Cliente capturado directamente/i.test(t))return '';
  t=t.replace(/^Enviado por WhatsApp:\s*/i,'').replace(/^Pregunta:\s*/i,'');
  return t.trim();
}

function cargarContadores(){
  const activos=LEADS.filter(l=>!esArchivado(l));
  const cli=activos.filter(l=>tipoLead(l)==='client');
  const cliNew=cli.filter(l=>l.status==='new').length;
  const nc=$('#n-clientes');
  nc.textContent=cliNew>0?cliNew:'';
  nc.style.display=cliNew>0?'':'none';
  nc.classList.toggle('hot',cliNew>0);
  nc.title=cliNew>0?(cliNew+' clientes nuevos'):'';
  $('#n-asesores').textContent=activos.filter(l=>tipoLead(l)==='agent').length;
  $('#n-sinid').textContent=activos.filter(l=>tipoLead(l)==='unidentified').length;
  $('#n-todos').textContent=activos.length;
  $('#n-arch').textContent=LEADS.filter(esArchivado).length;
  const nsa=$('#n-sinasig');
  if(nsa){
    const sa=activos.filter(l=>!l.advisor_id).length+PROPS.filter(p=>!DUENOS[p.id]).length;
    nsa.textContent=sa;
    nsa.classList.toggle('hot',sa>0);
  }
}

let REP=null;
async function cargarDatosRep(){
  if(REP)return REP;
  const [l,c,p,a,i,pc,pv]=await Promise.all([
    sb.from('leads').select('*').range(0,9999),
    sb.from('contacts').select('*'),
    sb.from('properties').select('id,eb_public_id,title,property_type,operation_type,price_amount,location_name,eb_status,bedrooms,bathrooms,construction_size,eb_created_at'),
    sb.from('advisors').select('*'),
    sb.from('lead_interactions').select('lead_id,type,actor,created_at'),
    sb.from('portal_costos').select('*'),
    sb.from('portal_volumen').select('*')
  ]);
  for(const r of [l,c,p,a,i]) if(r.error) throw new Error(r.error.message);
  const cMap={},pMap={},aMap={};
  (c.data||[]).forEach(x=>cMap[x.id]=x);
  (p.data||[]).forEach(x=>pMap[x.id]=x);
  (a.data||[]).forEach(x=>aMap[x.id]=x);
  REP={L:l.data||[],C:c.data||[],P:p.data||[],A:a.data||[],I:i.data||[],
       COST:(pc&&pc.data)||[],VOL:(pv&&pv.data)||[],cMap,pMap,aMap};
  return REP;
}

function descargarCSV(nombre,cols,filas){
  const escv=(v)=>{v=(v==null)?'':String(v).replace(/\r?\n/g,' ');return /[",]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const txt='﻿'+cols.join(',')+'\n'+filas.map(f=>f.map(escv).join(',')).join('\n');
  const b=new Blob([txt],{type:'text/csv;charset=utf-8'});
  const el=document.createElement('a');el.href=URL.createObjectURL(b);
  el.download='NIVA_'+nombre+'_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(el);el.click();el.remove();
  toast('Descargado: '+el.download);
}

function repDiaHora(){
  const act=REP.L.filter(x=>!x.archived_at);
  const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const pd=[0,0,0,0,0,0,0];
  act.forEach(l=>{const f=l.happened_at||l.created_at;if(f)pd[new Date(f).getDay()]++});
  const mxd=Math.max(1,...pd);
  const orden=[1,2,3,4,5,6,0];
  const fd=orden.map(i=>[DIAS[i],pd[i],pct(pd[i],act.length),
    '<div class="repbar" style="width:'+Math.max(3,Math.round(pd[i]*100/mxd))+'%"></div>']);
  // horas: solo las reales (la importación dejó 12:00 ficticio)
  const reales=act.filter(l=>{const f=l.happened_at;if(!f)return false;
    const d=new Date(f);return !(d.getHours()===12&&d.getMinutes()===0&&d.getSeconds()===0)});
  const BLOQ=[[6,9,'Madrugada y temprano (6–9h)'],[9,12,'Mañana (9–12h)'],[12,15,'Mediodía (12–15h)'],
              [15,18,'Tarde (15–18h)'],[18,21,'Noche (18–21h)'],[21,30,'Noche tarde (21–6h)']];
  const fh=BLOQ.map(([a,b,nom])=>{

    return [nom,n,pct(n,reales.length)];
  });
  return tablaHTML('📆 Leads por día de la semana',['Día','#Leads','#% del total','Volumen'],fd,

        : 'Las franjas con más entrada son donde no puedes dejar el WhatsApp sin contestar.');
}

function repCosto(){
  const PORTAL={easybroker:'EasyBroker',inmuebles24:'Inmuebles24'};
  const SRC={easybroker:'easybroker',inmuebles24:'inmuebles24_email'};
  if(!REP.COST.length)return tablaHTML('💸 Costo por lead',['Aviso'],[['Todavía no hay costos de portal cargados.']],null);
  const meses=[...new Set(REP.VOL.map(v=>v.mes))].sort().reverse().slice(0,4);
  // mezcla cliente/colega segun lo que SI esta clasificado en el CRM
  const mezcla={};
  Object.keys(SRC).forEach(k=>{
    const ls=REP.L.filter(l=>l.source===SRC[k]);
    const cli=ls.filter(l=>((REP.cMap[l.contact_id]||{}).contact_type)==='client').length;
    mezcla[k]={n:ls.length,cli,pctCli:ls.length?cli/ls.length:0};
  });
  const filas=[];
  REP.COST.forEach(c=>{
    const vols=REP.VOL.filter(v=>v.portal===c.portal&&meses.indexOf(v.mes)>=0);
    const prom=vols.length?Math.round(vols.reduce((s,v)=>s+v.consultas,0)/vols.length):0;
    const m=mezcla[c.portal]||{pctCli:0,n:0};
    const clientes=Math.round(prom*m.pctCli);
    filas.push([
      '<strong>'+(PORTAL[c.portal]||esc(c.portal))+'</strong><br><small style="color:#8a94a6">'+esc(c.nota||'')+'</small>',
      fmt(c.monto_mensual)+'/mes',
      prom||'—',
      prom?'<strong>'+fmt(Math.round(c.monto_mensual/prom))+'</strong>':'—',
      m.n?Math.round(m.pctCli*100)+'%':'—',
      clientes||'—',
      clientes?'<strong>'+fmt(Math.round(c.monto_mensual/clientes))+'</strong>':'—'
    ]);
  });
  const totalMes=REP.COST.reduce((s,c)=>s+Number(c.monto_mensual),0);
  // detalle mes a mes
  const det=meses.map(mes=>{
    const f=[mes];
    REP.COST.forEach(c=>{
      const v=REP.VOL.find(x=>x.portal===c.portal&&x.mes===mes);
      f.push(v?v.consultas+' · '+fmt(Math.round(c.monto_mensual/v.consultas)):'—');
    });
    return f;
  });
  return tablaHTML('💸 Costo por lead por portal',
    ['Portal','#Inversión','#Consultas/mes','#Costo x consulta','#% clientes','#Clientes/mes','#Costo x cliente'],filas,
    'Inviertes <b>'+fmt(totalMes)+' al mes</b> en portales. La columna que manda es <b>Costo por cliente</b>: las consultas de colegas no te traen comprador, te traen comisión compartida.')
   +tablaHTML('📆 Consultas y costo, mes a mes',['Mes'].concat(REP.COST.map(c=>'#'+(PORTAL[c.portal]||c.portal))),det,
    'Si las consultas de un portal bajan mes con mes y el pago es fijo, tu costo por lead sube solo. Ahí es cuando conviene renegociar o mover la inversión.');
}

function abrirNuevoCliente(){
  const sel=$('#nc-prop');
  const ps=PROPS.slice().sort((a,b)=>String(a.title||'').localeCompare(String(b.title||'')));
  sel.innerHTML='<option value="">— Sin propiedad todavía —</option>'
    +ps.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.title||p.eb_public_id||'')+'</option>').join('');
  $('#nc-nombre').value='';$('#nc-tel').value='';sel.value='';
  $('#nc-err').textContent='';
  $('#modalNuevo').classList.remove('hidden');
  setTimeout(()=>$('#nc-nombre').focus(),50);
}
function cerrarNuevoCliente(){$('#modalNuevo').classList.add('hidden')}
async function guardarNuevoCliente(){
  const nombre=$('#nc-nombre').value.trim();
  const tel=$('#nc-tel').value.replace(/\D/g,'');
  const prop=$('#nc-prop').value||null;
  const err=$('#nc-err'), btn=$('#nc-save');
  if(nombre.length<3){err.textContent='Escribe el nombre completo del cliente.';return}
  if(tel.length<10){err.textContent='El teléfono debe tener 10 dígitos.';return}
  err.textContent='';btn.disabled=true;btn.textContent='Guardando...';
  const {error}=await sb.rpc('crear_lead_manual',{p_nombre:nombre,p_telefono:tel,p_property_id:prop});
  btn.disabled=false;btn.textContent='Guardar cliente';
  if(error){err.textContent=error.message||'No se pudo guardar el cliente.';return}
  cerrarNuevoCliente();
  toast('Cliente agregado ✅');
  await cargar();
}
$('#btn-nuevo').onclick=abrirNuevoCliente;
$('#nc-cancel').onclick=cerrarNuevoCliente;
$('#nc-save').onclick=guardarNuevoCliente;
$('#modalNuevo').addEventListener('click',e=>{if(e.target.id==='modalNuevo')cerrarNuevoCliente()});
$('#nc-tel').addEventListener('keydown',e=>{if(e.key==='Enter')guardarNuevoCliente()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modalNuevo').classList.contains('hidden'))cerrarNuevoCliente()});

function mostrarBienvenida(){
  const b=$('#bienvenida');
  b.innerHTML='<div class="bv-h"><b>Así funciona tu CRM</b><button type="button" class="bv-x" aria-label="Cerrar">✕</button></div>'
   +'<ol class="bv-pasos">'

   +'<li><span>3</span><div><b>El color te avisa.</b> <i class="kbage g">verde</i> al día · <i class="kbage a">ámbar</i> se está enfriando · <i class="kbage r">rojo</i> urgente. Cuenta los días desde tu último contacto.</div></li>'
   +'</ol><button type="button" class="bv-ok">Entendido</button>';
  b.classList.remove('hidden');
  const cerrar=()=>{ b.classList.add('hidden'); try{ localStorage.setItem('niva_crm_bienvenida_v1','1'); }catch(_e){} };

}

(function(){
  var btn=document.getElementById('niva-backfab');
  if(!btn) return;
  var lastY=window.pageYOffset||0, ticking=false;
  function upd(){
    var y=window.pageYOffset||0;
    if(y<40 || y<lastY-4){ btn.classList.add('show'); }
    else if(y>lastY+4){ btn.classList.remove('show'); }
    lastY=y; ticking=false;
  }
  window.addEventListener('scroll',function(){ if(!ticking){requestAnimationFrame(upd);ticking=true;} },{passive:true});
  upd();
})();
