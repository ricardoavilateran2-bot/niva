<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NIVA CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B2A4A; --navy2:#0f1e36; --gold:#C9A84C; --gold2:#e8c96a;
  --bg:#f4f6fa; --card:#fff; --txt:#1e293b; --mut:#64748b; --border:#e2e8f0;
  --ok:#eab308; --new:#2563eb; --warn:#16a34a; --bad:#dc2626; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.hidden{display:none!important}
button{font-family:inherit}
input,select,textarea{font-family:inherit}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse 80% 60% at 20% 10%, rgba(201,168,76,.10) 0%, transparent 60%),
             linear-gradient(160deg,#0d1828 0%,#1B2A4A 50%,#0d1828 100%)}
.lbox{width:100%;max-width:360px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:34px 28px;box-shadow:0 20px 60px rgba(0,0,0,.4);backdrop-filter:blur(6px)}
.lbox .logo-block{display:flex;align-items:flex-end;gap:4px;justify-content:center}
.lbox .logo-niva{font-size:34px;font-weight:900;letter-spacing:-.02em;color:#fff;line-height:1}
.lbox .logo-dot{width:8px;height:8px;background:var(--gold);border-radius:50%;margin-bottom:5px}
.lbox .logo-sub{text-align:center;font-size:11px;font-weight:600;letter-spacing:.18em;color:rgba(201,168,76,.7);text-transform:uppercase;margin:4px 0 26px}
.lbox label{font-size:12px;color:rgba(255,255,255,.5);display:block;margin:14px 0 6px}
.lbox input{width:100%;padding:12px 14px;border-radius:10px;font-size:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff}
.lbox input:focus{outline:none;border-color:rgba(201,168,76,.5)}
.lbox button{width:100%;margin-top:22px;padding:13px;background:linear-gradient(135deg,var(--gold),#b8922e);color:var(--navy2);border:0;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer}
#lerr{color:#f87171;font-size:12.5px;margin-top:12px;text-align:center;min-height:16px}

/* APP */
#app{display:flex;min-height:100vh}
#sbar{width:220px;flex-shrink:0;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.slogo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.slogo-row{display:flex;align-items:flex-end;gap:4px}
.slogo b{font-size:22px;letter-spacing:-.02em;font-weight:900;line-height:1}
.slogo .dot{width:7px;height:7px;background:var(--gold);border-radius:50%;margin-bottom:3px}
.slogo span{display:block;font-size:9.5px;letter-spacing:.18em;color:rgba(201,168,76,.7);margin-top:3px;font-weight:600}
.sback{display:block;margin:10px 8px 0;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:600;color:rgba(255,255,255,.55);text-decoration:none;border:1px solid rgba(255,255,255,.1);text-align:center;transition:all .18s}
.sback:hover{color:var(--gold);border-color:rgba(201,168,76,.4)}
.snuevo{display:block;width:calc(100% - 16px);margin:10px 8px 2px;padding:10px 12px;border-radius:9px;font-size:13px;font-weight:800;color:#0d1a2e;background:var(--gold);border:0;cursor:pointer;transition:filter .18s}
.snuevo:hover{filter:brightness(1.08)}
#modalNuevo{position:fixed;inset:0;background:rgba(8,14,26,.62);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
#modalNuevo .mbox{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:92vh;overflow-y:auto}
#modalNuevo h3{margin:0 0 14px;font-size:17px;color:var(--navy)}
#modalNuevo label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:12px 0 5px}
#modalNuevo label small{font-weight:500;opacity:.8}
#modalNuevo input,#modalNuevo select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px;background:#fff;box-sizing:border-box;font-family:inherit}
#modalNuevo input:focus,#modalNuevo select:focus{outline:none;border-color:rgba(201,168,76,.7);box-shadow:0 0 0 3px rgba(201,168,76,.12)}
#modalNuevo .merr{min-height:18px;margin-top:10px;font-size:12.5px;color:#c0392b;font-weight:600}
#modalNuevo .macc{display:flex;gap:10px;margin-top:6px}
#modalNuevo .macc button{flex:1;padding:12px;border-radius:10px;font-size:14.5px;font-weight:700;border:0;cursor:pointer}
#modalNuevo .mcancel{background:#eef1f5;color:var(--mut)}
#modalNuevo .msave{background:var(--navy);color:#fff}
#modalNuevo .msave:disabled{opacity:.6;cursor:default}
.snav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.tab{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;background:none;font-size:13px;font-weight:600;border:0;color:rgba(255,255,255,.75);text-align:left;cursor:pointer;white-space:nowrap;transition:background .15s}
.tab:hover{background:rgba(255,255,255,.07)}
.tab.on{background:var(--gold);color:var(--navy)}
.tab .n{margin-left:auto;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.tab.on .n{background:rgba(20,29,51,.18);color:var(--navy)}
.tab .n.hot{background:var(--new);color:#fff}
.sfoot{padding:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:8px}
.hname{font-size:12px;opacity:.85;overflow:hidden;text-overflow:ellipsis}
.hout{background:none;border:1px solid rgba(201,168,76,.4);color:var(--gold);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:all .18s}
.hout:hover{background:var(--gold);color:var(--navy2)}
#contenido{flex:1;min-width:0}
main{padding:20px 20px 60px;max-width:720px;margin:0 auto}

/* ESTADOS DE CARGA / ERROR */
.skel{background:var(--card);border-radius:var(--radius);margin-bottom:12px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.skel .l{height:13px;border-radius:6px;background:linear-gradient(90deg,#eef1f6 25%,#f7f9fc 50%,#eef1f6 75%);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.errbox{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius);padding:22px;text-align:center;margin-top:20px}
.errbox p{color:#991b1b;font-size:14px;margin-bottom:14px;font-weight:600}
.errbox button{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer}

.lsec{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--navy);padding:5px 2px;border-bottom:2px solid var(--gold);margin:14px 0 10px;display:flex;align-items:center;gap:7px}
.lsec span{background:var(--navy);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px}
.lsec.gris{border-bottom-color:var(--border);color:var(--mut)}.lsec.gris span{background:#9ca3af}
.tipofix{padding:0 14px 14px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.tipofix button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.tipofix button:hover{background:#f1f3f7}
.tipofix select{padding:6px 8px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff}
@media(max-width:719px){
  #app{flex-direction:column}
  #sbar{width:100%;height:auto;position:sticky;flex-direction:column;z-index:30}
  .slogo{padding:12px 14px 8px;border-bottom:0;display:flex;align-items:baseline;gap:8px}
  .slogo span{display:inline;margin:0}
  .sback{display:none}
  .snuevo{margin:0 8px 8px;width:calc(100% - 16px)}
  .snav{flex-direction:row;overflow-x:auto;padding:0 8px 10px;gap:6px}
  .tab{padding:7px 10px;font-size:12px;flex-shrink:0}
  .sfoot{position:absolute;top:10px;right:12px;border:0;padding:0}
  .hname{display:none}
}
.filtros{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.f{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;white-space:nowrap;color:var(--mut);cursor:pointer;font-weight:600;transition:all .15s}
.f.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#buscar{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;margin-bottom:12px;background:#fff}
#buscar:focus{outline:none;border-color:rgba(201,168,76,.7);box-shadow:0 0 0 3px rgba(201,168,76,.12)}

.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(15,23,42,.06);border:1px solid rgba(226,232,240,.7);margin-bottom:12px;overflow:hidden;transition:box-shadow .18s}
.card:hover{box-shadow:0 4px 16px rgba(15,23,42,.09)}
.crow{display:flex;gap:12px;padding:14px}
.cimg{width:80px;height:80px;border-radius:10px;object-fit:cover;background:#e8ecf2;flex-shrink:0}
.cimg-ph{width:80px;height:80px;border-radius:10px;background:linear-gradient(135deg,#1B2A4A,#2a3f66);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:800;font-size:26px}
.cinfo{flex:1;min-width:0}
.cname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;letter-spacing:.5px}
.b-new{background:var(--new)}.b-contacted{background:var(--warn)}.b-attended{background:var(--ok)}.b-cancelled{background:var(--bad)}
.b-agent{background:#7c3aed}.b-client{background:#0e7a3d}.b-unid{background:#64748b}
.cprop{font-size:13px;color:var(--txt);margin-top:3px;line-height:1.35}
.cmeta{font-size:12px;color:var(--mut);margin-top:3px}
.cprice{color:var(--navy);font-weight:700}
details{padding:0 14px 8px}
details summary{font-size:12.5px;color:var(--mut);cursor:pointer}
details p{font-size:13.5px;background:#f1f3f7;border-radius:8px;padding:8px;margin-top:6px;white-space:pre-wrap}
.acciones{display:flex;gap:8px;padding:0 14px 12px}
.acc{flex:1;text-align:center;padding:10px 4px;border-radius:10px;font-size:13.5px;font-weight:700;border:0;text-decoration:none;color:#fff;display:block;cursor:pointer;transition:opacity .15s}
.acc:hover{opacity:.9}
.wa{background:#25d366}.tel{background:var(--navy)}.ver{background:#64748b}
.arch{background:#8a94a6}.desarch{background:#3d6b4a}.elim{background:#b4451f}
.pr-cancel{border:0;background:#f6e8e4;color:#b4451f;border-radius:7px;padding:4px 6px;font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap;width:62px;flex-shrink:0;text-align:center}
.pr-cancel:hover{background:#f0d8d2}
.pr-cancel.rea{background:#e3ede5;color:#3d6b4a}
.pr-fila.cancelada{opacity:.62}
.fsep{width:1px;background:var(--border);margin:2px 4px;flex-shrink:0}
.sagrupo{background:#fff;border:1px solid var(--border);border-left:3px solid #c9a84c;border-radius:var(--radius);padding:13px 15px;margin-bottom:11px}
.sagrupo.sinprop{border-left-color:#b4451f}
.sat{font-weight:800;color:var(--navy);font-size:14.5px;line-height:1.3}
.sam{font-size:12.5px;color:var(--mut);margin-top:3px}
.sanombres{font-size:12.5px;color:var(--txt);margin-top:8px;line-height:1.5}
.sanombres span{display:inline-block;background:#f1f3f7;border-radius:6px;padding:2px 7px;margin:0 4px 4px 0}
.saacc{display:flex;gap:8px;margin-top:11px;align-items:center;flex-wrap:wrap}
.saacc select{flex:1;min-width:170px;padding:9px 10px;border:1px solid var(--border);border-radius:9px;font-size:14px;background:#fff}
.saacc button{padding:9px 16px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer}
.saacc button:disabled{opacity:.5;cursor:default}
.saacc button.elimg{background:#f6e8e4;color:#b4451f}
.saacc button.elimg:disabled{opacity:.6}
.sacount{background:var(--navy);color:#fff;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;margin-left:6px}
.sahead{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 0 9px}
.sahead:first-child{margin-top:0}
body[data-vista="tablero"] main{max-width:1600px}
body[data-vista="tablero"] #buscar{max-width:640px}
.kb{display:flex;gap:10px;align-items:flex-start;padding-bottom:10px;width:100%}
.kbcol{flex:1 1 0;min-width:0;background:#eaeef3;border-radius:12px;padding:7px;min-height:110px;transition:background .15s}
/* en pantallas angostas las columnas recuperan ancho fijo y el tablero se desliza */
@media(max-width:860px){.kb{overflow-x:auto}.kbcol{flex:0 0 235px;min-width:235px}}
.kbcol.sobre{background:#e0e9dd;outline:2px dashed #3d6b4a;outline-offset:-2px}
.kbh{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:3px 5px 9px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.kbh>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbn{background:#fff;border-radius:99px;padding:2px 8px;font-size:11px;color:var(--navy)}
.kbcard{background:#fff;border-radius:10px;padding:9px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.09);cursor:grab;border-left:3px solid #cbd3de;overflow-wrap:anywhere}
.kbcard:hover{box-shadow:0 3px 10px rgba(0,0,0,.14)}
.kbcard.arrastrando{opacity:.4}
.kbcard.s-new{border-left-color:#2563eb}
.kbcard.s-contacted{border-left-color:#16a34a}
.kbcard.s-attended{border-left-color:#eab308}
.kbcard.s-cancelled{border-left-color:#dc2626}
.kbt{font-weight:800;font-size:13.5px;color:var(--navy);line-height:1.25}
.kbp{font-size:12px;color:var(--txt);line-height:1.3;margin-top:3px}
.kbm{font-size:11px;color:var(--mut);margin-top:5px;display:flex;justify-content:space-between;gap:8px}
.kbm b{color:var(--navy);font-weight:700}
.kbacc{display:flex;gap:5px;margin-top:8px}
.kbacc a,.kbacc button{flex:1 1 0;min-width:0;text-align:center;font-size:10.5px;font-weight:700;padding:5px 1px;border-radius:7px;border:0;color:#fff;text-decoration:none;cursor:pointer;display:block;white-space:nowrap;overflow:hidden}
.kbvacia{font-size:12px;color:var(--mut);text-align:center;padding:14px 6px;font-style:italic}
#modalFicha{position:fixed;inset:0;background:rgba(8,14,26,.62);display:flex;align-items:flex-start;justify-content:center;z-index:70;padding:20px 12px;overflow-y:auto}
#modalFicha .fbox{width:100%;max-width:520px}
#modalFicha .fcerrar{display:block;width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:#fff;color:var(--navy);font-weight:700;font-size:14px;cursor:pointer}
.interes{margin:0 14px 12px;padding:11px 12px;background:#f6f8fb;border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:10px}
.ilinea{display:flex;gap:10px;font-size:13px;padding:3px 0;align-items:baseline}
.ilinea span{flex:0 0 92px;color:var(--mut);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.ilinea b{flex:1;color:var(--txt);font-weight:600;line-height:1.45}
.ilinea b em{font-style:normal;color:var(--mut);font-weight:500;font-size:12px}
.inota{margin-top:7px;font-size:11.5px;color:var(--mut);font-style:italic}
.repwrap{display:flex;flex-direction:column;gap:14px}
.repsec{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;overflow-x:auto}
.reph{font-size:11.5px;font-weight:800;color:var(--mut);letter-spacing:.07em;margin-bottom:10px;text-transform:uppercase}
.repgrid{display:flex;flex-wrap:wrap;gap:8px}
.repbtn{padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:13.5px;font-weight:700;color:var(--navy);cursor:pointer;transition:all .15s}
.repbtn:hover{border-color:rgba(201,168,76,.6)}
.repbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.reptable{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
.reptable th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.reptable td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.reptable tr:last-child td{border-bottom:0}
.reptable td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.reptable th.num{text-align:right}
.repbar{height:8px;background:var(--navy);border-radius:99px;min-width:2px}
.repnote{font-size:12.5px;color:var(--mut);margin-top:8px}
.acc:disabled{opacity:.6;cursor:default}
.card.esarchivada{opacity:.82}
.estado{padding:0 14px 12px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.estado select{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff}
.editnombre{background:none;border:none;cursor:pointer;font-size:13px;padding:0 2px;vertical-align:middle;opacity:.6}
.editnombre:hover{opacity:1}
.nombrebox{padding:0 14px 12px;display:flex;gap:6px;flex-wrap:wrap}
.nombrebox.hidden{display:none}
.nombrebox .ninput{flex:1;min-width:160px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px}
.nombrebox .nguardar{padding:9px 14px;background:var(--navy);color:#fff;border:0;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.nombrebox .ncancelar{padding:9px 14px;background:#fff;color:var(--mut);border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.wabox{padding:0 14px 12px}
.wabox textarea{width:100%;min-height:84px;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px}
.wabox .go{margin-top:8px;width:100%;padding:11px;background:#25d366;color:#fff;border:0;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.vermas{width:100%;padding:12px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);font-size:13.5px;font-weight:700;color:var(--navy);cursor:pointer;margin-top:4px}
.vermas:hover{border-color:rgba(201,168,76,.6)}
#pbarra{padding:12px 12px 0;max-width:760px;margin:0 auto}
#pbarra .filtros{margin-bottom:8px}
.psort{display:flex;gap:8px;flex-wrap:wrap}
.psort select{flex:0 0 auto;border:1px solid var(--border);border-radius:10px;padding:9px 10px;font-size:13.5px;background:#fff}
.psort input{flex:1;min-width:160px;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px}
body[data-tab="props"] main{max-width:1280px}
.psecs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:640px){.psecs{grid-template-columns:1fr}}
.psec{margin-bottom:0}
.psec-h{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--navy);padding:6px 2px;border-bottom:2px solid var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.psec-h span{background:var(--navy);color:#fff;border-radius:999px;padding:1px 9px;font-size:11.5px}
.ptabla{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.06);border:1px solid rgba(226,232,240,.7);overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #eef0f4;text-decoration:none;color:var(--txt)}
.prow:last-child{border-bottom:0}
.prow:hover{background:#f8f9fc}
.prow img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#e8ecf2;flex-shrink:0}
.pr-main{flex:1;min-width:0}
.pr-t{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-m{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-tipo{font-size:10px;color:var(--mut);width:54px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-specs{font-size:10px;color:var(--mut);width:74px;flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-precio{font-size:13.5px;font-weight:800;color:var(--navy);width:92px;flex-shrink:0;text-align:right}
.pr-precio small{font-weight:600;color:var(--mut);font-size:10.5px}
@media(max-width:560px){.pr-tipo,.pr-specs{display:none}.pr-precio{width:auto}}
.vacio{text-align:center;color:var(--mut);padding:56px 20px;font-size:14.5px;background:var(--card);border-radius:var(--radius);border:1px dashed var(--border)}
.vacio .vi{font-size:34px;display:block;margin-bottom:10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:.3s;pointer-events:none;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#syncBanner{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--warn);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
#toast.show{opacity:1}
</style></head><body>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const cfg = await (await fetch('https://gjyzdwsfdmdfhcspvxbz.supabase.co/functions/v1/niva-config')).json();
const sb = createClient(cfg.url, cfg.anon);
const $ = (s)=>document.querySelector(s);
let LEADS=[], PROPS=[], ASESORES=[], DUENOS={}, TAB='clientes', FIL='todos', Q='', ESADMIN=false, USUARIO='';
let SUBSA='leads'; // dentro de "Sin asignar": leads | props
let SHOWN=60; // paginación incremental
const tipoLead=(l)=>l.contact_type||'unidentified';
const esArchivado=(l)=>!!l.archived_at;
let PT='todas', PO='todo', PS='pmin', PQ='', PE='activas', PROPSC=[];
let VISTA='tablero'; // tablero | lista
const EST={new:'NUEVO',contacted:'ACTIVO',attended:'TIBIO',cancelled:'CANCELADO'};
const ESRC={easybroker:'EasyBroker',inmuebles24_email:'Inmuebles24',manual_admin:'Manual',manual_asesor:'Captura directa'};
const fmt=(n)=>n==null?'':'$'+Number(n).toLocaleString('es-MX');
const ftel=(t)=>t?t.replace('+52',''):'';
// P0: escape de HTML para todo dato dinámico (anti-XSS)
const esc=(v)=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const m2ok=(n)=>n && Number(n)>=20; // saneo: superficies absurdas no se muestran
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

// ===== Modo sin conexión: caché local + cola de cambios pendientes =====
const CACHE_KEY='niva_cache_v1', QUEUE_KEY='niva_queue_v1';
function guardarCache(){
  try{localStorage.setItem(CACHE_KEY, JSON.stringify({LEADS,PROPS,ts:Date.now()}));}catch(e){}
}
function cargarCache(){
  try{
    const raw=localStorage.getItem(CACHE_KEY);
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(e){return null}
}
function leerCola(){
  try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]');}catch(e){return []}
}
function guardarCola(q){
  try{localStorage.setItem(QUEUE_KEY, JSON.stringify(q));}catch(e){}
  actualizarBadgeSync();
}
function encolar(op){
  const q=leerCola();
  q.push(Object.assign({id:Date.now()+'_'+Math.random().toString(36).slice(2)},op));
  guardarCola(q);
}
function actualizarBadgeSync(){
  const n=leerCola().length;
  const b=$('#syncBanner');
  if(!b)return;
  if(!navigator.onLine){
    b.textContent='📡 Sin conexión'+(n?' — '+n+' cambio'+(n>1?'s':'')+' pendiente'+(n>1?'s':'')+' de sincronizar':' — viendo datos guardados');
    b.classList.remove('hidden');
  }else if(n>0){
    b.textContent='🔄 Sincronizando '+n+' cambio'+(n>1?'s':'')+' pendiente'+(n>1?'s':'')+'...';
    b.classList.remove('hidden');
  }else{
    b.classList.add('hidden');
  }
}
async function sincronizar(){
  if(!navigator.onLine)return;
  let q=leerCola();
  if(!q.length)return;
  const restantes=[];
  for(const op of q){
    try{
      if(op.tipo==='status_change'){
        const {error}=await sb.from('leads').update({status:op.nuevo}).eq('id',op.leadId);
        if(error)throw error;
        sb.from('lead_interactions').insert({lead_id:op.leadId,type:'status_change',actor:'advisor',payload:{de:op.prev,a:op.nuevo}});
      }
    }catch(e){
      restantes.push(op); // se reintenta después
    }
  }
  guardarCola(restantes);
  if(restantes.length<q.length)toast('Cambios sincronizados ✓');
  actualizarBadgeSync();
}
window.addEventListener('online',()=>{actualizarBadgeSync();sincronizar();});
window.addEventListener('offline',actualizarBadgeSync);
setInterval(()=>{if(navigator.onLine)sincronizar();},30000);

async function entrar(){
  const u=$('#lu').value.trim().toLowerCase(), p=$('#lp').value;
  if(!u||!p){$('#lerr').textContent='Escribe usuario y contraseña';return}
  $('#lerr').textContent='';$('#lbtn').textContent='Entrando...';
  const email=u.includes('@')?u:(u+'@niva.internal');
  const {error}=await sb.auth.signInWithPassword({email,password:p});
  $('#lbtn').textContent='Entrar';
  if(error){$('#lerr').textContent='Usuario o contraseña incorrectos';return}
  iniciar();
}
$('#lbtn').onclick=entrar;
$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});
$('#hout').onclick=async()=>{await sb.auth.signOut();location.reload()};

async function iniciar(){
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  const {data:{user}}=await sb.auth.getUser();
  const uname=(user?.email??'').split('@')[0];
  $('#hname').textContent=uname;
  USUARIO=uname;
  ESADMIN=(uname==='admin'||uname==='ricardo');
  const tabSinId=$('#tab-sinid');
  if(tabSinId) tabSinId.style.display = ESADMIN ? '' : 'none';
  const tabSA=$('#tab-sinasig');
  if(tabSA) tabSA.style.display = ESADMIN ? '' : 'none';
  const tabRep=$('#tab-rep');
  if(tabRep) tabRep.style.display = ESADMIN ? '' : 'none';
  if(!ESADMIN && TAB==='sinid'){
    TAB='clientes';
    document.querySelectorAll('.snav .tab').forEach(b=>b.classList.toggle('on', b.dataset.t==='clientes'));
  }
  actualizarBadgeSync();
  sincronizar();
  await cargar();
}
function skeleton(){
  const host=$('#lista');
  host.innerHTML='';
  for(let i=0;i<4;i++){
    const d=document.createElement('div');d.className='skel';
    d.innerHTML='<div class="l" style="width:45%"></div><div class="l" style="width:70%"></div><div class="l" style="width:30%;margin-bottom:0"></div>';
    host.appendChild(d);
  }
}
function errorCarga(msg){
  $('#lista').innerHTML='<div class="errbox"><p>⚠️ No se pudieron cargar los datos'+(msg?': '+esc(msg):'')+'.</p><button id="btn-reintentar">🔄 Reintentar</button></div>';
  document.getElementById('btn-reintentar').onclick=()=>cargar();
}
async function cargar(){
  skeleton(); // P0: estado de carga visible
  if(!navigator.onLine){
    const c=cargarCache();
    if(c){
      LEADS=c.LEADS||[];PROPS=c.PROPS||[];
      cargarContadores();pintar();actualizarBadgeSync();
      toast('Sin conexión — mostrando datos guardados');
      return;
    }
  }
  try{
    const [l,p]=await Promise.all([
      sb.from('my_leads').select('*').order('happened_at',{ascending:false}),
      sb.from('my_properties').select('*')
    ]);
    // P0: detectar errores de Supabase en vez de pintar éxito vacío
    if(l.error) throw new Error(l.error.message||'leads');
    if(p.error) throw new Error(p.error.message||'propiedades');
    LEADS=l.data??[];PROPS=p.data??[];
    guardarCache();
    REP=null; // los reportes se recalculan con datos frescos
    if(ESADMIN){
      if(!ASESORES.length){
        const a=await sb.from('advisors').select('id,first_name,last_name,niva_code,status');
        if(!a.error)ASESORES=(a.data||[]).filter(x=>x.status!=='inactive')
          .map(x=>({id:x.id,n:(((x.first_name||'')+' '+(x.last_name||'')).trim())||x.niva_code||'Asesor'}))
          .sort((x,y)=>x.n.localeCompare(y.n));
      }
      const d=await sb.from('property_advisors').select('property_id,advisor_id');
      DUENOS={};
      if(!d.error)(d.data||[]).forEach(x=>{DUENOS[x.property_id]=x.advisor_id});
      const pc=await sb.from('my_properties_canceladas').select('*');
      PROPSC=pc.error?[]:(pc.data||[]);
    }
    cargarContadores();
    pintar();
    actualizarBadgeSync();
  }catch(e){
    console.error('[CRM] error de carga:',e);
    const c=cargarCache();
    if(c){
      LEADS=c.LEADS||[];PROPS=c.PROPS||[];
      cargarContadores();pintar();actualizarBadgeSync();
      toast('Sin conexión — mostrando datos guardados');
      return;
    }
    errorCarga(e.message);
  }
}
function tipoDe(p){
  const t=(p.property_type||'').toLowerCase();
  if(t.includes('depa')||t.includes('departamento'))return 'depa';
  if(t.includes('casa'))return 'casa';
  return 'otro';
}
function vacioHTML(txt,icon){return '<div class="vacio"><span class="vi">'+(icon||'📭')+'</span>'+txt+'</div>'}
function pintar(){
  document.body.dataset.tab=TAB;
  const enTablero=(VISTA==='tablero'&&FIL==='todos'&&['clientes','asesores','sinid','todos','archivados'].indexOf(TAB)>=0);
  document.body.dataset.vista=enTablero?'tablero':'lista';
  $('#barra').style.display=(TAB==='props'||TAB==='reportes'||TAB==='sinasignar')?'none':'';
  $('#pbarra').classList.toggle('hidden',TAB!=='props');
  const host=$('#lista');host.innerHTML='';
  if(TAB==='reportes'){renderReportes(host);return;}
  if(TAB==='sinasignar'){renderSinAsignar(host);return;}
  if(TAB==='props'){
    const canc=(PE==='canceladas');
    const base=canc?PROPSC:PROPS;
    if(!base.length){host.innerHTML=vacioHTML(canc?'No has cancelado ninguna propiedad.':'No tienes propiedades activas asignadas.',canc?'🚫':'🏠');return}
    let ps=base.slice();
    if(PT!=='todas')ps=ps.filter(p=>tipoDe(p)===PT);
    if(PO!=='todo')ps=ps.filter(p=>p.operation_type===PO);
    if(PQ){const q=PQ.toLowerCase();ps=ps.filter(p=>[p.title,p.eb_public_id,p.location_name,p.property_type].join(' ').toLowerCase().includes(q))}
    const tt=(p)=>(p.title||p.eb_public_id||'').toLowerCase();
    if(PS==='az')ps.sort((a,b)=>tt(a).localeCompare(tt(b)));
    else if(PS==='za')ps.sort((a,b)=>tt(b).localeCompare(tt(a)));
    else if(PS==='pmin')ps.sort((a,b)=>(a.price_amount??Infinity)-(b.price_amount??Infinity));
    else if(PS==='pmax')ps.sort((a,b)=>(b.price_amount??-1)-(a.price_amount??-1));
    if(!ps.length){host.innerHTML=vacioHTML('Sin propiedades con esos filtros.','🔍');return}
    const secciones=[['rental','RENTA'],['sale','VENTA']];
    const wrapper=document.createElement('div');wrapper.className='psecs';
    for(const [op,titulo] of secciones){
      const grupo=ps.filter(p=>p.operation_type===op);
      if(!grupo.length)continue;
      const sec=document.createElement('div');sec.className='psec';
      sec.innerHTML='<div class="psec-h">'+titulo+' <span>'+grupo.length+'</span></div>';
      const tabla=document.createElement('div');tabla.className='ptabla';
      for(const p of grupo){
        const fila=document.createElement('a');fila.className='prow';
        if(p.public_url){fila.href=p.public_url;fila.target='_blank';fila.rel='noopener'}
        const specs=[p.bedrooms?p.bedrooms+'r':null,p.bathrooms?p.bathrooms+'b':null,m2ok(p.construction_size)?p.construction_size+'m²':null].filter(Boolean).join(' · ');
        fila.innerHTML='<img loading="lazy" src="'+esc(p.title_image_url||'')+'" onerror="this.style.visibility=\'hidden\'">'
          +'<div class="pr-main"><div class="pr-t">'+esc(p.title||p.eb_public_id)+'</div>'
          +'<div class="pr-m">'+esc(p.eb_public_id)+(p.location_name?' · '+esc(p.location_name):'')+'</div></div>'
          +'<div class="pr-tipo">'+esc(p.property_type||'')+'</div>'
          +'<div class="pr-specs">'+specs+'</div>'
          +'<div class="pr-precio">'+fmt(p.price_amount)+(op==='rental'?'<small>/mes</small>':'')+'</div>'
          +(ESADMIN?'<button class="pr-cancel'+(canc?' rea':'')+'">'+(canc?'↩️ Reactivar':'🚫 Cancelar')+'</button>':'');
        if(canc)fila.classList.add('cancelada');
        const bc=fila.querySelector('.pr-cancel');
        if(bc)bc.onclick=async(e)=>{
          e.preventDefault();e.stopPropagation();
          if(canc){
            if(!confirm('¿Reactivar "'+(p.title||p.eb_public_id)+'"?\n\nVuelve a la lista de propiedades activas.'))return;
            bc.disabled=true;bc.textContent='...';
            const r=await sb.rpc('reactivar_propiedad',{p_property_id:p.id});
            if(r.error){bc.disabled=false;bc.textContent='↩️ Reactivar';toast(r.error.message||'No se pudo');return}
            toast('Propiedad reactivada');
          } else {
            if(!confirm('¿Cancelar "'+(p.title||p.eb_public_id)+'"?\n\nSale de la lista de propiedades activas y de los reportes.\nSus leads se conservan. Puedes reactivarla cuando quieras.\n\nOjo: esto NO la despublica de EasyBroker ni de Inmuebles24.'))return;
            const mot=prompt('¿Por qué la cancelas? (opcional)\nEj: se vendió, se rentó, el dueño la retiró, terminó exclusiva','');
            if(mot===null)return;
            bc.disabled=true;bc.textContent='...';
            const r=await sb.rpc('cancelar_propiedad',{p_property_id:p.id,p_motivo:mot||null});
            if(r.error){bc.disabled=false;bc.textContent='🚫 Cancelar';toast(r.error.message||'No se pudo');return}
            toast('Propiedad cancelada');
          }
          await cargar();
        };
        tabla.appendChild(fila);
      }
      sec.appendChild(tabla);wrapper.appendChild(sec);
    }
    host.appendChild(wrapper);
    return;
  }
  let arr=LEADS.slice();
  if(TAB==='archivados')arr=arr.filter(esArchivado);
  else arr=arr.filter(l=>!esArchivado(l));
  if(TAB==='clientes')arr=arr.filter(l=>tipoLead(l)==='client');
  else if(TAB==='asesores')arr=arr.filter(l=>tipoLead(l)==='agent');
  else if(TAB==='sinid')arr=arr.filter(l=>tipoLead(l)==='unidentified');
  if(FIL!=='todos')arr=arr.filter(x=>x.status===FIL);
  if(Q){const q=Q.toLowerCase();arr=arr.filter(x=>[x.full_name,x.phone_normalized,x.property_title,x.eb_public_id,ESRC[x.source]].join(' ').toLowerCase().includes(q))}
  const vacios={clientes:'Sin clientes por ahora.',asesores:'Sin leads de asesores.',sinid:'Nada pendiente de identificar. ✅',todos:'Sin resultados.',archivados:'No has archivado ningún lead todavía.'};
  arr.sort((a,b)=>fechaLead(b)-fechaLead(a)); // más reciente arriba, siempre
  if(!arr.length){host.innerHTML=vacioHTML(vacios[TAB]||'Sin resultados.',TAB==='sinid'?'✅':TAB==='archivados'?'🗄️':'📭');return}
  if(VISTA==='tablero'&&FIL==='todos'){renderTablero(host,arr);return}
  const nuevos=arr.filter(l=>l.status==='new'), resto=arr.filter(l=>l.status!=='new');
  const ordenado=(FIL==='todos')?[...nuevos,...resto]:[...nuevos,...resto];
  const total=ordenado.length;
  const visibles=ordenado.slice(0,SHOWN);
  let nCount=0;
  if(FIL==='todos'&&nuevos.length&&resto.length){
    const h1=document.createElement('div');h1.className='lsec';h1.innerHTML='🔵 NUEVOS <span>'+nuevos.length+'</span>';host.appendChild(h1);
    let restoHeader=false;
    for(const l of visibles){
      if(l.status!=='new'&&!restoHeader){
        const h2=document.createElement('div');h2.className='lsec gris';h2.innerHTML='ANTERIORES <span>'+resto.length+'</span>';host.appendChild(h2);
        restoHeader=true;
      }
      host.appendChild(cardLead(l));
    }
  } else {
    for(const l of visibles)host.appendChild(cardLead(l));
  }
  if(total>SHOWN){

    }

  const belim=d.querySelector('.elimg');
  if(belim)belim.onclick=async()=>{
    if(!confirm('¿Eliminar definitivamente '+(leads.length>1?'estos '+leads.length+' leads':'este lead')+'?\n\nSe borran junto con su historial. No se puede deshacer.\n\nSi solo quieres organizarlos, mejor asígnalos a un asesor.'))return;
    const motivo=prompt('¿Por qué los eliminas? (opcional — queda en la bitácora)','');
    if(motivo===null)return;
    belim.disabled=true;belim.textContent='Eliminando...';
    let err=null;
    for(const l of leads){
      const r=await sb.rpc('eliminar_lead',{p_lead_id:l.id,p_motivo:motivo||null});
      if(r.error){err=r.error;break}
    }
    if(err){belim.disabled=false;belim.textContent='🗑️ Eliminar';toast(err.message||'No se pudo eliminar');return}
    toast(leads.length>1?'Leads eliminados':'Lead eliminado');
    await cargar();
  };
  return d;
}

function renderSinAsignar(host){
  const nLeads=LEADS.filter(l=>!l.advisor_id&&!esArchivado(l)).length;
  const nProps=PROPS.filter(p=>!DUENOS[p.id]).length;
  const bar=document.createElement('div');
  bar.className='filtros';bar.style.marginBottom='14px';
  bar.innerHTML='<button class="f'+(SUBSA==='leads'?' on':'')+'" data-s="leads">📋 Leads sin asesor ('+nLeads+')</button>'
               +'<button class="f'+(SUBSA==='props'?' on':'')+'" data-s="props">🏠 Propiedades sin dueño ('+nProps+')</button>';

  if(SUBSA==='props'){renderPropsSinDueno(host);return}
  const arr=LEADS.filter(l=>!l.advisor_id&&!esArchivado(l));
  if(!arr.length){host.insertAdjacentHTML('beforeend',vacioHTML('Todos los leads tienen asesor asignado. ✅','🎯'));return}
  const conProp={}, sinProp=[];
  arr.forEach(l=>{

      (conProp[k]=conProp[k]||[]).push(l);

  const grupos=Object.keys(conProp).map(k=>({k,leads:conProp[k]})).sort((a,b)=>b.leads.length-a.leads.length);
  const totalProp=grupos.reduce((s,g)=>s+g.leads.length,0);
  host.insertAdjacentHTML('beforeend','<div class="sahead">🏠 Por propiedad — '+grupos.length+' propiedades, '+totalProp+' leads</div>');

    host.insertAdjacentHTML('beforeend','<div class="repnote" style="margin:-4px 0 12px">Asigna una vez por propiedad: el sistema registra al dueño y arrastra todos sus leads, incluidos los que lleguen después.</div>');
    grupos.forEach(g=>{
      const l0=g.leads[0];
      host.appendChild(grupoSinAsignar(g.k,
        esc(l0.property_title||g.k),

        g.leads,true));
    });
  }
  if(sinProp.length){
    host.insertAdjacentHTML('beforeend','<div class="sahead">❓ Sin propiedad identificada — '+sinProp.length+' leads</div>');
    host.insertAdjacentHTML('beforeend','<div class="repnote" style="margin:-4px 0 12px">Estos llegaron con mensaje genérico y no se pueden agrupar. Van uno por uno.</div>');
    sinProp.forEach(l=>{
      host.appendChild(grupoSinAsignar(l.id,
        esc((l.full_name&&l.full_name.trim().length>2)?l.full_name:'Sin nombre'),
        [ESRC[l.source],l.phone_normalized?ftel(l.phone_normalized):null,
         l.happened_at?new Date(l.happened_at).toLocaleDateString('es-MX',{day:'2-digit',month:'short'}):null
        ].filter(Boolean).map(esc).join(' · '),
        [l],false));
    });
  }
}

async function moverEtapa(id,nuevo){
  const l=LEADS.find(x=>x.id===id);
  if(!l||l.status===nuevo)return;
  const prev=l.status;l.status=nuevo;pintar();cargarContadores();guardarCache();
  if(!navigator.onLine){
    encolar({tipo:'status_change',leadId:id,prev,nuevo});
    toast('Movido a '+EST[nuevo]+' (sin conexión, se sincronizará)');
    return;
  }
  const {error}=await sb.from('leads').update({status:nuevo}).eq('id',id);
  if(error){
    // pudo ser un corte de red en el momento del envío: no revertimos, lo encolamos
    encolar({tipo:'status_change',leadId:id,prev,nuevo});
    toast('Movido a '+EST[nuevo]+' (pendiente de sincronizar)');
    return;
  }
  sb.from('lead_interactions').insert({lead_id:id,type:'status_change',actor:'advisor',payload:{de:prev,a:nuevo}});
  toast('Movido a '+EST[nuevo]);
}
function renderTablero(host,arr){
  const kb=document.createElement('div');kb.className='kb';
  for(const [st,titulo] of COLS){
    const items=arr.filter(l=>l.status===st).sort((a,b)=>fechaLead(b)-fechaLead(a));
    if(st==='new'&&!items.length)continue; // sin nuevos: no mostrar esa columna, que Activos quede primero
    const col=document.createElement('div');col.className='kbcol';col.dataset.st=st;
    col.innerHTML='<div class="kbh"><span>'+titulo+'</span><span class="kbn">'+items.length+'</span></div>';
    if(!items.length)col.insertAdjacentHTML('beforeend','<div class="kbvacia">Vacío</div>');
    items.forEach(l=>col.appendChild(kbCard(l)));
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('sobre')});
    col.addEventListener('dragleave',()=>col.classList.remove('sobre'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('sobre');
      const id=e.dataTransfer.getData('text/plain');if(id)moverEtapa(id,st);});
    kb.appendChild(col);
  }
  host.appendChild(kb);
}

// Qué escribió el cliente, limpiando el envoltorio del portal
function textoCliente(l){
  let t=(l.first_message||'').trim();
  if(!t)return '';
  if(/^Lead Inmuebles24/i.test(t))return '';           // resumen del portal, no es del cliente
  if(/^Cliente capturado directamente/i.test(t))return '';
  t=t.replace(/^Enviado por WhatsApp:\s*/i,'').replace(/^Pregunta:\s*/i,'');
  return t.trim();
}
const CANAL={
  whatsapp:{i:'📱',t:'Pidió tu WhatsApp desde el aviso'},
  telefono:{i:'📞',t:'Vio tu teléfono en el aviso'},
  mensaje:{i:'💬',t:'Escribió un mensaje'},
  directo:{i:'🤝',t:'Capturado directamente por el asesor'}
};

  const msg=textoCliente(l);

  if(msg)filas+='<div class="ilinea"><span>Su mensaje</span><b class="msgreal"></b></div>';

let REP=null;
async function cargarDatosRep(){
  if(REP)return REP;
  const [l,c,p,a,i,pc,pv]=await Promise.all([
    sb.from('leads').select('*'),
    sb.from('contacts').select('*'),
    sb.from('properties').select('id,eb_public_id,title,property_type,operation_type,price_amount,location_name,eb_status,bedrooms,bathrooms,construction_size,eb_created_at'),

    sb.from('portal_costos').select('*'),
    sb.from('portal_volumen').select('*')
  ]);
  for(const r of [l,c,p,a,i]) if(r.error) throw new Error(r.error.message);
  const cMap={},pMap={},aMap={};
  (c.data||[]).forEach(x=>cMap[x.id]=x);

function descargarCSV(nombre,cols,filas){
  const escv=(v)=>{v=(v==null)?'':String(v).replace(/\r?\n/g,' ');return /[",]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const txt='﻿'+cols.join(',')+'\n'+filas.map(f=>f.map(escv).join(',')).join('\n');
  const b=new Blob([txt],{type:'text/csv;charset=utf-8'});
  const el=document.createElement('a');el.href=URL.createObjectURL(b);
  el.download='NIVA_'+nombre+'_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(el);el.click();el.remove();
  toast('Descargado: '+el.download);
}

      const ids=new Set(props.map(p=>p.id));
      const leads=act.filter(l=>ids.has(l.property_id)).length;
      return {nom,np:props.length,leads};
    });
    const mx=Math.max(1,...filas.map(f=>f.leads));
    return tablaHTML('💰 Demanda por rango de precio · '+etiqueta,
      ['Rango','#Propiedades','#Leads','#Leads por propiedad','Demanda'],
      filas.map(f=>[f.nom,f.np||'—',f.leads,f.np?(f.leads/f.np).toFixed(1):'—',
        '<div class="repbar" style="width:'+Math.max(3,Math.round(f.leads*100/mx))+'%"></div>']),null);
  }
  return tablaHTML('📍 Zonas con más demanda (top 15)',['Zona','#En inventario','#Leads','#Leads x propiedad','Demanda'],fz,
    'La columna clave es <b>Leads por propiedad</b>: una zona con 1 propiedad y 8 leads pide más inventario ahí; una con 6 propiedades y 1 lead te está costando dinero.')
    +tablaRango('rental',RANGOS_R,'RENTA')
    +tablaRango('sale',RANGOS_V,'VENTA');
}
function repDiaHora(){
  const act=REP.L.filter(x=>!x.archived_at);
  const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const pd=[0,0,0,0,0,0,0];
  act.forEach(l=>{const f=l.happened_at||l.created_at;if(f)pd[new Date(f).getDay()]++});
  const mxd=Math.max(1,...pd);
  const orden=[1,2,3,4,5,6,0];
  const fd=orden.map(i=>[DIAS[i],pd[i],pct(pd[i],act.length),
    '<div class="repbar" style="width:'+Math.max(3,Math.round(pd[i]*100/mxd))+'%"></div>']);
  // horas: solo las reales (la importación dejó 12:00 ficticio)
  const reales=act.filter(l=>{const f=l.happened_at;if(!f)return false;
    const d=new Date(f);return !(d.getHours()===12&&d.getMinutes()===0&&d.getSeconds()===0)});
  const BLOQ=[[6,9,'Madrugada y temprano (6–9h)'],[9,12,'Mañana (9–12h)'],[12,15,'Mediodía (12–15h)'],
              [15,18,'Tarde (15–18h)'],[18,21,'Noche (18–21h)'],[21,30,'Noche tarde (21–6h)']];
  const fh=BLOQ.map(([a,b,nom])=>{
    const n=reales.filter(l=>{const h=new Date(l.happened_at).getHours();return b>24?(h>=a||h<6):(h>=a&&h<b)}).length;
    return [nom,n,pct(n,reales.length)];
  });
  return tablaHTML('📆 Leads por día de la semana',['Día','#Leads','#% del total','Volumen'],fd,
    'La fecha sí es real en los '+act.length+' leads. Si el fin de semana pesa, ahí necesitas guardia.')
    +tablaHTML('🕐 Leads por hora del día ('+reales.length+' con hora real)',['Franja','#Leads','#%'],fh,
      reales.length<30
        ? '⚠️ Todavía hay pocos datos: '+ (act.length-reales.length) +' leads entraron por importación masiva y traen hora ficticia (12:00), así que los excluí. Este reporte se vuelve confiable conforme entren leads nuevos en vivo.'
        : 'Las franjas con más entrada son donde no puedes dejar el WhatsApp sin contestar.');
}

function repCosto(){
  const PORTAL={easybroker:'EasyBroker',inmuebles24:'Inmuebles24'};
  const SRC={easybroker:'easybroker',inmuebles24:'inmuebles24_email'};
  if(!REP.COST.length)return tablaHTML('💸 Costo por lead',['Aviso'],[['Todavía no hay costos de portal cargados.']],null);
  const meses=[...new Set(REP.VOL.map(v=>v.mes))].sort().reverse().slice(0,4);
  // mezcla cliente/colega segun lo que SI esta clasificado en el CRM
  const mezcla={};
  Object.keys(SRC).forEach(k=>{
    const ls=REP.L.filter(l=>l.source===SRC[k]);
    const cli=ls.filter(l=>((REP.cMap[l.contact_id]||{}).contact_type)==='client').length;
    mezcla[k]={n:ls.length,cli,pctCli:ls.length?cli/ls.length:0};
  });
  const filas=[];
  REP.COST.forEach(c=>{
    const vols=REP.VOL.filter(v=>v.portal===c.portal&&meses.indexOf(v.mes)>=0);
    const prom=vols.length?Math.round(vols.reduce((s,v)=>s+v.consultas,0)/vols.length):0;
    const m=mezcla[c.portal]||{pctCli:0,n:0};
    const clientes=Math.round(prom*m.pctCli);
    filas.push([
      '<strong>'+(PORTAL[c.portal]||esc(c.portal))+'</strong><br><small style="color:#8a94a6">'+esc(c.nota||'')+'</small>',
      fmt(c.monto_mensual)+'/mes',
      prom||'—',
      prom?'<strong>'+fmt(Math.round(c.monto_mensual/prom))+'</strong>':'—',
      m.n?Math.round(m.pctCli*100)+'%':'—',
      clientes||'—',
      clientes?'<strong>'+fmt(Math.round(c.monto_mensual/clientes))+'</strong>':'—'
    ]);
  });
  const totalMes=REP.COST.reduce((s,c)=>s+Number(c.monto_mensual),0);
  // detalle mes a mes
  const det=meses.map(mes=>{
    const f=[mes];
    REP.COST.forEach(c=>{
      const v=REP.VOL.find(x=>x.portal===c.portal&&x.mes===mes);
      f.push(v?v.consultas+' · '+fmt(Math.round(c.monto_mensual/v.consultas)):'—');
    });
    return f;
  });
  return tablaHTML('💸 Costo por lead por portal',
    ['Portal','#Inversión','#Consultas/mes','#Costo x consulta','#% clientes','#Clientes/mes','#Costo x cliente'],filas,
    'Inviertes <b>'+fmt(totalMes)+' al mes</b> en portales. La columna que manda es <b>Costo por cliente</b>: las consultas de colegas no te traen comprador, te traen comisión compartida.')
   +tablaHTML('📆 Consultas y costo, mes a mes',['Mes'].concat(REP.COST.map(c=>'#'+(PORTAL[c.portal]||c.portal))),det,
    'Si las consultas de un portal bajan mes con mes y el pago es fijo, tu costo por lead sube solo. Ahí es cuando conviene renegociar o mover la inversión.');
}

    +'</div></div><div id="repout"></div></div>';

  const reps={ 'rep-resumen':repResumen,'rep-embudo':repEmbudo,'rep-asesor':repAsesor,'rep-prop':repProp,'rep-zonas':repZonas,'rep-diahora':repDiaHora,'rep-costo':repCosto,'rep-mes':repMes,'rep-frias':repFrias };
  Object.entries(reps).forEach(([id,fn])=>{const el=document.getElementById(id);if(el)el.onclick=()=>{

    el.classList.add('on');
    document.getElementById('repout').innerHTML=fn();
  };});
  const primero=document.getElementById('rep-resumen');
  if(primero){primero.classList.add('on');document.getElementById('repout').innerHTML=repResumen();}
}

function abrirNuevoCliente(){
  const sel=$('#nc-prop');
  const ps=PROPS.slice().sort((a,b)=>String(a.title||'').localeCompare(String(b.title||'')));
  sel.innerHTML='<option value="">— Sin propiedad todavía —</option>'
    +ps.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.title||p.eb_public_id||'')+'</option>').join('');
  $('#nc-nombre').value='';$('#nc-tel').value='';sel.value='';
  $('#nc-err').textContent='';
  $('#modalNuevo').classList.remove('hidden');
  setTimeout(()=>$('#nc-nombre').focus(),50);
}
function cerrarNuevoCliente(){$('#modalNuevo').classList.add('hidden')}
async function guardarNuevoCliente(){
  const nombre=$('#nc-nombre').value.trim();
  const tel=$('#nc-tel').value.replace(/\D/g,'');
  const prop=$('#nc-prop').value||null;
  const err=$('#nc-err'), btn=$('#nc-save');
  if(nombre.length<3){err.textContent='Escribe el nombre completo del cliente.';return}
  if(tel.length<10){err.textContent='El teléfono debe tener 10 dígitos.';return}
  err.textContent='';btn.disabled=true;btn.textContent='Guardando...';
  const {error}=await sb.rpc('crear_lead_manual',{p_nombre:nombre,p_telefono:tel,p_property_id:prop});
  btn.disabled=false;btn.textContent='Guardar cliente';
  if(error){err.textContent=error.message||'No se pudo guardar el cliente.';return}
  cerrarNuevoCliente();
  toast('Cliente agregado ✅');
  await cargar();
}
$('#btn-nuevo').onclick=abrirNuevoCliente;
$('#nc-cancel').onclick=cerrarNuevoCliente;
$('#nc-save').onclick=guardarNuevoCliente;
$('#modalNuevo').addEventListener('click',e=>{if(e.target.id==='modalNuevo')cerrarNuevoCliente()});
$('#nc-tel').addEventListener('keydown',e=>{if(e.key==='Enter')guardarNuevoCliente()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modalNuevo').classList.contains('hidden'))cerrarNuevoCliente()});
