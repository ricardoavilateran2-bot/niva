<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
(async()=>{
  try{
    const cfg = await (await fetch('https://gjyzdwsfdmdfhcspvxbz.supabase.co/functions/v1/niva-config')).json();
    const sb = createClient(cfg.url, cfg.anon);
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.replace('./index.html'); return; }
    window.__nivaSession = session;
    window.__nivaSb = sb;
    sb.auth.onAuthStateChange((_e, s)=>{ if(!s) window.location.replace('./index.html'); });
  }catch(e){ console.error('niva-auth-guard', e); window.location.replace('./index.html'); }
})();

/* ── Páginas de impresión NIVA (construidas por JS justo antes de imprimir) ──
   Cada .niva-print-page ES una hoja Carta completa: encabezado NIVA arriba,
   contenido, y pie NIVA anclado al fondo + número de página. Se construyen dentro
   de #niva-print-measure (fuera de pantalla) para poder medir su contenido con
   las mismas métricas con las que se imprimirá. */
#niva-print-measure{position:absolute;left:-12000px;top:0}
/* Hoja Carta con TRES zonas reales e independientes:
   HEADER · (espacio de seguridad) · CONTENT · (espacio de seguridad) · FOOTER
   El contenido vive en .npp-content, que es flex:1 con overflow:hidden — es
   físicamente imposible que invada la zona del encabezado o la del pie. */
.niva-print-page{width:215.9mm;height:278mm;box-sizing:border-box;padding:11mm 16mm 9mm;display:flex;flex-direction:column;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:10.5pt;line-height:1.6;overflow:hidden}
/* ZONA 1 — ENCABEZADO: altura FIJA (21.6mm = proporción real del membrete).
   Es fija a propósito: así el hueco disponible para el contenido se conoce desde
   el primer instante y NO depende de que la imagen ya haya terminado de cargar
   (si dependiera, el paginador mediría de más y el texto se recortaría). */
.niva-print-page .npp-header{flex:0 0 21.6mm;height:21.6mm}
.niva-print-page .npp-header img{width:100%;height:100%;display:block;object-fit:contain;object-position:left top}
/* Espacio de seguridad superior: el contenido nunca se pega al encabezado */
.niva-print-page .npp-gap-top{flex:0 0 auto;height:9mm}
/* ZONA 2 — CONTENIDO: ocupa sólo el hueco libre entre las dos zonas fijas */
.niva-print-page .npp-content{flex:1 1 auto;min-height:0;overflow:hidden;padding:0 2mm}
.niva-print-page .npp-content > *:first-child{margin-top:0}
.niva-print-page .npp-content .doc-p,.niva-print-page .npp-content .doc-clause,.niva-print-page .npp-content .doc-bullet{font-size:10.5pt}
/* Espacio de seguridad inferior: el contenido nunca llega hasta el pie */
.niva-print-page .npp-gap-bottom{flex:0 0 auto;height:9mm}
/* ZONA 3 — PIE: altura FIJA y anclado al fondo, en todas las hojas (mismo
   motivo que el encabezado: el espacio queda reservado desde el principio). */
.niva-print-page .npp-footer{flex:0 0 21.6mm;height:21.6mm;margin-top:auto}
.niva-print-page .npp-footer img{width:100%;height:100%;display:block;object-fit:contain;object-position:left bottom}
/* Número de página: altura FIJA. Su texto ("Página X de Y") sólo se conoce al
   terminar de paginar; si su alto fuera automático, crecería DESPUÉS de medir y
   le robaría espacio al contenido (era otra causa de texto recortado). */
.niva-print-page .npp-pagenum{flex:0 0 6mm;height:6mm;line-height:6mm;text-align:right;font-size:8pt;color:#666}
/* El folio es interno: nunca se imprime ni aparece en el PDF */
.niva-print-page #niva-folio-line,.niva-print-page .niva-folio-line{display:none!important}


/* ============================================================
   PRINT — impresión profesional multipágina (módulo Documentos)
   ============================================================ */
@media print{
  /* Tamaño de hoja Carta y márgenes de página. El encabezado/pie ya NO dependen de
     este margen para tener espacio propio (ver tabla .niva-print-table abajo), así
     que aquí solo se define el margen "de cortesía" de la hoja física. */
  /* Margen de hoja 0: el título/fecha/URL que agrega el navegador viven en ese
     margen — sin margen, desaparecen (Chrome y Safari). Los márgenes visuales del
     documento los aporta cada .niva-print-page con su propio padding. */
  @page{ size: letter; margin: 0; }

  html,body{background:#fff}

  /* --- Ocultar TODO lo que es interfaz de la app, nunca el documento --- */
  .top-bar,.doc-tabs,.form-col,.preview-actions,
  #nivaOsFloat,#nivaDocsToolbar,#niva-docs-recientes{
    display:none!important;
  }

  /* La vista por hojas es sólo de pantalla: al imprimir se usan las hojas que
     construye el paginador en #niva-print-measure, nunca esta copia visual. */
  #docPages{ display:none!important; }

  /* --- FOLIO: dato interno de control, NUNCA se imprime ---
     El folio se sigue generando y guardando en el registro interno (nivaFolioActual
     y el historial de documentos); solo se suprime su representación visual. */
  #niva-folio-line,.niva-folio-line,#niva-folio-badge{ display:none!important; }

  .split{display:block}
  .preview-col{background:#fff;padding:0;min-height:auto}
  #docPreview{
    box-shadow:none;
    width:100%;
    font-size:10.5pt;
    /* Tipografía profesional para el documento IMPRESO (la vista en pantalla, el PDF
       y el Word siguen igual que antes — esto solo aplica dentro de @media print). */
    font-family: Arial, Helvetica, sans-serif;
  }

  /* --- Encabezado y pie en TODAS las páginas impresas ---
     Justo antes de imprimir, el JS de paginacion (ver bloque "PAGINACION MANUAL
     DE IMPRESION" mas abajo) construye cada hoja Carta completa con encabezado
     NIVA arriba, contenido, y pie NIVA anclado al fondo, identico en Chrome y
     Safari. Terminada la impresion, todo vuelve a su estado original. */
  /* Modo paginado: cuando el JS ya construyó las hojas (body.niva-paginated),
     se imprime SOLO el contenedor de hojas — todo lo demás (app, vista previa,
     formularios) queda fuera. Cada hoja salta a su propia página física. */
  body.niva-paginated > *:not(#niva-print-measure){ display:none !important }
  body.niva-paginated #niva-print-measure{ position:static !important; left:auto !important; top:auto !important }
  .niva-print-page{ page-break-after: always; break-after: page; }
  .niva-print-page:last-child{ page-break-after: auto; break-after: auto; }
  #niva-print-measure, #niva-print-measure *{ -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* --- Continuidad y cortes de página --- */
  /* Nunca dividir: firmas, y cajas de información resaltada */
  .sig-block,.sig-row,.pm-section,.os-section{
    break-inside: avoid;
    page-break-inside: avoid;
  }
  /* Que un título/encabezado de sección nunca quede solo al final de una hoja */
  .doc-title,.doc-subtitle,.doc-sec-head,.doc-sec-num{
    break-after: avoid-page;
    page-break-after: avoid;
  }
  /* Párrafos y cláusulas: evitar líneas sueltas (huérfanas/viudas) al cortar,
     sin forzar que bloques largos salten completos de página (evita hojas casi vacías) */
  .doc-p,.doc-clause,.doc-bullet{
    orphans: 3;
    widows: 3;
  }
  /* Cláusulas cortas de contrato sí se mantienen completas (no se ven bien partidas) */
  .doc-clause{
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* Tablas REALES dentro del documento (p.ej. inventario de entrega-recepción): que no
     se corten sus filas de forma antiestética. No aplica a la tabla envolvente de
     impresión, cuya única fila SÍ debe poder continuar de una hoja a otra. */
  .doc-body table{ border-collapse: collapse; width:100%; }
  .doc-body table tr,.doc-body table td,.doc-body table th{
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* Conservar los colores de fondo de los recuadros informativos al imprimir */
  #docPreview,#docPreview *{
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}
</style>
</head>

// ===================== IMPRESIÓN: encabezado/pie que se repiten en cada hoja =====================
// El documento ya trae su propio encabezado (.lh-header, logo NIVA) y pie (.lh-footer, datos de
// contacto) — normalmente aparecen UNA sola vez, al inicio y al final de todo el documento.
// Para que se repitan en CADA hoja física al imprimir, justo antes de imprimir los movemos (sin
// clonarlos ni tocar su contenido) dentro de un <thead>/<tfoot> de una tabla envolvente: es el
// mecanismo nativo del navegador para encabezados/pies de tabla que se repiten al paginar, y evita
// depender de "position:fixed" (que en documentos largos puede tapar el inicio del contenido en
// algunos motores de impresión). Al terminar de imprimir, se restaura la estructura original tal
// cual estaba, así que la vista en pantalla, el PDF y el Word no se ven afectados en absoluto.
(function(){
  // ── PAGINACIÓN MANUAL DE IMPRESIÓN ──
  // Se construye cada hoja Carta completa (encabezado NIVA + contenido + pie anclado
  // al fondo + "Página X de Y") ANTES de imprimir. Así el resultado es idéntico en
  // Chrome y Safari: Safari no repite <thead>/<tfoot> al paginar y position:fixed
  // tiene fallas en el motor de impresión de Chrome — la paginación manual evita ambos.
  var HEADING_RE = /(^|\s)(doc-title|doc-subtitle|doc-sec-head|doc-sec-num|doc-date)(\s|$)/;

  function buildPrintPages(){
    if (document.body.classList.contains('niva-paginated')) return true;
    var dp = document.getElementById('docPreview');
    if (!dp) return false;
    var body = dp.querySelector('.doc-body');
    if (!body) return false; // sin documento: se imprime la vista normal (fallback)

    var hdrImgEl = dp.querySelector('.lh-header img');
    var ftrImgEl = dp.querySelector('.lh-footer img');
    var hdrSrc = hdrImgEl ? hdrImgEl.src : (typeof IMG1 !== 'undefined' ? IMG1 : '');
    var ftrSrc = ftrImgEl ? ftrImgEl.src : (typeof IMG2 !== 'undefined' ? IMG2 : '');

    var host = document.getElementById('niva-print-measure');
    if (!host){ host = document.createElement('div'); host.id = 'niva-print-measure'; document.body.appendChild(host); }
    host.innerHTML = '';

    // Bloques a paginar: SOLO los hijos directos del cuerpo del documento.
    // El folio (#niva-folio-line) se excluye a propósito: es un dato interno de
    // control y NO debe aparecer en el documento impreso ni en el PDF.
    var blocks = [];
    for (var i = 0; i < body.children.length; i++){
      var el = body.children[i];
      if (el.id === 'niva-folio-line') continue;      // folio: interno, no se imprime
      if (el.classList && el.classList.contains('niva-folio-line')) continue;
      blocks.push(el);
    }

    var pages = [];
    function newPage(){
      // Cada hoja se arma SIEMPRE con la misma estructura de 5 franjas:
      // encabezado · espacio · contenido · espacio · pie (+ número de página)
      var page = document.createElement('div'); page.className = 'niva-print-page';
      var h = document.createElement('div'); h.className = 'npp-header';
      if (hdrSrc){ var hi = document.createElement('img'); hi.src = hdrSrc; h.appendChild(hi); }
      var gt = document.createElement('div'); gt.className = 'npp-gap-top';
      var c = document.createElement('div'); c.className = 'npp-content';
      var gb = document.createElement('div'); gb.className = 'npp-gap-bottom';
      var f = document.createElement('div'); f.className = 'npp-footer';
      if (ftrSrc){ var fi = document.createElement('img'); fi.src = ftrSrc; f.appendChild(fi); }
      var n = document.createElement('div'); n.className = 'npp-pagenum';
      page.appendChild(h); page.appendChild(gt); page.appendChild(c);
      page.appendChild(gb); page.appendChild(f); page.appendChild(n);
      host.appendChild(page);
      var p = { page: page, content: c };
      pages.push(p);
      return p;
    }
    function overflowed(p){ return p.content.scrollHeight > p.content.clientHeight + 2; }

    // ── ¿Se puede dividir este bloque entre dos hojas? ──
    // La decisión es ESTRUCTURAL, no por nombre de clase: la mayoría de las cláusulas
    // del contrato son <p> sin clase y los incisos a)/b)/c) son <div> con hijos. Si
    // sólo se dividieran los bloques con clase conocida, esos brincarían enteros a la
    // hoja siguiente y dejarían huecos enormes al final de la página.
    var NOSPLIT_RE = /(^|\s)(sig-row|doc-title|doc-subtitle|doc-sec-head|doc-sec-num|doc-date)(\s|$)/;
    var TAGS_BLOQUE = { DIV:1, P:1, LI:1, OL:1, UL:1, TABLE:1, SECTION:1, ARTICLE:1 };

    // Nunca se parten: firmas, títulos y tablas (deben viajar completos).
    function esDivisible(el){
      if (!el || el.nodeType !== 1) return false;
      if (el.tagName === 'TABLE') return false;
      if (NOSPLIT_RE.test(el.className || '')) return false;
      return true;
    }
    // ¿Es un contenedor de sub-bloques (lista de incisos) o texto corrido?
    function tieneHijosBloque(el){
      for (var i = 0; i < el.children.length; i++){
        if (TAGS_BLOQUE[el.children[i].tagName]) return true;
      }
      return false;
    }
    // ¿Parece el encabezado de una cláusula? ("DÉCIMA CUARTA. – LIMITANTES:")
    // Si queda como último renglón de la hoja, se lo lleva al bloque siguiente
    // para que el título no se separe de su contenido.
    function pareceTitulo(el){
      if (!el || el.nodeType !== 1) return false;
      if (HEADING_RE.test(el.className || '')) return true;
      var t = (el.textContent || '').trim();
      return t.length > 0 && t.length < 90 && /[:：]$/.test(t);
    }

    // Divide un contenedor de sub-bloques moviendo los últimos hijos completos a la
    // hoja siguiente. Nunca parte un inciso por dentro.
    function splitPorHijos(clone, page){
      var rest = clone.cloneNode(false);
      var guard = 0;
      while (overflowed(page) && clone.children.length > 1 && guard++ < 800){
        rest.insertBefore(clone.lastElementChild, rest.firstChild);
      }
      var devolverTodo = function(){
        while (rest.firstChild) clone.appendChild(rest.firstChild);
        return null;
      };
      if (!rest.children.length) return null;          // no hizo falta dividir
      if (!clone.children.length) return devolverTodo(); // no cupo ni un inciso
      if (overflowed(page)) return devolverTodo();       // sigue sin caber: va entero
      return rest;
    }

    // Extrae del final del elemento la última "pieza" (una palabra, o el trozo de
    // un <b>/<u>). Conserva el formato: la pieza devuelta trae su propia etiqueta.
    // Nunca parte una palabra por la mitad.
    function takeLastPiece(el){
      var last = el.lastChild;
      if (!last) return null;
      if (last.nodeType === 3){
        var m = last.nodeValue.match(/^([\s\S]*\S)(\s+\S+\s*)$/);
        if (m){ last.nodeValue = m[1]; return document.createTextNode(m[2]); }
        el.removeChild(last); return last;
      }
      if (last.nodeType === 1){
        var inner = takeLastPiece(last);
        if (inner){ var shell = last.cloneNode(false); shell.appendChild(inner); return shell; }
        el.removeChild(last); return last;
      }
      el.removeChild(last); return null;
    }

    // Divide el clon para que quepa en la hoja actual; regresa el elemento
    // "resto" (misma etiqueta/clase, conserva negritas) o null si no dividió.
    function splitToFit(clone, page){
      var restShell = clone.cloneNode(false);
      // Caso rápido: párrafo de un solo nodo de texto → búsqueda binaria por palabras
      if (clone.childNodes.length === 1 && clone.firstChild.nodeType === 3){
        var fullTxt = clone.firstChild.nodeValue; // para restaurar si no procede dividir
        var words = fullTxt.split(/(\s+)/); // conserva espacios
        var lo = 0, hi = words.length, best = 0;
        while (lo <= hi){
          var mid = (lo + hi) >> 1;
          clone.firstChild.nodeValue = words.slice(0, mid).join('');
          if (overflowed(page)) hi = mid - 1; else { best = mid; lo = mid + 1; }
        }
        // Si no cupo nada (o cabrían menos de ~12 palabras: renglón suelto feo),
        // restaurar el párrafo COMPLETO y no dividir — jamás perder texto.
        if (best < 24){ clone.firstChild.nodeValue = fullTxt; return null; }
        clone.firstChild.nodeValue = words.slice(0, best).join('').replace(/\s+$/,'');
        var restTxt = words.slice(best).join('').replace(/^\s+/,'');
        if (!restTxt){ clone.firstChild.nodeValue = fullTxt; return null; }
        restShell.appendChild(document.createTextNode(restTxt));
        return restShell;
      }
      // Caso general (párrafo con <b>/<u> etc.): quitar piezas del final una a una
      // usando takeLastPiece (definida arriba, compartida con la verificación final).
      var originalHTML = clone.innerHTML; // para restaurar si no procede dividir
      var guard = 0, movedAny = false;
      while (overflowed(page) && guard++ < 3000){
        var piece = takeLastPiece(clone);
        if (!piece) break;
        movedAny = true;
        restShell.insertBefore(piece, restShell.firstChild);
      }
      // Si no cupo nada, quedó casi vacío, o no hay resto: restaurar el párrafo
      // COMPLETO y no dividir — jamás perder ni mutilar texto.
      if (!movedAny || !clone.childNodes.length || (clone.textContent || '').length < 70 || !restShell.childNodes.length){
        clone.innerHTML = originalHTML;
        return null;
      }
      return restShell;
    }

    var cur = newPage();
    for (var b = 0; b < blocks.length; b++){
      var clone = blocks[b].cloneNode(true);
      cur.content.appendChild(clone);
      if (overflowed(cur)){
        var isSplittable = esDivisible(clone);
        var porHijos = isSplittable && tieneHijosBloque(clone);
        // Aprovechar el espacio que queda en la hoja: si el bloque es una lista de
        // incisos se corta ENTRE incisos; si es texto corrido se corta entre palabras.
        if (isSplittable){
          var rest = porHijos ? splitPorHijos(clone, cur) : splitToFit(clone, cur);
          if (rest){
            // La parte que cupo se queda; el resto se procesa como siguiente bloque.
            // Verificación: si tras dividir la hoja SIGUE desbordada (el divisor dejó
            // un renglón de más), se devuelven palabras al "resto" hasta que quepa —
            // así jamás queda una línea recortada por el borde de la hoja.
            var fixGuard = 0;
            while (overflowed(cur) && fixGuard++ < 400){
              // En listas de incisos se devuelve el inciso completo; en texto corrido,
              // palabra por palabra. Nunca se parte un inciso por dentro.
              var back = porHijos
                ? (clone.children.length > 1 ? clone.lastElementChild : null)
                : takeLastPiece(clone);
              if (!back) break;
              rest.insertBefore(back, rest.firstChild);
            }
            blocks.splice(b + 1, 0, rest);
            continue;
          }
        }
        if (cur.content.children.length === 1) continue; // bloque indivisible más alto que una hoja
        cur.content.removeChild(clone);
        // Un título/encabezado no debe quedar como último renglón de la hoja:
        // se lo lleva consigo a la hoja siguiente.
        // (incluye encabezados de cláusula tipo "DÉCIMA CUARTA. – LIMITANTES:",
        //  que antes se quedaban solos al pie de la hoja)
        var pulled = [];
        var last = cur.content.lastElementChild;
        while (last && pareceTitulo(last) && cur.content.children.length > 1){
          pulled.unshift(last); cur.content.removeChild(last); last = cur.content.lastElementChild;
        }
        cur = newPage();
        for (var k = 0; k < pulled.length; k++) cur.content.appendChild(pulled[k]);
        cur.content.appendChild(clone);
        // Si aun así no cabe en la hoja nueva (párrafo larguísimo), dividirlo aquí
        if (overflowed(cur) && isSplittable){
          var rest2 = porHijos ? splitPorHijos(clone, cur) : splitToFit(clone, cur);
          if (rest2){
            var fixGuard2 = 0;
            while (overflowed(cur) && fixGuard2++ < 400){
              var back2 = porHijos
                ? (clone.children.length > 1 ? clone.lastElementChild : null)
                : takeLastPiece(clone);
              if (!back2) break;
              rest2.insertBefore(back2, rest2.firstChild);
            }
            blocks.splice(b + 1, 0, rest2);
          }
        }
      }
    }

    // ── GARANTÍA FINAL: ninguna hoja puede quedar con contenido recortado ──
    // Barrido de seguridad: si alguna hoja quedó desbordada (caso límite que el
    // divisor no pudo resolver), se empujan bloques COMPLETOS del final hacia la
    // hoja siguiente hasta que quepa. Nunca se recorta ni se pierde contenido.
    for (var sp = 0; sp < pages.length; sp++){
      var guardSweep = 0;
      while (overflowed(pages[sp]) && pages[sp].content.children.length > 1 && guardSweep++ < 200){
        var moveEl = pages[sp].content.lastElementChild;
        var nextPage = pages[sp + 1];
        if (!nextPage){
          nextPage = newPage();            // newPage() ya lo agrega a "pages"
        }
        pages[sp].content.removeChild(moveEl);
        nextPage.content.insertBefore(moveEl, nextPage.content.firstChild);
      }
    }
    // Descartar hojas que hayan quedado vacías tras el barrido
    for (var dz = pages.length - 1; dz >= 0; dz--){
      if (!pages[dz].content.children.length){
        if (pages[dz].page.parentNode) pages[dz].page.parentNode.removeChild(pages[dz].page);
        pages.splice(dz, 1);
      }
    }

    for (var pn = 0; pn < pages.length; pn++){
      pages[pn].page.querySelector('.npp-pagenum').textContent = 'P\u00e1gina ' + (pn + 1) + ' de ' + pages.length;
    }
    document.body.classList.add('niva-paginated');
    return true;
  }

  function clearPrintPages(){
    var host = document.getElementById('niva-print-measure');
    if (host) host.innerHTML = '';
    document.body.classList.remove('niva-paginated');
  }

  window.addEventListener('beforeprint', buildPrintPages);
  window.addEventListener('afterprint', clearPrintPages);
  // Expuestos para el flujo de impresión vía PDF (Safari)
  window.__nivaBuildPrintPages = buildPrintPages;
  window.__nivaClearPrintPages = clearPrintPages;
  // Botón "🖨 Imprimir": beforeprint/afterprint ya cubren window.print(), pero algunos
  // navegadores no disparan afterprint de forma consistente — este respaldo garantiza
  // que todo quede limpio después del diálogo.
  var _origPrint = window.print;
  window.print = function(){
    buildPrintPages();
    var r = _origPrint.apply(window, arguments);
    setTimeout(clearPrintPages, 800);
    return r;
  };

  // ===================== VISTA POR HOJAS (previsualización paginada) =====================
  // Muestra en pantalla EXACTAMENTE las mismas hojas que se van a imprimir, para poder
  // ver dónde brinca el texto a la página siguiente y acomodar párrafos antes de mandar
  // a imprimir. Reutiliza el mismo motor de paginación (no hay un segundo cálculo que
  // pueda dar un resultado distinto): se construyen las hojas en el contenedor de
  // medición y luego se trasladan tal cual al contenedor visible.
  window.nivaVistaHojas = true; // por defecto: ver el documento tal como saldrá impreso

  function renderVistaHojas(){
    var cont = document.getElementById('docPages');
    var dp   = document.getElementById('docPreview');
    var btn  = document.getElementById('btn-vista-hojas');
    if (!cont || !dp) return;

    if (!window.nivaVistaHojas){                       // ── vista continua ──
      cont.style.display = 'none'; cont.innerHTML = '';
      dp.style.display = '';
      if (btn) btn.textContent = '📑 Por hojas';
      return;
    }

    // ── vista por hojas ──
    clearPrintPages();
    var ok = buildPrintPages();
    var host = document.getElementById('niva-print-measure');
    if (!ok || !host || !host.children.length){        // sin documento: vista normal
      cont.style.display = 'none'; cont.innerHTML = '';
      dp.style.display = '';
      if (btn) btn.textContent = '📑 Por hojas';
      return;
    }
    // Trasladar las hojas ya medidas (mismo ancho fijo ⇒ el traslado no re-maqueta nada)
    cont.innerHTML = '';
    var hojas = [].slice.call(host.children);
    for (var i = 0; i < hojas.length; i++){
      var rot = document.createElement('div');
      rot.className = 'npp-rotulo';
      rot.textContent = 'Hoja ' + (i + 1) + ' de ' + hojas.length;
      cont.appendChild(rot);
      cont.appendChild(hojas[i]);
    }
    clearPrintPages();                                  // deja el host limpio para imprimir
    dp.style.display = 'none';
    cont.style.display = 'flex';
    if (btn) btn.textContent = '📄 Continua';
  }

  // Repintado con freno: al escribir en el formulario no se recalcula en cada tecla.
  var _tmrHojas = null;
  function programarVistaHojas(){
    if (!window.nivaVistaHojas) return;
    clearTimeout(_tmrHojas);
    _tmrHojas = setTimeout(renderVistaHojas, 260);
  }

  window.nivaToggleVistaHojas = function(){
    window.nivaVistaHojas = !window.nivaVistaHojas;
    renderVistaHojas();
  };
  window.__nivaRenderVistaHojas   = renderVistaHojas;
  window.__nivaProgramarVistaHojas = programarVistaHojas;

  // Engancharse al repintado del documento: cada vez que cambia el contenido, se
  // vuelven a calcular las hojas (con freno) para que el corte mostrado sea el real.
  function engancharRepintado(){
    ['renderPreview','updatePreview','selectDoc','clearForm'].forEach(function(fn){
      var orig = window[fn];
      if (typeof orig !== 'function') return;
      window[fn] = function(){
        var r = orig.apply(this, arguments);
        programarVistaHojas();
        return r;
      };
    });
  }

  if (document.readyState === 'loading'){
    window.addEventListener('DOMContentLoaded', function(){
      engancharRepintado(); setTimeout(renderVistaHojas, 500);
    });
  } else {
    engancharRepintado(); setTimeout(renderVistaHojas, 500);
  }
})();


// ===================== IMPRIMIR (cross-browser) =====================
// Chrome/Edge respetan @page{margin:0} → impresión nativa directa, sin textos del
// navegador. Safari IGNORA @page (imprime con sus márgenes y sus encabezados/pies
// de navegador SIEMPRE), así que en Safari se genera el documento ya paginado como
// PDF y se abre en una pestaña: un PDF impreso no lleva ningún texto del navegador.
async function imprimirNiva(btnEl){
  var isChromium = /Chrome\/|Chromium\/|Edg\//.test(navigator.userAgent);
  if (isChromium){ window.print(); return; }

  // Safari / otros: abrir la pestaña YA (dentro del clic, para que no la bloquee)
  var win = null;
  try { win = window.open('', '_blank'); } catch(e){}
  if (win){
    try { win.document.write('<title>Preparando impresi\u00f3n\u2026</title><body style="font-family:Arial,Helvetica,sans-serif;padding:40px;color:#333">\u23f3 Generando documento para imprimir\u2026</body>'); } catch(e){}
  }
  var btn = btnEl && btnEl.textContent !== undefined ? btnEl : null;
  var prevTxt = btn ? btn.textContent : '';
  if (btn){ btn.disabled = true; btn.textContent = '\u23f3 Preparando\u2026'; }
  try{
    if (!window.__nivaBuildPrintPages || !window.__nivaBuildPrintPages()){
      if (win) try{ win.close(); }catch(e){}
      alert('Selecciona y genera un documento primero.');
      return;
    }
    var host = document.getElementById('niva-print-measure');
    var pages = host ? host.querySelectorAll('.niva-print-page') : [];
    if (!pages.length){ if (win) try{ win.close(); }catch(e){}; alert('No hay contenido para imprimir.'); return; }
    var jsPDFCtor = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : null;
    if (!jsPDFCtor || typeof html2canvas !== 'function'){ if (win) try{ win.close(); }catch(e){}; alert('No se pudieron cargar las librer\u00edas de PDF. Revisa tu conexi\u00f3n e intenta de nuevo.'); return; }
    var pdf = new jsPDFCtor({ orientation:'portrait', unit:'mm', format:'letter' });
    for (var i = 0; i < pages.length; i++){
      var canvas = await html2canvas(pages[i], { scale: 2.5, useCORS: true, logging: false, backgroundColor: '#ffffff' });
      var img = canvas.toDataURL('image/jpeg', 0.92);
      if (i > 0) pdf.addPage();
      pdf.addImage(img, 'JPEG', 0, 0, 215.9, 278); // misma geometr\u00eda que cada hoja construida
    }
    var url = pdf.output('bloburl');
    if (win){ win.location = url; }
    else {
      var w2 = window.open(url, '_blank');
      if (!w2) location.href = url;
    }
  } catch(err){
    if (win) try{ win.close(); }catch(e){}
    alert('No se pudo preparar la impresi\u00f3n: ' + ((err && err.message) || err));
  } finally {
    if (window.__nivaClearPrintPages) window.__nivaClearPrintPages();
    if (btn){ btn.disabled = false; btn.textContent = prevTxt; }
  }
}

function toggleFullscreen() {
  var formCol = document.querySelector('.form-col');

// ===================== DOCUMENT SELECTION =====================
function selectDoc(type) {
  currentDoc = type;
  document.querySelectorAll('.doc-tab').forEach(function(t) { t.classList.remove('active'); });
  var tabs = document.querySelectorAll('.doc-tab');
  var types = ['oferta-renta','oferta-compra','sep-renta','sep-compra','contrato-arrendamiento','contrato-compraventa','exclusividad','visita','entrega','recibo-deposito'];
  var idx = types.indexOf(type);
  if (idx >= 0 && tabs[idx]) tabs[idx].classList.add('active');

  var cfg = DOC_CONFIG[type];
  if (!cfg) return;

  // Show/hide parties
  var p1sec = document.getElementById('sec-party1');
  var p2sec = document.getElementById('sec-party2');
  p1sec.style.display = cfg.hideParties ? 'none' : '';
  p2sec.style.display = (!cfg.hideParties && cfg.party2) ? '' : 'none';

  // Update party labels
  if (cfg.party1) {
    document.getElementById('party1-label').textContent = cfg.party1;
  }
  if (cfg.party2) {
    document.getElementById('party2-label').textContent = cfg.party2;
  }

  // Obligado solidario
  document.getElementById('sec-os').style.display = cfg.showOS ? '' : 'none';

  // Escritura prop
  document.getElementById('sec-escritura-prop').style.display = cfg.showEscrituraProp ? '' : 'none';

  // Simple oferente
  var ofSec = document.getElementById('sec-oferente-simple');
  ofSec.classList.toggle('hidden', !cfg.showSimpleOferente);

  // Monto label
  var montoLabel = document.getElementById('monto-label');
  if (type === 'oferta-compra' || type === 'contrato-compraventa') {
    montoLabel.textContent = 'Precio ofrecido ($)';
  } else {
    montoLabel.textContent = 'Monto de renta mensual ($)';
  }
  document.getElementById('sec-monto-renta').style.display = (cfg.hideFields && cfg.hideFields.includes('sec-monto-renta')) ? 'none' : '';

  // Show/hide dynamic fields
  var allDynamic = ['sec-periodo','sec-deposito','sec-adelantada','sec-garantia','sec-sep-monto',
    'sec-precio-total','sec-mantenimiento','sec-corte','sec-banco','sec-vigencia','sec-plazo',
    'sec-fecha-inicio','sec-peticiones','sec-fecha-fin','sec-fecha-limite','sec-destino'];
  allDynamic.forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    var inShow = cfg.showOfertaFields && cfg.showOfertaFields.includes(id);
    var inHide = cfg.hideFields && cfg.hideFields.includes(id);
    el.classList.toggle('hidden', inHide && !inShow);
    if (inHide) el.classList.add('hidden');
    if (inShow) el.classList.remove('hidden');
  });

  updatePreview();
}

function fmtDate(d) {
  if (!d) return '___________';
  var parts = d.split('-');
  if (parts.length !== 3) return d;
  var months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return parseInt(parts[2]) + ' de ' + months[parseInt(parts[1])-1] + ' de ' + parts[0];
}
function fmtMoney(n) {
  if (!n) return '$0.00';
  return '$' + parseFloat(n).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2});
}
// ph = placeholder cuando el campo está vacío
function ph(val, label, bold) {
  if (val) return bold ? '<b>'+val+'</b>' : val;
  return '<span class="ph">['+label+']</span>';
}
// Monto formateado con letras: $20,000.00 (Veinte mil 00/100 M.N.)
function fmoney(val, labelEmpty) {
  if (!val) return '<span class="ph">[$'+labelEmpty+']</span>';
  var fmt = '$' + parseFloat(val).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
  return fmt + ' (' + toLetras(val) + ' pesos 00/100 M.N.)';
}
// Fecha larga: "17 de agosto de 2026"
function fdate(d) {
  if (!d) return '<span class="ph">[fecha]</span>';

  var M=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return parseInt(p[2])+' de '+M[parseInt(p[1])-1]+' de '+p[0];
}

// Number to Spanish words
function enteroALetras(n) {
  if (n===0) return 'CERO';
  var U=['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE'];
  var D=['','DIEZ','VEINTE','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  var C=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  if (n<20) return U[n];
  if (n===100) return 'CIEN';
  if (n<100) { var d=Math.floor(n/10); var u=n%10; if (d===2) { var V=['VEINTE','VEINTIÚN','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO','VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE']; return V[u]; } return u===0?D[d]:D[d]+' Y '+U[u]; }
  if (n<1000) { var c=Math.floor(n/100); var r=n%100; return r===0?(n===100?'CIEN':C[c]):C[c]+' '+enteroALetras(r); }
  if (n<1000000) { var m=Math.floor(n/1000); var r=n%1000; var ms=m===1?'MIL':enteroALetras(m)+' MIL'; return r===0?ms:ms+' '+enteroALetras(r); }
  if (n<1000000000) { var mm=Math.floor(n/1000000); var r=n%1000000; var mms=mm===1?'UN MILLÓN':enteroALetras(mm)+' MILLONES'; return r===0?mms:mms+' '+enteroALetras(r); }
  return n.toString();
}
function toLetras(num) {
  if (!num || isNaN(num)) return '';
  num = parseFloat(num);
  var entero = Math.floor(num);
  var cents = Math.round((num-entero)*100);
  return enteroALetras(entero) + ' ' + String(cents).padStart(2,'0') + '/100 M.N.';
}
function updateLetras(inputId, outId) {
  var val = document.getElementById(inputId) ? document.getElementById(inputId).value : '';
  var el = document.getElementById(outId);
  if (el) el.textContent = val ? toLetras(val) : '';
}

// ===================== PDF DOWNLOAD =====================
// Genera el PDF a partir de las hojas YA PAGINADAS por el motor de impresión
// (encabezado + contenido + pie en CADA hoja). Antes se capturaba todo el
// documento como una sola imagen larga y se cortaba a ciegas cada 279 mm: eso
// producía páginas sin encabezado, texto pegado al borde superior y renglones
// partidos a la mitad. Ahora cada hoja del paginador es exactamente una página
// del PDF, así que el resultado impreso y el PDF son idénticos.
async function downloadPDF() {
  var btn = event ? event.target : null;
  if (btn) { btn.textContent = '⏳ Generando...'; btn.disabled = true; }

  var built = false;
  try {
    if (!window.__nivaBuildPrintPages || !window.__nivaBuildPrintPages()){
      alert('Selecciona y genera un documento primero.');
      if (btn) { btn.textContent = '⬇ Descargar PDF'; btn.disabled = false; }
      return;
    }
    built = true;

    var host = document.getElementById('niva-print-measure');
    var pages = host ? host.querySelectorAll('.niva-print-page') : [];
    if (!pages.length){
      alert('No hay contenido para generar el PDF.');
      if (window.__nivaClearPrintPages) window.__nivaClearPrintPages();
      if (btn) { btn.textContent = '⬇ Descargar PDF'; btn.disabled = false; }
      return;
    }

    var { jsPDF } = window.jspdf;
    var pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });

    // Una hoja construida  →  una página del PDF. Sin recortes ni desplazamientos.
    for (var p = 0; p < pages.length; p++) {
      if (btn) btn.textContent = '⏳ Página ' + (p + 1) + ' de ' + pages.length + '…';
      var canvas = await html2canvas(pages[p], {
        scale: 2.5, useCORS: true, logging: false, backgroundColor: '#ffffff'
      });
      var imgData = canvas.toDataURL('image/jpeg', 0.92);
      if (p > 0) pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, 0, 215.9, 278); // misma geometría que la hoja
    }

    var docNames = {
      'oferta-renta':'Oferta_Renta','oferta-compra':'Oferta_Compra','sep-renta':'Separacion_Renta',
      'sep-compra':'Separacion_Compra','contrato-arrendamiento':'Contrato_Arrendamiento',
      'contrato-compraventa':'Contrato_Compraventa','exclusividad':'Convenio_Exclusividad',
      'visita':'Registro_Visita','entrega':'Entrega_Recepcion','recibo-deposito':'Recibo_Deposito'
    };
    var p2 = v('p2-nombre') || v('p1-nombre') || v('f-oferente') || '';
    var safeName = p2.replace(/[^a-zA-Z0-9]/g,'_').substring(0,20);
    var today = new Date().toLocaleDateString('es-MX').replace(/\//g,'-');
    pdf.save('NIVA_' + (docNames[currentDoc]||'Documento') + (safeName?'_'+safeName:'') + '_' + today + '.pdf');
  } catch(e) {
    alert('Error al generar PDF: ' + e.message);
  } finally {
    // Desmontar siempre las hojas temporales: la vista de edición queda intacta.
    if (built && window.__nivaClearPrintPages) { try { window.__nivaClearPrintPages(); } catch(e){} }
  }

  if (btn) { btn.textContent = '⬇ Descargar PDF'; btn.disabled = false; }
}

   'os-nombre','os-id-num','os-domicilio','os-tel','os-email','os-escritura','os-notario','os-registro','os-folio',

// ===================== INE OCR =====================
// ─────────────────────────────────────────────────────────────────────────────
// LECTURA DE INE (OCR en el propio navegador: la credencial NUNCA sale de tu equipo)
// ─────────────────────────────────────────────────────────────────────────────

// El CDN de tesseract.js sirve builds con dos APIs distintas según la versión:
//   · API nueva:  createWorker('spa')                      → ya deja listo el idioma
//   · API previa: createWorker() + loadLanguage + initialize
// Si se usa la forma nueva sobre un build viejo, el worker se crea pero se queda
// SIN idioma y al reconocer revienta con "Cannot read properties of null
// (reading 'SetImageFile')" — que además llega como texto, no como Error, por eso
// se veía "Error al leer imagen: undefined". Esta función prueba ambas formas.
async function nivaOCR(imagen, onProgreso){
  if (typeof Tesseract === 'undefined') throw new Error('No se pudo cargar el lector de texto. Revisa tu conexión.');
  var opts = onProgreso ? { logger: onProgreso } : {};

  // 1) Forma clásica (compatible con todas las versiones)
  try {
    var w = await Tesseract.createWorker(opts);
    if (typeof w.loadLanguage === 'function'){
      await w.loadLanguage('spa');
      await w.initialize('spa');
    }
    var out = await w.recognize(imagen);
    await w.terminate();
    if (out && out.data && typeof out.data.text === 'string') return out.data.text;
  } catch(e){ /* se intenta la siguiente forma */ }

  // 2) Atajo de la librería
  try {
    var out2 = await Tesseract.recognize(imagen, 'spa', opts);
    if (out2 && out2.data && typeof out2.data.text === 'string') return out2.data.text;
  } catch(e2){ /* se intenta la siguiente forma */ }

  // 3) API nueva
  var w3 = await Tesseract.createWorker('spa', 1, opts);
  var out3 = await w3.recognize(imagen);
  await w3.terminate();
  if (out3 && out3.data && typeof out3.data.text === 'string') return out3.data.text;
  throw new Error('El lector no devolvió texto.');
}

// Realza la foto antes de leerla: escala de grises + más contraste + ampliación.
// En fotos de credencial tomadas con el celular esto mejora bastante el acierto.
function nivaPrepararImagen(file){
  return new Promise(function(resolve){
    var img = new Image();
    img.onload = function(){
      var escala = Math.min(3, Math.max(1, 1600 / Math.max(img.width, img.height)));
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.width * escala);
      cv.height = Math.round(img.height * escala);
      var g = cv.getContext('2d');
      g.drawImage(img, 0, 0, cv.width, cv.height);
      try {
        var d = g.getImageData(0, 0, cv.width, cv.height), p = d.data;
        for (var i = 0; i < p.length; i += 4){
          var gris = 0.299*p[i] + 0.587*p[i+1] + 0.114*p[i+2];
          gris = (gris - 128) * 1.45 + 128;            // contraste
          gris = gris < 0 ? 0 : (gris > 255 ? 255 : gris);
          p[i] = p[i+1] = p[i+2] = gris;
        }
        g.putImageData(d, 0, 0);
      } catch(e){ /* si el canvas no deja leer píxeles, se usa tal cual */ }
      cv.toBlob(function(b){ resolve(b || file); }, 'image/png');
    };
    img.onerror = function(){ resolve(file); };
    img.src = URL.createObjectURL(file);
  });
}

// Interpreta el texto crudo del OCR con la estructura real de una credencial INE.
function nivaLeerDatosINE(texto){
  var RUIDO = /INSTITUTO|NACIONAL|ELECTORAL|CREDENCIAL|PARA VOTAR|ESTADOS UNIDOS|MEXICANOS|M[EÉ]XICO|REGISTRO|FEDERAL|ELECTORES/i;
  var lineas = texto.split('\n').map(function(l){ return l.replace(/\s+/g,' ').trim(); }).filter(Boolean);

  function esMayus(l){
    return /^[A-ZÁÉÍÓÚÑÜ0-9''´.,#\-\/ ]+$/.test(l) && /[A-ZÁÉÍÓÚÑ]/.test(l);
  }

  // ── NOMBRE ── en la INE viene tras la etiqueta "NOMBRE", en 1 a 3 renglones
  // (apellido paterno, apellido materno, nombre de pila).
  var nombre = '';
  var iNom = -1;
  for (var i = 0; i < lineas.length; i++){
    if (/^NOMBRE\b/i.test(lineas[i]) && lineas[i].length < 20){ iNom = i; break; }
  }
  if (iNom >= 0){
    var partes = [];
    for (var j = iNom + 1; j < lineas.length && partes.length < 3; j++){
      var L = lineas[j];
      if (/^(DOMICILIO|CLAVE|CURP|FECHA|SEXO|A[NÑ]O|SECCI[OÓ]N|VIGENCIA)\b/i.test(L)) break;
      if (RUIDO.test(L) || !esMayus(L) || L.length < 3) continue;
      partes.push(L);
    }
    nombre = partes.join(' ').trim();
  }
  if (!nombre){   // sin etiqueta: el renglón más largo en mayúsculas que no sea ruido
    var cand = lineas.filter(function(l){
      return l.length > 7 && l.length < 60 && esMayus(l) && !RUIDO.test(l) &&
             !/\d{4}/.test(l) && l.split(' ').length >= 2 && l.split(' ').length <= 6;
    });
    nombre = cand.length ? cand[0] : '';
  }

  // ── DOMICILIO ── renglones entre "DOMICILIO" y la siguiente etiqueta
  var domicilio = '';
  var iDom = lineas.findIndex(function(l){ return /^DOMICILIO\b/i.test(l); });
  if (iDom >= 0){
    var dl = [];
    for (var k = iDom + 1; k < lineas.length; k++){
      var D = lineas[k];
      if (/^(CLAVE|CURP|FECHA|SEXO|A[NÑ]O|SECCI[OÓ]N|VIGENCIA|EMISI[OÓ]N|ESTADO|MUNICIPIO|LOCALIDAD)\b/i.test(D)) break;
      if (RUIDO.test(D)) continue;
      dl.push(D);
      if (dl.length >= 4) break;
    }
    domicilio = dl.join(', ');
  }
  if (!domicilio){
    domicilio = lineas.filter(function(l){
      return /\bCALLE|\bC\.?P\.?\s*\d|\bCOL\.?\b|\bCOLONIA|\bMPIO|\bMUNICIPIO|\bNUM\b|\bN[UÚ]M/i.test(l);
    }).slice(0,4).join(', ');
  }

  // ── IDENTIFICADORES ──
  var limpio = texto.replace(/\s+/g,' ').toUpperCase();
  var curp  = (limpio.match(/[A-Z]{4}\d{6}[HM][A-Z]{5}[0-9A-Z]\d/) || [])[0] || '';
  var clave = '';
  var mClave = limpio.match(/CLAVE\s*DE\s*ELECTOR\s*:?\s*([A-Z0-9]{18})/);
  if (mClave) clave = mClave[1];
  else { var m2 = limpio.match(/\b[A-Z]{6}\d{8}[HM]\d{3}\b/); if (m2) clave = m2[0]; }

  return { nombre: nombre, domicilio: domicilio, idNum: clave || curp, curp: curp, clave: clave };
}

async function extractINE(input, party) {
  var file = input.files[0];
  if (!file) return;
  var statusEl = document.getElementById('ine'+party+'-status');
  var poner = function(t){ if (statusEl) statusEl.textContent = t; };
  poner('⏳ Preparando imagen…');

  try {
    var img = await nivaPrepararImagen(file);
    poner('⏳ Leyendo credencial… 0%');
    var texto = await nivaOCR(img, function(m){
      if (m && m.status === 'recognizing text' && typeof m.progress === 'number'){
        poner('⏳ Leyendo credencial… ' + Math.round(m.progress * 100) + '%');
      }
    });

    var d = nivaLeerDatosINE(texto || '');

    if (d.nombre)    document.getElementById('p'+party+'-nombre').value = d.nombre;
    if (d.nombre)    document.getElementById('p'+party+'-id-tipo').value = 'INE';
    if (d.domicilio) document.getElementById('p'+party+'-domicilio').value = d.domicilio;
    if (d.idNum)     document.getElementById('p'+party+'-id-num').value = d.idNum;

    var puestos = [];
    if (d.nombre) puestos.push('nombre');
    if (d.domicilio) puestos.push('domicilio');
    if (d.idNum) puestos.push('clave');

    if (puestos.length){
      poner('✅ Se llenó: ' + puestos.join(', ') + ' — revisa que esté correcto');
    } else if ((texto||'').trim().length > 20){
      poner('⚠️ Se leyó la imagen pero no se reconocieron los campos. Captura a mano.');
    } else {
      poner('⚠️ No se pudo leer la credencial. Prueba con una foto más nítida, de frente y con buena luz.');
    }
    updatePreview();
  } catch(e) {
    // El lector a veces rechaza con texto plano en vez de un Error: se contemplan ambos.
    var msg = (e && e.message) ? e.message : String(e || 'error desconocido');
    poner('❌ No se pudo leer la credencial: ' + msg);
  }
}
</script>
<script>
/* ══════════════════════════════════════════════════════════════
   NIVA DOCS — SISTEMA DE FOLIOS (P0)
   Folio único por documento: NIVA-{TIPO}-{AAAAMMDD}-{###}
   - Se asigna automáticamente al descargar el PDF (o manualmente).
   - Aparece impreso en el documento (dentro de #docPreview → sale en el PDF).
   - Se registra en localStorage con un snapshot del formulario,
     recuperable desde el panel "Recientes".
   - No modifica ningún generador ni el contenido legal de los documentos.
   ══════════════════════════════════════════════════════════════ */
(function(){
  var TIPO_PREF = {
    'oferta-renta':'OFR','oferta-compra':'OFC','sep-renta':'SPR','sep-compra':'SPC',
    'contrato-arrendamiento':'ARR','contrato-compraventa':'CPV','exclusividad':'EXC',
    'visita':'VIS','entrega':'ENT','recibo-deposito':'RDP'
  };
  var TIPO_NOMBRE = {
    'oferta-renta':'Oferta de renta','oferta-compra':'Oferta de compra','sep-renta':'Separación renta',
    'sep-compra':'Separación compra','contrato-arrendamiento':'Contrato arrendamiento',
    'contrato-compraventa':'Contrato compraventa','exclusividad':'Exclusividad','visita':'Registro de visita',
    'entrega':'Entrega-recepción','recibo-deposito':'Recibo de depósito'
  };
  var LS_KEY = 'niva_docs_registry';
  window.nivaFolioActual = null;

  function leerRegistro(){
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch(e){ return []; }
  }
  function guardarRegistro(r){
    try { localStorage.setItem(LS_KEY, JSON.stringify(r.slice(0,200))); } catch(e){}
  }
  function hoyStr(){
    var d = new Date();
    return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  }
  function snapshotForm(){
    var snap = {};
    document.querySelectorAll('input[id], select[id], textarea[id]').forEach(function(el){
      if (el.type === 'file') return;
      if (el.type === 'checkbox' || el.type === 'radio') snap[el.id] = el.checked;
      else snap[el.id] = el.value;
    });
    return snap;
  }
  function restaurarForm(snap){
    Object.keys(snap || {}).forEach(function(id){
      var el = document.getElementById(id);
      if (!el) return;
      if (el.type === 'checkbox' || el.type === 'radio') el.checked = !!snap[id];
      else el.value = snap[id];
    });
  }
  function generarFolio(tipo){
    var pref = TIPO_PREF[tipo] || 'DOC';
    var fecha = hoyStr();
    var reg = leerRegistro();
    var n = reg.filter(function(r){ return r.tipo === tipo && r.folio.indexOf(fecha) >= 0; }).length + 1;
    var folio;
    do {
      folio = 'NIVA-' + pref + '-' + fecha + '-' + String(n).padStart(3,'0');
      n++;
    } while (reg.some(function(r){ return r.folio === folio; })); // nunca duplicar
    return folio;
  }
  function resumenPartes(){
    var a = (document.getElementById('p1-nombre')||{}).value || '';
    var b = (document.getElementById('p2-nombre')||{}).value || '';
    var d = (document.getElementById('prop-dir')||{}).value || '';
    return [a,b,d].filter(Boolean).join(' · ').slice(0,90);
  }
  window.nivaAsignarFolio = function(){
    if (window.nivaFolioActual) return window.nivaFolioActual;
    var tipo = (typeof currentDoc !== 'undefined') ? currentDoc : 'doc';
    var folio = generarFolio(tipo);
    window.nivaFolioActual = folio;
    var reg = leerRegistro();
    reg.unshift({ folio: folio, tipo: tipo, tipoNombre: TIPO_NOMBRE[tipo]||tipo, fecha: new Date().toISOString(), resumen: resumenPartes(), form: snapshotForm() });
    guardarRegistro(reg);
    inyectarFolioEnPreview();
    actualizarBadgeFolio();
    return folio;
  };
  // El folio es un dato INTERNO de control: se genera y se guarda en el registro,
  // pero no se dibuja en el documento — ni en el PDF, ni al imprimir, ni en la
  // vista previa (la pantalla debe verse exactamente igual que la hoja impresa).
  // Para consultarlo está el indicador de folio de la barra, fuera del documento.
  function inyectarFolioEnPreview(){
    var old = document.getElementById('niva-folio-line');
    if (old && old.parentNode) old.parentNode.removeChild(old);
  }
  function actualizarBadgeFolio(){
    var b = document.getElementById('niva-folio-badge');
    if (b) b.textContent = window.nivaFolioActual ? ('Folio: ' + window.nivaFolioActual) : 'Sin folio asignado';
  }

  // ── Wraps (sin tocar los originales) ──
  var _renderPreview = window.renderPreview;
  if (typeof _renderPreview === 'function') {
    window.renderPreview = function(){
      var r = _renderPreview.apply(this, arguments);
      inyectarFolioEnPreview();
      return r;
    };
  }
  var _selectDoc = window.selectDoc;
  if (typeof _selectDoc === 'function') {
    window.selectDoc = function(){
      window.nivaFolioActual = null; // nuevo tipo ⇒ documento nuevo ⇒ folio nuevo
      var r = _selectDoc.apply(this, arguments);
      actualizarBadgeFolio();
      return r;
    };
  }
  var _downloadPDF = window.downloadPDF;
  if (typeof _downloadPDF === 'function') {
    window.downloadPDF = function(){
      window.nivaAsignarFolio(); // asegura folio antes de capturar el PDF
      return _downloadPDF.apply(this, arguments);
    };
  }
  var _clearForm = window.clearForm;
  if (typeof _clearForm === 'function') {
    window.clearForm = function(){
      var r = _clearForm.apply(this, arguments);
      window.nivaFolioActual = null;
      actualizarBadgeFolio();
      inyectarFolioEnPreview();
      return r;
    };
  }

  // ── UI: badge + panel de recientes ──
  function construirUI(){
    var bar = document.createElement('div');
    bar.id = 'nivaDocsToolbar';
    bar.style.cssText = 'position:fixed;bottom:14px;right:14px;z-index:9999;display:flex;gap:8px;align-items:center;font-family:Arial,sans-serif;';
    bar.innerHTML =
      '<span id="niva-folio-badge" style="background:#1B2A4A;color:#C9A84C;font-size:11px;font-weight:700;padding:8px 12px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.25);">Sin folio asignado</span>' +
      '<button id="niva-docs-recientes-btn" style="background:#C9A84C;color:#1B2A4A;border:0;border-radius:999px;padding:8px 14px;font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25);">📂 Recientes</button>';
    document.body.appendChild(bar);
    var panel = document.createElement('div');
    panel.id = 'niva-docs-recientes';
    panel.style.cssText = 'position:fixed;bottom:60px;right:14px;z-index:9999;width:340px;max-height:420px;overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 16px 50px rgba(0,0,0,.25);display:none;font-family:Arial,sans-serif;';
    document.body.appendChild(panel);
    document.getElementById('niva-docs-recientes-btn').onclick = function(){
      if (panel.style.display === 'none') { pintarPanel(); panel.style.display = 'block'; }
      else panel.style.display = 'none';
    };
    function pintarPanel(){
      var reg = leerRegistro();
      if (!reg.length) { panel.innerHTML = '<div style="padding:18px;font-size:12.5px;color:#64748b;text-align:center;">Aún no hay documentos con folio.<br>El folio se asigna al descargar el PDF.</div>'; return; }
      var html = '<div style="padding:10px 14px;font-size:11px;font-weight:800;color:#1B2A4A;letter-spacing:.08em;border-bottom:2px solid #C9A84C;">DOCUMENTOS RECIENTES</div>';
      reg.slice(0,20).forEach(function(r, i){
        var f = new Date(r.fecha);
        html += '<div style="padding:10px 14px;border-bottom:1px solid #f1f4f9;">' +
          '<div style="font-size:12px;font-weight:700;color:#1B2A4A;">' + r.folio + '</div>' +
          '<div style="font-size:11px;color:#64748b;margin:2px 0;">' + (r.tipoNombre||r.tipo) + ' · ' + f.toLocaleDateString('es-MX') + ' ' + f.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}) + '</div>' +
          (r.resumen ? '<div style="font-size:11px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + r.resumen.replace(/</g,'&lt;') + '</div>' : '') +
          '<button data-i="' + i + '" class="niva-reabrir" style="margin-top:6px;background:#f1f4f9;border:1px solid #e2e8f0;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;color:#1B2A4A;cursor:pointer;">↩ Reabrir</button>' +
          '</div>';
      });
      panel.innerHTML = html;
      panel.querySelectorAll('.niva-reabrir').forEach(function(b){
        b.onclick = function(){
          var r = leerRegistro()[Number(b.dataset.i)];
          if (!r) return;
          if (typeof _selectDoc === 'function') _selectDoc(r.tipo); // usa el original: no borra el folio
          restaurarForm(r.form);
          window.nivaFolioActual = r.folio;
          actualizarBadgeFolio();
          if (typeof window.updatePreview === 'function') window.updatePreview();
          panel.style.display = 'none';
        };
      });
    }
  }
  /* UI flotante de folio removida a peticion de Ricardo — el folio se sigue asignando e imprimiendo en el documento */
})();
</script>

<script>
// ── Edición directa del documento + descarga en Word ──
let nivaEditMode = false;
let nivaDocEditado = false; // tras editar a mano, el formulario ya no regenera (protege tus cambios)
function nivaToggleEdit(){
  var prev = document.getElementById('docPreview');
  var btn = document.getElementById('btn-edit-doc');
  // El texto se edita sobre el documento corrido; si estabas viendo las hojas,
  // se cambia solo a vista continua para poder escribir, y al terminar se
  // regresa a las hojas para ver cómo quedó el corte de página.
  if (!nivaEditMode && window.nivaVistaHojas){
    window.nivaVistaHojas = false;
    if (window.__nivaRenderVistaHojas) window.__nivaRenderVistaHojas();
    window.__nivaVolverAHojas = true;
  } else if (nivaEditMode && window.__nivaVolverAHojas){
    window.__nivaVolverAHojas = false;
    window.nivaVistaHojas = true;
    setTimeout(function(){ if (window.__nivaRenderVistaHojas) window.__nivaRenderVistaHojas(); }, 60);
  }
  nivaEditMode = !nivaEditMode;
  prev.contentEditable = nivaEditMode ? 'true' : 'false';
  prev.style.outline = nivaEditMode ? '2px dashed #c9a84c' : 'none';
  prev.style.outlineOffset = '4px';
  btn.textContent = nivaEditMode ? '✅ Terminar edición' : '✏️ Editar texto';
  btn.style.background = nivaEditMode ? '#16a34a' : '#2a2a2a';
  if (nivaEditMode) { nivaDocEditado = true; prev.focus(); }
  else if (nivaDocEditado) { btn.textContent = '✏️ Seguir editando'; }
}
// Mientras se edita, el formulario NO re-genera el documento (para no perder tus cambios).
(function(){
  var _rp = window.renderPreview;
  window.renderPreview = function(){ if (nivaEditMode || nivaDocEditado) return; return _rp.apply(this, arguments); };
})();
(function(){
  var _sd = window.selectDoc;
  if (typeof _sd === 'function') window.selectDoc = function(){ nivaDocEditado = false; nivaEditMode = false; var p=document.getElementById('docPreview'); if(p){p.contentEditable='false'; p.style.outline='none';} var b=document.getElementById('btn-edit-doc'); if(b){b.textContent='✏️ Editar texto'; b.style.background='#2a2a2a';} return _sd.apply(this, arguments); };
  var _cf = window.clearForm;
  if (typeof _cf === 'function') window.clearForm = function(){ var r = _cf.apply(this, arguments); nivaDocEditado = false; nivaEditMode = false; var p=document.getElementById('docPreview'); if(p){p.contentEditable='false'; p.style.outline='none';} var b=document.getElementById('btn-edit-doc'); if(b){b.textContent='✏️ Editar texto'; b.style.background='#2a2a2a';} renderPreview(); return r; };
})();
function nivaDownloadWord(){
  try { if (typeof window.nivaAsignarFolio === 'function') window.nivaAsignarFolio(); } catch(e){}
  var prev = document.getElementById('docPreview');
  var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Documento NIVA</title><style>body{font-family:Arial,sans-serif;font-size:11pt;line-height:1.45;color:#111} @page{size:letter;margin:2.2cm}</style></head><body>' + prev.innerHTML + '</body></html>';
  var blob = new Blob(['\ufeff', html], {type:'application/msword'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  var folio = window.nivaFolioActual ? '_' + window.nivaFolioActual : '';
  a.download = 'NIVA_' + (typeof currentDoc !== 'undefined' ? currentDoc : 'documento') + folio + '.doc';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
}
</script>
